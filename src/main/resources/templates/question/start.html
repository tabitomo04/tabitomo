<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 취향 설문 시작</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .question-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .btn-start {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            background-color: #4e73df;
            border: none;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .btn-start:hover {
            background-color: #2e59d9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 115, 223, 0.3);
        }
    </style>
</head>
<body class="bg-light">
    <div th:replace="fragments/header :: header"></div>
    
    <div class="container">
        <div class="question-container text-center">
            <h1 class="mb-4">여행 취향 설문 조사</h1>
            <p class="lead mb-4">
                당신의 여행 취향을 파악하여 맞춤형 여행 추천을 받아보세요.<br>
                설문은 약 3분 정도 소요되며, 더 나은 서비스 제공을 위해 꼭 참여해 주세요!
            </p>
            <div class="my-5">
                <i class="fas fa-4x fa-clipboard-check text-primary mb-4"></i>
            </div>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a th:href="@{/question/form}" class="btn btn-primary btn-lg px-4 me-sm-3">
                    <i class="fas fa-play me-2"></i> 시작하기
                </a>
                <a th:href="@{/}" class="btn btn-outline-secondary btn-lg px-4">
                    <i class="fas fa-home me-2"></i> 나중에 하기
                </a>
            </div>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
