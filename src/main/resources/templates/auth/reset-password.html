<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::#content}, ~{::title}, ~{::link}, ~{::script})"}">
<head>
    <title>비밀번호 재설정 - 타비토모</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div id="content">
        <div class="auth-container">
            <div class="auth-logo">
                <img th:src="@{/image/logo.svg}" alt="타비토모 로고">
                <h1 class="h4 mb-4 fw-bold">비밀번호 재설정</h1>
            </div>
            
            <div id="resetFormContainer">
                <p class="text-muted mb-4">새로운 비밀번호를 설정해주세요.</p>
                
                <form id="resetPasswordForm" novalidate>
                    <input type="hidden" id="token" th:value="${param.token}">
                    
                    <div class="mb-3">
                        <div class="form-floating">
                            <input type="password" class="form-control" id="password" name="password" 
                                   placeholder="새 비밀번호 (8~20자, 영문, 숫자, 특수문자 포함)" required
                                   pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,20}$">
                            <label for="password">새 비밀번호 (8~20자, 영문, 숫자, 특수문자 포함)</label>
                            <div class="invalid-feedback">
                                비밀번호는 8~20자리이며, 영문, 숫자, 특수문자를 모두 포함해야 합니다.
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="form-floating">
                            <input type="password" class="form-control" id="confirmPassword" 
                                   placeholder="새 비밀번호 확인" required>
                            <label for="confirmPassword">새 비밀번호 확인</label>
                            <div id="passwordMatchError" class="error-message"></div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">비밀번호 재설정</button>
                </form>
                
                <div class="auth-footer mt-4">
                    <a href="/login">로그인</a> 또는 <a href="/signup">회원가입</a>
                </div>
            </div>
            
            <div id="successMessage" class="text-center d-none">
                <div class="mb-4">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                </div>
                <h4 class="mb-3">비밀번호가 성공적으로 변경되었습니다.</h4>
                <p class="text-muted mb-4">새로운 비밀번호로 로그인해주세요.</p>
                <a href="/login" class="btn btn-primary">로그인 하기</a>
            </div>
            
            <div id="errorMessage" class="alert alert-danger d-none" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="errorText">비밀번호 재설정 중 오류가 발생했습니다.</span>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const resetPasswordForm = document.getElementById('resetPasswordForm');
            const resetFormContainer = document.getElementById('resetFormContainer');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const passwordMatchError = document.getElementById('passwordMatchError');
            
            // Check for token in URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showError('유효하지 않은 비밀번호 재설정 링크입니다.');
                resetPasswordForm.style.display = 'none';
                return;
            }
            
            // Password confirmation
            confirmPasswordInput.addEventListener('input', validatePasswordMatch);
            passwordInput.addEventListener('input', validatePasswordMatch);
            
            function validatePasswordMatch() {
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                
                if (confirmPassword && password !== confirmPassword) {
                    passwordMatchError.textContent = '비밀번호가 일치하지 않습니다.';
                    return false;
                } else {
                    passwordMatchError.textContent = '';
                    return true;
                }
            }
            
            // Form submission
            resetPasswordForm.addEventListener('submit', async function(event) {
                event.preventDefault();
                
                // Reset error messages
                hideError();
                
                // Validate form
                if (!resetPasswordForm.checkValidity()) {
                    event.stopPropagation();
                    resetPasswordForm.classList.add('was-validated');
                    return;
                }
                
                // Validate password match
                if (!validatePasswordMatch()) {
                    return;
                }
                
                // Prepare form data
                const formData = {
                    token: token,
                    newPassword: passwordInput.value,
                    confirmPassword: confirmPasswordInput.value
                };
                
                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData)
                    });
                    
                    if (response.ok) {
                        // Show success message
                        resetFormContainer.classList.add('d-none');
                        successMessage.classList.remove('d-none');
                    } else {
                        const data = await response.json();
                        throw new Error(data.message || '비밀번호 재설정에 실패했습니다.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showError(error.message || '비밀번호 재설정 중 오류가 발생했습니다.');
                }
            });
            
            function showError(message) {
                errorText.textContent = message;
                errorMessage.classList.remove('d-none');
                
                // Scroll to error message
                errorMessage.scrollIntoView({ behavior: 'smooth' });
            }
            
            function hideError() {
                errorMessage.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
