plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '3.3.2'
}

group = 'com.koreatravel'
version = '0.0.1-SNAPSHOT'
description = 'Tabitomo Travel Platform'

// Configure Java compilation for all tasks
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
    options.compilerArgs << '-Xlint:unchecked'
    options.compilerArgs << '-Xlint:deprecation'
}

tasks.withType(Test) {
    jvmArgs += ['-Dspring.test.constructor.autowire.mode=all']
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    
    // For Spring Boot 3.x
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

// Ensure the parameters are available at runtime
tasks.named('compileJava') {
    inputs.files(tasks.named('processResources'))
    options.compilerArgs << '-parameters'
}

tasks.named('compileTestJava') {
    options.compilerArgs << '-parameters'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

ext {
    snippetsDir = file("build/generated-snippets")
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-web-services'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // Database
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    runtimeOnly 'com.h2database:h2' // For testing


    // Session Management with JDBC
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.springframework.session:spring-session-core'

    // Thymeleaf + Security
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.0'

    // Utilities
    implementation 'com.opencsv:opencsv:5.8' // CSV processing
    implementation 'org.jsoup:jsoup:1.17.2' // HTML parsing
    implementation 'net.coobird:thumbnailator:0.4.19' // Image processing

    // Google Cloud Services
    implementation 'com.google.cloud:google-cloud-translate:2.38.0'
    
    // DeepL API
    implementation 'com.deepl.api:deepl-java:1.7.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Jakarta Mail API
    implementation 'com.sun.mail:jakarta.mail:2.0.1'

    // Validation
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
    options.encoding = 'UTF-8'
}

tasks.named('compileJava') {
    options.compilerArgs << "-parameters"
}
