<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head th:replace="~{fragments/header :: head}">
    <title>나의 여행 계획 - Tabitomo</title>
    <link rel="stylesheet" href="/css/trip.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Navigation Menu -->
<div th:replace="~{fragments/menu :: menu}"></div>

<!-- Main Content -->
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">나의 여행 계획</h1>
        <a href="/trip/new" class="btn btn-primary">
            <i class="fas fa-plus me-1"></i> 새 여행 계획
        </a>
    </div>

    <div th:if="${!trips.isEmpty()}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div th:each="trip : ${trips}" class="col">
            <div class="card h-100">
                <div class="card-header bg-primary text-white">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" th:text="${trip.title}">여행 제목</h5>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" 
                                    id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                            <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                                <li>
                                    <a class="dropdown-item" th:href="@{/trip/} + ${trip.id} + '/edit'">
                                        <i class="fas fa-edit me-1"></i> 수정
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item text-danger" href="#" 
                                       th:onclick="'deleteTrip(' + ${trip.id} + '); return false;'">
                                        <i class="fas fa-trash-alt me-1"></i> 삭제
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <div class="text-muted small mb-1">여행 기간</div>
                        <div th:text="${#temporals.format(trip.startDate, 'yyyy년 MM월 dd일')} + ' - ' + 
                                     ${#temporals.format(trip.endDate, 'yyyy년 MM월 dd일')}">
                            2023년 01월 01일 - 2023년 01월 03일
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="text-muted small mb-1">숙소</div>
                        <div th:if="${trip.accommodation != null}" th:text="${trip.accommodation.name}">
                            숙소 이름
                        </div>
                        <div th:unless="${trip.accommodation != null}" class="text-muted">
                            등록된 숙소가 없습니다.
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge bg-light text-dark">
                            <i class="fas fa-calendar-day me-1"></i>
                            <span th:text="${#temporals.daysBetween(trip.startDate, trip.endDate) + 1} + '박 ' + 
                                          ${#temporals.daysBetween(trip.startDate, trip.endDate) + 2} + '일'">
                                2박 3일
                            </span>
                        </span>
                        <a th:href="@{/trip/} + ${trip.id}" class="btn btn-sm btn-outline-primary">
                            자세히 보기 <i class="fas fa-arrow-right ms-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${trips.isEmpty()}" class="text-center py-5">
        <div class="mb-4">
            <i class="fas fa-plane-departure fa-4x text-muted mb-3"></i>
            <h3>아직 여행 계획이 없습니다</h3>
            <p class="text-muted">새로운 여행 계획을 만들어보세요!</p>
        </div>
        <a href="/trip/new" class="btn btn-primary btn-lg">
            <i class="fas fa-plus me-2"></i> 여행 계획 만들기
        </a>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">여행 계획 삭제</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                정말로 이 여행 계획을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <form id="deleteForm" method="post" action="">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-danger">삭제하기</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Handle trip deletion
    function deleteTrip(tripId) {
        const deleteForm = document.getElementById('deleteForm');
        deleteForm.action = `/trip/${tripId}/delete`;
        
        // Show the modal
        const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
        modal.show();
    }
    
    // Initialize tooltips
    document.addEventListener('DOMContentLoaded', function() {
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
    });
</script>
</body>
</html>
