<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko" id="htmlTag">

<head th:replace="~{fragments/header :: head}"></head>
<body>
<!-- Header and Navigation Menu (Combined) -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- chatbot -->
<div th:replace="~{fragments/chatbot-button :: chatbot-container}"></div>
<link rel="stylesheet" href="/css/chatbot.css">
<script th:src="@{/js/chatbot.js}"></script>

<!-- Main Content -->
<main class="py-5">
    <!-- Hero Section -->
    <section class="hero-section text-center py-5 bg-light rounded-3 mb-5">
        <div class="container px-4">
            <h1 class="display-4 fw-bold mb-4" data-translatable>당신의 완벽한 여행을 찾아보세요</h1>
            <p class="lead mb-4" data-translatable>Tabitomo와 함께라면 여행 계획이 한결 쉬워집니다.</p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a href="/tripselect/step1" class="btn btn-primary btn-lg px-4 gap-3" data-translatable>여행지 추천받기</a>
                <a href="#features" class="btn btn-outline-secondary btn-lg px-4" data-translatable>자세히 알아보기</a>
            </div>
        </div>
    </section>

    <!-- Popular Destinations -->
    <section class="popular-destinations mb-5" th:if="${not #lists.isEmpty(cities)}">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h3 mb-0" data-translatable>인기 여행지</h2>
                <a href="/tripinformation" class="btn btn-sm btn-outline-primary" data-translatable>전체보기</a>
            </div>
            <div class="row g-4">
                <!-- Dynamic Cities from Database -->
                <div class="col-md-4" th:each="city : ${cities}">
                    <div class="card h-100">
                        <img th:src="${city.image_url != null ? '/image/local-image/' + city.image_url : '/images/default-placeholder.png'}" 
                             th:alt="${city.city}" 
                             class="card-img-top" 
                             onerror="this.onerror=null; this.src='/images/default-placeholder.png';">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${city.city}" data-translatable>도시명</h5>
                            <p class="card-text" th:text="${city.description}" data-translatable>도시 설명이 여기에 표시됩니다.</p>
                            <a th:href="@{/travel/} + ${city.city}" class="btn btn-sm btn-outline-primary" data-translatable>탐험하기</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Storybook Section -->
    <section class="popular-storybooks mb-5" th:if="${not #lists.isEmpty(storylist)}">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h3 mb-0" data-translatable>인기 스토리북</h2>
                <a href="/storybook/list" class="btn btn-sm btn-outline-primary" data-translatable>전체보기</a>
            </div>
            <div class="row g-4">
                <div class="col-md-4" th:each="story : ${storylist}">
                    <div class="card h-100">
                        <div class="thumbnail">
                            <img th:src="${story.thumbnail != null ? story.thumbnail : '/image/tomo.png'}"
                                 alt="썸네일"
                                 class="card-img-top"
                                 onerror="this.onerror=null; this.src='/image/tomo.png';">
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="card-title mb-0" th:text="${story.title}" data-translatable>제목</h5>
                                <span class="likes d-flex align-items-center gap-1">
                                    <span th:text="'❤'" th:style="${story.isLiked} ? 'color:red' : 'color:black'"></span>
                                    <span th:text="${story.likes}"></span>
                                </span>
                            </div>
                            <p class="card-text" th:text="${story.subtitle}" data-translatable>부제목</p>
                        </div>

                        <div class="card-footer d-flex justify-content-between small text-muted" style="background-color: #ffffff;">
                            <span th:text="${story.nickname}"></span>
                            <span th:text="${#temporals.format(story.createDate, 'yy.MM.dd')}"></span>
                        </div>

                        <!-- 카드 전체 클릭 가능하도록 링크 -->
                        <a th:href="@{'/storybook/detail?booknum=' + ${story.booknum}}" class="stretched-link"></a>
                    </div>
                </div>
            </div>
        </div>
    </section>

</main>

<!-- 설문조사 안내 모달 (JavaScript에서 표시 여부 결정) -->
<div class="modal fade" id="surveyModal" tabindex="-1" role="dialog" aria-labelledby="surveyModalLabel" aria-hidden="true" style="display: none;">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="surveyModalLabel">환영합니다! 🎉</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>여행 취향을 파악하기 위한 간단한 설문조사에 참여해주세요.</p>
        <p>설문조사를 완료하시면 맞춤형 여행 추천을 받아보실 수 있습니다.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">나중에 하기</button>
        <button type="button" class="btn btn-primary" onclick="goToSurvey()">설문조사 하러 가기</button>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- Styles for modal and chatbot -->
<style>
    /* 설문조사 모달 스타일 */
    .modal-content {
        border: none;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .modal-header {
        border-bottom: 1px solid #eee;
        background-color: #f8f9fa;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
    }

    .modal-title {
        color: #333;
        font-weight: 600;
    }
</style>

<!-- Scripts -->
<script th:inline="javascript">
    // 서버에서 전달된 데이터 가져오기
    const appData = {
        isAuthenticated: /*[[${isAuthenticated}]]*/ false,
        showQuestionnairePrompt: /*[[${showQuestionnairePrompt}]]*/ false,
        questionnaireCompleted: /*[[${questionnaireCompleted}]]*/ false,
        email: /*[[${email}]]*/ '',
        sessionId: /*[[${sessionId}]]*/ ''
    };
    
    // 인증된 사용자이면서 설문조사를 완료하지 않은 경우에만 모달 표시
    if (appData.isAuthenticated && !appData.questionnaireCompleted) {
        appData.showQuestionnairePrompt = true;
    }

    // 설문조사 페이지로 이동
    function goToSurvey() {
        console.log('Navigating to survey page...');
        
        // 모달 닫기
        const modal = bootstrap.Modal.getInstance(document.getElementById('surveyModal'));
        if (modal) {
            modal.hide();
        }
        
        // 설문조사 페이지로 이동
        window.location.href = '/question/start';
    }

    // 모달 초기화 함수
    function initSurveyModal() {
        console.log('Initializing survey modal with data:', appData);
        
        // 인증된 사용자이고, 설문조사를 완료하지 않았고, 프롬프트가 true인 경우에만 모달 표시
        if (appData.isAuthenticated === true && 
            appData.questionnaireCompleted === false &&
            appData.showQuestionnairePrompt === true) {
                
            const modalElement = document.getElementById('surveyModal');
            if (!modalElement) {
                console.error('Survey modal element not found');
                return;
            }
            
            console.log('Showing survey modal for user:', appData.email);
            
            // Bootstrap 5 모달 초기화
            const modal = new bootstrap.Modal(modalElement, {
                backdrop: 'static',
                keyboard: false
            });
            
            // 모달 표시 (짧은 지연 후)
            setTimeout(() => {
                try {
                    modal.show();
                    console.log('Survey modal shown successfully');
                    
                    // 모달이 닫힐 때 이벤트 리스너 추가
                    const handleModalClose = () => {
                        console.log('Modal closed, removing prompt from session');
                        
                        // CSRF 토큰 가져오기
                        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
                        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
                        
                        if (!csrfToken || !csrfHeader) {
                            console.error('CSRF token not found');
                            return;
                        }
                        
                        // 서버에 프롬프트 제거 요청
                        fetch('/auth/remove-questionnaire-prompt', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                [csrfHeader]: csrfToken
                            },
                            credentials: 'same-origin'
                        }).then(response => {
                            if (!response.ok) {
                                throw new Error(`HTTP error! status: ${response.status}`);
                            }
                            console.log('Prompt removed from session');
                            // 이벤트 리스너 제거
                            modalElement.removeEventListener('hidden.bs.modal', handleModalClose);
                        }).catch(error => {
                            console.error('Error removing prompt from session:', error);
                        });
                    };
                    
                    // 모달이 닫힐 때 이벤트 리스너 등록
                    modalElement.addEventListener('hidden.bs.modal', handleModalClose);
                    
                } catch (e) {
                    console.error('Error showing survey modal:', e);
                }
            }, 500);
        } else {
            console.log('Survey modal not shown. Conditions:', {
                isAuthenticated: appData.isAuthenticated,
                showQuestionnairePrompt: appData.showQuestionnairePrompt,
                questionnaireCompleted: appData.questionnaireCompleted
            });
        }
    }
    
    // 페이지 로드 시 초기화
    document.addEventListener('DOMContentLoaded', function() {
        // 툴팁 초기화
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.forEach(function(tooltipTriggerEl) {
            new bootstrap.Tooltip(tooltipTriggerEl);
        });
        
        // 모달 초기화 함수 호출 (지연 실행)
        setTimeout(initSurveyModal, 300);
    });
</script>

</body>
</html>
