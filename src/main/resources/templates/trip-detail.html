<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">

<head th:replace="~{fragments/header :: head}"></head>

<body>

<style>
    .toast-notification {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #333;
        color: #fff;
        padding: 15px 20px;
        border-radius: 5px;
        z-index: 10000;
        display: none;
        opacity: 0;
        transition: opacity 0.3s, bottom 0.3s;
    }

    .toast-notification.show {
        display: block;
        opacity: 1;
        bottom: 30px;
    }
</style>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Navigation Menu -->
<div th:replace="~{fragments/menu :: menu}"></div>

<!-- Main Content -->
<main class="container py-5">
    <div class="row">
        <!-- Left Column -->
        <div class="col-md-6">
            <!-- Region Image -->
            <div th:if="${trip.accommodation != null and trip.accommodation.region != null}" class="mb-4">
                <th:block th:switch="${trip.accommodation.region}">
                    <img th:case="'제주도'" th:src="@{/image/korean local image/제주도.jpeg}" class="img-fluid rounded" th:alt="${trip.accommodation.region}">
                    <img th:case="'제주특별자치도'" th:src="@{/image/korean local image/제주도.jpeg}" class="img-fluid rounded" th:alt="${trip.accommodation.region}">
                    <img th:case="'세종특별자치시'" th:src="@{/image/korean local image/세종특별자치시.jpg}" class="img-fluid rounded" th:alt="${trip.accommodation.region}">
                    <img th:case="'서울특별시'" th:src="@{/image/korean local image/서울특별시.jpeg}" class="img-fluid rounded" th:alt="${trip.accommodation.region}">
                    <img th:case="'경상남도'" th:src="@{/image/korean local image/경상남도.png}" class="img-fluid rounded" th:alt="${trip.accommodation.region}">
                    <img th:case="*" th:src="@{/image/korean local image/{region}.jpg(region=${trip.accommodation.region})}" class="img-fluid rounded" th:alt="${trip.accommodation.region}" onerror="this.style.display='none'">
                </th:block>
            </div>

            <!-- Trip Title and Dates -->
            <div class="plan-summary mb-4">
                <h1 class="mb-3" th:text="${trip.title}" data-translatable>여행 계획 이름</h1>
                <p class="lead" th:if="${trip.startDate != null and trip.endDate != null}">
                    <strong data-translatable>여행 기간:</strong>
                    <span th:text="${#temporals.format(trip.startDate, 'yyyy-MM-dd')}"></span> ~
                    <span th:text="${#temporals.format(trip.endDate, 'yyyy-MM-dd')}"></span>
                </p>
            </div>

            <!-- Recommended Accommodation -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0" data-translatable>추천 숙소</h5>
                </div>
                <div class="card-body">
                    <div th:if="${trip.accommodation != null}">
                        <h5 th:text="${trip.accommodation.name}" data-translatable>숙소 이름</h5>
                        <p class="mb-1" th:if="${trip.accommodation.address != null}">
                            <i class="fas fa-map-marker-alt me-1 text-muted"></i>
                            <span th:text="${trip.accommodation.address}" data-translatable>주소</span>
                        </p>
                        <p class="mb-0 text-muted" th:if="${trip.accommodation.description != null}">
                            <i class="fas fa-info-circle me-1"></i>
                            <span th:text="${trip.accommodation.description}" data-translatable>설명</span>
                        </p>
                    </div>
                    <div th:unless="${trip.accommodation != null}">
                        <p class="mb-0" data-translatable>저장된 추천 숙소 정보가 없습니다.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="col-md-6">
            <!-- Schedules -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0" data-translatable>상세 일정</h5>
                </div>
                <div class="card-body">
                    <div th:if="${schedules.isEmpty()}" class="alert alert-info" data-translatable>
                        저장된 세부 일정이 없습니다.
                    </div>
                    <div th:unless="${schedules.isEmpty()}">
                        <div th:each="schedule, iterStat : ${schedules}" th:with="isNewDay=${iterStat.index == 0 or schedules[iterStat.index - 1].day != schedule.day}">
                            <h4 class="mt-4 mb-3" th:if="${isNewDay}"><span th:text="${schedule.day}"></span><span data-translatable>일차</span></h4>
                            <div class="card mb-3">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div>
                                            <h5 class="card-title mb-1" th:text="${schedule.place.name}" data-translatable>장소 이름</h5>
                                            <p class="card-text mb-1">
                                                <small class="text-muted">
                                                    <i class="far fa-clock me-1"></i>
                                                    <span th:text="${schedule.startTime} + (${schedule.endTime != null and schedule.endTime != ''} ? ' ~ ' + ${schedule.endTime} : '')"></span>
                                                </small>
                                            </p>
                                            <p class="card-text" th:if="${schedule.place.address != null}">
                                                <small class="text-muted">
                                                    <i class="fas fa-map-marker-alt me-1"></i>
                                                    <span th:text="${schedule.place.address}" data-translatable>주소</span>
                                                </small>
                                            </p>
                                        </div>
                                        <span sec:authorize="isAuthenticated()">
                                            <i class="far fa-star favorite-btn" th:data-place-id="${schedule.place.id}" style="cursor: pointer; font-size: 1.5rem; color: #FFD700;"></i>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/member/mypage}" class="btn btn-primary" data-translatable>마이페이지로 돌아가기</a>
    </div>
</main>

<!-- Toast Notification & Footer -->
<div class="toast-notification" id="toastNotification"><span></span></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
document.addEventListener('DOMContentLoaded', function () {
    function showToast(messageKey, defaultText) {
        const toastNotification = document.getElementById('toastNotification');
        if (!toastNotification) return;

        const toastSpan = toastNotification.querySelector('span');
        toastSpan.setAttribute('data-translatable', messageKey);
        toastSpan.textContent = defaultText;

        if(window.translationManager) {
            window.translationManager.applyCurrentLanguage(toastNotification);
        }

        toastNotification.classList.add('show');

        setTimeout(() => {
            toastNotification.classList.remove('show');
        }, 3000);
    }

    const favoriteButtons = document.querySelectorAll('.favorite-btn');

    favoriteButtons.forEach(btn => {
        const placeId = btn.dataset.placeId;
        fetch(`/api/favorites/status?placeId=${placeId}`)
            .then(response => response.json())
            .then(data => {
                if (data.isFavorite) {
                    btn.classList.remove('far');
                    btn.classList.add('fas');
                }
            })
            .catch(() => {});
    });

    favoriteButtons.forEach(btn => {
        btn.addEventListener('click', function () {
            const placeId = this.dataset.placeId;
            const isFavorite = this.classList.contains('fas');

            fetch('/api/favorites', {
                method: isFavorite ? 'DELETE' : 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ placeId: placeId })
            })
            .then(response => {
                if (response.ok) {
                    this.classList.toggle('far');
                    this.classList.toggle('fas');
                    if (isFavorite) {
                        showToast('favorite.removed', '즐겨찾기에서 삭제되었습니다.');
                    } else {
                        showToast('favorite.added', '즐겨찾기에 추가되었습니다.');
                    }
                } else {
                    response.json().then(err => {
                        showToast('favorite.error', '즐겨찾기 작업 중 오류가 발생했습니다.');
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showToast('favorite.network.error', '네트워크 오류가 발생했습니다.');
            });
        });
    });
});
</script>

</body>
</html>
