<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<!-- Head 프래그먼트로 교체하여 모든 CSS, JS, Meta 정보를 로드합니다. -->
<head th:replace="~{fragments/header :: head}"></head>
<body class="bg-light">
<!-- 헤더 영역 (물결표 구문 적용) -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="question-container text-center w-100" style="max-width: 900px; padding: 4rem 3rem;">
        <div class="smiley-container" style="max-width: 500px; margin: 0 auto 0.5rem auto;">
            <img src="/image/smile.png" alt="Smile" class="smiley-image" style="width: 100%; height: auto; max-width: 500px;">
        </div>
        <p class="mb-3 text-muted" data-translatable style="font-size: 1.5rem; line-height: 1.6; font-weight: 500;">
            안녕하세요, 토모에요!
        </p>
        <h1 class="mb-3 fw-bold text-accent" data-translatable style="font-size: 2rem;">당신에 대해 조금 더 알려주시겠어요?</h1>
        <div class="start-page-buttons">
            <a th:href="@{/question/form}" class="btn btn-tomo-start" data-translatable>
                <i class="fas fa-play me-2"></i> 시작하기
            </a>
            <a th:href="@{/}" class="btn btn-tomo-later" data-translatable>
                <i class="fas fa-home me-2"></i> 나중에 하기
            </a>
        </div>
    </div>
</div>

<!-- 푸터 영역 (물결표 구문 적용) -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- 추가적인 CSS 및 JS는 style.css와 header.html에서 로드된 것을 사용합니다. -->
<style>
    /*
     * Tabitomo 색상 변수들은 header :: head 프래그먼트를 통해 로드된
     * style.css 또는 bootstrap-fixes.css에서 정의된다고 가정합니다.
     */

    .bg-light {
        background-color: var(--color-secondary) !important;
    }

    .question-container {
        max-width: 800px;
        padding: 3rem 2rem;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        margin: 1rem;
    }
    
    /* Scoped styles for start page */
    .question-container .smiley-container {
        width: 150px;
        height: 150px;
        margin: 0 auto 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .question-container .smiley-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .question-container .text-accent {
        color: var(--color-accent);
    }

    /* Scoped styles for start page buttons */
    .question-container .start-page-buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;  /* Reduced gap between buttons */
        margin-top: 2rem;
        width: auto;
    }
    
    /* Base button styles */
    .question-container .btn-tomo-start,
    .question-container .btn-tomo-later {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.8rem 3rem;
        border-radius: 50px;  /* Fully rounded corners */
        font-size: 1.1rem;
        font-weight: 600;
        transition: all 0.3s ease;
        text-decoration: none;
        text-align: center;
        min-width: 240px;  /* Increased width for buttons */
        height: 54px;  /* Increased height */
        box-sizing: border-box;
        box-sizing: border-box;
    }
    
    /* Start Button (Orange) */
    .question-container .btn-tomo-start {
        background-color: var(--color-point);
        border: 2px solid var(--color-point);
        color: #fff;
    }
    
    .question-container .btn-tomo-start:hover {
        background-color: #d17522;
        border-color: #d17522;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(232, 131, 38, 0.3);
    }
    
    /* Later Button (Outline) */
    .question-container .btn-tomo-later {
        background-color: transparent;
        border: 2px solid #ddd;
        color: #666;
    }
    
    .question-container .btn-tomo-later:hover {
        background-color: #f8f9fa;
        border-color: #ccc;
        transform: translateY(-2px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* 아이콘 색상 (Primary Color 적용) */
    .question-container .text-primary-tabitomo {
        color: var(--color-primary);
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
