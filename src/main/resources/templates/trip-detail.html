<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ko">
<head th:replace="~{fragments/header :: head}">
    <title>여행 계획 상세 - Tabitomo</title>
    <link rel="stylesheet" href="/css/tripselect.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Navigation Menu -->
<div th:replace="~{fragments/menu :: menu}"></div>

<!-- Main Content -->
<main class="container py-5">
    <!-- Trip Title and Dates -->
    <div class="plan-summary mb-4">
        <h1 class="mb-3" th:text="${trip.title}">여행 계획 이름</h1>
        <p class="lead" th:if="${trip.startDate != null and trip.endDate != null}">
            <strong>여행 기간:</strong>
            <span th:text="${#temporals.format(trip.startDate, 'yyyy-MM-dd')}"></span> ~
            <span th:text="${#temporals.format(trip.endDate, 'yyyy-MM-dd')}"></span>
        </p>
    </div>

    <!-- Recommended Accommodation -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">추천 숙소</h5>
        </div>
        <div class="card-body">
            <div th:if="${trip.accommodation != null}">
                <div class="row align-items-center">
                    <div class="col-md-4" th:if="${trip.accommodation.imageUrl != null and !trip.accommodation.imageUrl.isEmpty()}">
                        <img th:src="${trip.accommodation.imageUrl}" class="img-fluid rounded" alt="숙소 이미지">
                    </div>
                    <div th:classappend="${trip.accommodation.imageUrl != null and !trip.accommodation.imageUrl.isEmpty()} ? 'col-md-8' : 'col-md-12'">
                        <h5 th:text="${trip.accommodation.name}">숙소 이름</h5>
                        <p class="mb-1" th:if="${trip.accommodation.address != null}">
                            <i class="fas fa-map-marker-alt me-1 text-muted"></i>
                            <span th:text="${trip.accommodation.address}"></span>
                        </p>
                        <p class="mb-0 text-muted" th:if="${trip.accommodation.description != null}">
                            <i class="fas fa-info-circle me-1"></i>
                            <span th:text="${trip.accommodation.description}"></span>
                        </p>
                    </div>
                </div>
            </div>
            <div th:unless="${trip.accommodation != null}">
                <p class="mb-0">저장된 추천 숙소 정보가 없습니다.</p>
            </div>
        </div>
    </div>

    <!-- Schedules Table -->
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">상세 일정</h5>
        </div>
        <div class="card-body">
            <div th:if="${schedules.isEmpty()}" class="alert alert-info">
                저장된 세부 일정이 없습니다.
            </div>
            <div th:unless="${schedules.isEmpty()}" class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th style="width: 15%;">일차</th>
                            <th style="width: 20%;">시간</th>
                            <th>장소</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="schedule : ${schedules}">
                            <td th:text="${schedule.day} + '일차'"></td>
                            <td th:text="${schedule.startTime} + (${schedule.endTime != null and schedule.endTime != ''} ? ' ~ ' + ${schedule.endTime} : '')"></td>
                            <td th:text="${schedule.place.name}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/mypage}" class="btn btn-primary">마이페이지로 돌아가기</a>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
