<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <head th:replace="~{fragments/header :: head}"></head>
    <title data-translatable>AI 여행 추천 결과</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" th:href="@{/css/map-styles.css}" />
    <style>
        #map {
            height: 400px;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
        }
        .itinerary-card {
            margin-bottom: 1rem;
            transition: transform 0.2s;
        }
        .itinerary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
    <div class="progress mb-4">
        <div class="progress-bar" role="progressbar" style="width: 75%">75%</div>
    </div>

    <h2 class="mb-4" data-translatable>AI 여행 추천 결과</h2>
    <div class="alert alert-info">
        <i class="fas fa-info-circle me-2"></i>
        <span th:if="${tripPlan != null}">
            <span th:text="|${tripPlan.destination}|"></span><span data-translatable>에서의</span> <span th:text="|${tripPlan.styles}|"></span><span data-translatable> 여행을 위한 맞춤 추천입니다.</span>
        </span>
        <span th:unless="${tripPlan != null}" data-translatable>여행 정보를 불러오는 중입니다...</span>
    </div>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0" data-translatable>추천 여행지 지도</h5>
        </div>
        <div class="card-body p-0">
            <div id="map" class="map-container"></div>
        </div>
    </div>

    <!-- Itinerary Content -->
    <div id="itinerary-content">
        <div th:each="daily : ${tripPlan.dailySchedules}">
            <div class="card mb-4">
                <div class="card-header">
                    <h5><span data-translatable>Day</span> <span th:text="${daily.day}">1</span> <span data-translatable>일정</span></h5>
                </div>
                <div class="card-body">
                    <div th:if="${daily.schedules != null and not #lists.isEmpty(daily.schedules)}">
                        <div th:each="item : ${daily.schedules}" class="card mb-3 itinerary-item">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${item.place}" data-translatable>장소 이름</h5>
                                <p class="card-text">
                                    <small class="text-muted">
                                        <i class="far fa-clock me-1"></i>
                                        <span th:if="${item.startTime}" th:text="${item.startTime + ' - ' + (item.endTime != null ? item.endTime : '')}"></span>
                                        <span th:unless="${item.startTime}" data-translatable>시간 정보 없음</span>
                                    </small>
                                </p>
                                <p class="card-text" th:text="${item.description}" data-translatable>설명</p>
                                <p class="card-text">
                                    <small class="text-muted">
                                        <i class="fas fa-map-marker-alt me-1"></i>
                                        <span th:text="${item.address}" data-translatable>주소</span>
                                    </small>
                                </p>
                            </div>
                        </div>
                    </div>
                    <div th:unless="${daily.schedules != null and not #lists.isEmpty(daily.schedules)}">
                        <p class="text-muted" data-translatable>해당 날짜에 추천 일정이 없습니다.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Accommodation Section -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0"><i class="fas fa-hotel me-2"></i><span data-translatable>추천 숙소</span></h5>
        </div>
        <div class="card-body" id="accommodationArea">
            <div th:if="${tripPlan.accommodation != null and tripPlan.accommodation.placeName != null}">
                <div class="card mb-3">
                    <div class="row g-0">
                        <div class="col-md-4">
                            <img th:src="${tripPlan.accommodation.imageUrl != null ? tripPlan.accommodation.imageUrl : 'https://via.placeholder.com/300x200'}" class="img-fluid rounded-start" th:alt="${tripPlan.accommodation.placeName}">
                        </div>
                        <div class="col-md-8">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${tripPlan.accommodation.placeName}" data-translatable>숙소 이름</h5>
                                <p class="card-text" th:text="${tripPlan.accommodation.description}" data-translatable>설명</p>
                                <p class="card-text"><small class="text-muted"><i class="fas fa-map-marker-alt me-1"></i><span th:text="${tripPlan.accommodation.address}" data-translatable>주소</span></small></p>
                                <p class="card-text"><small class="text-muted"><span data-translatable>예상 가격:</span> <span th:text="${tripPlan.accommodation.priceRange != null ? tripPlan.accommodation.priceRange : '정보 없음'}"></span></small></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:unless="${tripPlan.accommodation != null and tripPlan.accommodation.placeName != null}">
                 <p class="text-muted" data-translatable>추천 숙소 정보가 없습니다.</p>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
        <a th:href="@{/tripselect/step1}" class="btn btn-secondary" data-translatable>다시 추천받기</a>
        <form method="post" th:action="@{/trip/step4}" style="display: inline; margin: 0">
            <button type="submit" class="btn btn-primary" data-translatable>계획 확정하기</button>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/map-utils.js}"></script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const tripPlan = /*[[${tripPlan}]]*/ null;

        if (!tripPlan) {
            console.error("Trip plan data is not available.");
            return;
        }

        function initMapWithTripData() {
            const map = MapUtils.initMap("map");
            const scheduleMarkers = MapUtils.createDayMarkers(map, tripPlan.dailySchedules || []);
            const allMarkers = [...scheduleMarkers];

            const acc = tripPlan.accommodation;
            if (acc && acc.latitude && acc.longitude) {
                const hotelIcon = L.divIcon({ html: "<i class='fas fa-hotel' style='color:#007bff;font-size:2rem;'></i>", className: 'hotel-marker-icon' });
                const accMarker = L.marker([acc.latitude, acc.longitude], { icon: hotelIcon }).addTo(map).bindPopup(`<b>${acc.placeName}</b><br><span data-translatable>${acc.address || ''}</span><br>${acc.description || ''}`);
                allMarkers.push(accMarker);
            }

            const coordinates = [];
            if (tripPlan.dailySchedules) {
                tripPlan.dailySchedules.forEach(daily => {
                    if (daily.schedules) {
                        daily.schedules.forEach(schedule => {
                            if (schedule.latitude && schedule.longitude) {
                                coordinates.push([schedule.latitude, schedule.longitude]);
                            }
                        });
                    }
                });
            }
            if (coordinates.length > 1) {
                MapUtils.createRoute(map, coordinates);
            }

            if (allMarkers.length > 0) {
                MapUtils.fitMapToMarkers(map, allMarkers);
            }
        }

        initMapWithTripData();
    });
</script>

</body>
</html>
