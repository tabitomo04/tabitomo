<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko" id="htmlTag">

<head th:replace="~{fragments/header :: head}"></head>
<body>
<!-- Header and Navigation Menu (Combined) -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- chatbot -->
<div th:replace="~{fragments/chatbot-button :: chatbot-container}"></div>
<link rel="stylesheet" href="/css/chatbot.css">
<script th:src="@{/js/chatbot.js}"></script>

<!-- Main Content -->
<main class="py-5">
    <!-- 1. Hero Section: 이미지 슬라이더 배경 적용 -->
    <section class="hero-section text-center py-5 mb-5 custom-hero-bg">

        <!-- Background Image Slider Container -->
        <div id="hero-slider" class="hero-slider-background">
            <!-- Dummy Image URLs for demonstration -->
            <div class="slider-image active" style="background-image: url('/image/slide/scene1.jpg');"></div>
            <div class="slider-image" style="background-image: url('/image/slide/scene2.png');"></div>
            <div class="slider-image" style="background-image: url('/image/slide/scene3.jpg');"></div>
            <div class="slider-image" style="background-image: url('/image/slide/scene4.png');"></div>
        </div>

        <!-- Hero Content Overlay -->
        <div class="container px-4 py-5 hero-content-overlay">
            <!-- Terracotta Orange 색상의 작은 포인트 아이콘 -->
            <div class="mb-3 d-inline-block p-2 rounded-circle shadow-sm" style="background-color: var(--color-point-light);">
                <i class="fas fa-plane fa-2x" style="color: var(--color-point);"></i>
            </div>

            <h1 class="display-3 fw-bolder mb-3 text-white" data-translatable>당신의 완벽한 여행을 찾아보세요</h1>
            <p class="lead mb-5 text-light-emphasis" data-translatable>Tabitomo와 함께라면 여행 계획이 한결 쉽고 특별해집니다. AI 비서와 함께 **맞춤형 여정**을 바로 시작하세요.</p>

            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <!-- 여행지 추천 버튼 (Point Color: Terracotta Orange) -->
                <a href="/tripselect/step1" class="btn btn-primary btn-lg px-5 py-3 custom-point-btn" data-translatable>
                    여행지 추천받기
                </a>
                <!-- 자세히 알아보기 버튼 (Outline Primary: Urban Blue) -->
                <a href="/about" class="btn btn-outline-light btn-lg px-5 py-3 custom-outline-btn" data-translatable>
                    Tabitomo 서비스 자세히 알아보기
                </a>
            </div>
        </div>
    </section>

    <!-- 2. Popular Destinations: 카드 스타일 개선 -->
    <section id="features" class="popular-destinations mb-5" th:if="${not #lists.isEmpty(cities)}">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h3 fw-bold mb-0 text-accent" data-translatable>🔥 인기 여행지</h2>
                <a href="/tripinformation" class="btn btn-sm custom-sm-outline-btn" data-translatable>전체보기</a>
            </div>
            <div class="row g-4">
                <!-- Dynamic Cities from Database -->
                <div class="col-md-4" th:each="city : ${cities}">
                    <div class="card h-100 feature-card-style">
                        <img th:src="${city.image_url != null ? '/image/local-image/' + city.image_url : '/images/default-placeholder.png'}"
                             th:alt="${city.city}"
                             class="card-img-top card-image-fit"
                             onerror="this.onerror=null; this.src='/images/default-placeholder.png';">
                        <div class="card-body">
                            <h5 class="card-title fw-bold text-primary" th:text="${city.city}" data-translatable>도시명</h5>
                            <p class="card-text text-muted" th:text="${city.description}" data-translatable>도시 설명이 여기에 표시됩니다.</p>
                            <a th:href="@{/travel/} + ${city.city}" class="btn btn-sm custom-sm-btn" data-translatable>탐험하기</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 3. Storybook Section: 카드 스타일 개선 -->
    <section class="popular-storybooks mb-5" th:if="${not #lists.isEmpty(storylist)}">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h3 fw-bold mb-0 text-accent" data-translatable>📖 인기 스토리북</h2>
                <a href="/storybook/list" class="btn btn-sm custom-sm-outline-btn" data-translatable>전체보기</a>
            </div>
            <div class="row g-4">
                <div class="col-md-4" th:each="story : ${storylist}">
                    <div class="card h-100 feature-card-style">
                        <div class="thumbnail">
                            <img th:src="${story.thumbnail != null ? story.thumbnail : '/image/tomo.png'}"
                                 alt="썸네일"
                                 class="card-img-top card-image-fit"
                                 onerror="this.onerror=null; this.src='/image/tomo.png';">
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="card-title mb-0 fw-bold text-primary" th:text="${story.title}" data-translatable>제목</h5>
                                <span class="likes d-flex align-items-center gap-1 small fw-bold" th:style="${story.isLiked} ? 'color: var(--color-point)' : 'color: var(--color-primary)'">
                                    <i class="fas fa-heart"></i>
                                    <span th:text="${story.likes}"></span>
                                </span>
                            </div>
                            <p class="card-text small text-muted mb-2" th:text="${story.subtitle}" data-translatable>부제목</p>
                        </div>

                        <div class="card-footer d-flex justify-content-between small text-muted border-0 card-footer-custom">
                            <span th:text="${story.nickname}">작성자</span>
                            <span th:text="${#temporals.format(story.createDate, 'yy.MM.dd')}">날짜</span>
                        </div>

                        <!-- 카드 전체 클릭 가능하도록 링크 -->
                        <a th:href="@{'/storybook/detail?booknum=' + ${story.booknum}}" class="stretched-link"></a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- 설문조사 안내 모달 (JavaScript에서 표시 여부 결정) -->
<!-- ... (모달 내용은 변경하지 않음) ... -->
<div class="modal fade" id="surveyModal" tabindex="-1" role="dialog" aria-labelledby="surveyModalLabel" aria-hidden="true" style="display: none;">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="surveyModalLabel">환영합니다! 🎉</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>여행 취향을 파악하기 위한 간단한 설문조사에 참여해주세요.</p>
                <p>설문조사를 완료하시면 맞춤형 여행 추천을 받아보실 수 있습니다.</p>
            </div>
            <div class="modal-footer">
                <!-- 버튼 색상 통일 -->
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">나중에 하기</button>
                <button type="button" class="btn btn-primary custom-point-btn-sm" onclick="goToSurvey()">설문조사 하러 가기</button>
            </div>
        </div>
    </div>
</div>


<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- Styles for modal and chatbot -->
<style>
    /* style.css의 변수를 여기서도 사용하기 위해 재정의합니다. (CSS 변수 유효 범위 확장) */
    :root {
        --color-primary: #5D6C7E;    /* Urban Blue */
        --color-point: #E88326;     /* Terracotta Orange */
        --color-point-light: #fbe6d5; /* Terracotta Orange의 연한 버전 */
        --color-accent: #293341;    /* Dark Navy */
        --color-secondary: #F2F4F7; /* Light Gray */
    }

    /* -------------------------- */
    /* 1. HERO SECTION STYLES */
    /* -------------------------- */
    .custom-hero-bg {
        /* 배경 색상/그라데이션 대신 슬라이더가 표시될 수 있도록 설정 */
        background: var(--color-primary); /* Fallback color */
        position: relative;
        overflow: hidden; /* 이미지가 섹션을 벗어나지 않도록 설정 */
        box-shadow: 0 8px 25px rgba(93, 108, 126, 0.5);
        border-radius: 0 !important;
        padding-top: 0 !important; /* 슬라이더가 꽉 차도록 패딩 제거 */
        padding-bottom: 0 !important;
        min-height: 500px; /* 섹션의 최소 높이 지정 */
    }

    /* 슬라이더 전체 컨테이너 */
    .hero-slider-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1; /* 콘텐츠보다 뒤로 배치 */
    }

    /* 슬라이드 이미지 개별 스타일 */
    .slider-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        opacity: 0; /* 초기에는 모두 투명 */
        transition: opacity 1.5s ease-in-out; /* 부드러운 전환 효과 */

        /* 투명하고 어두운 오버레이와 블러 필터 적용 */
        filter: brightness(0.6) blur(3px);
        transform: scale(1.05); /* 약간 확대하여 블러 경계가 보이지 않도록 함 */
    }

    .slider-image.active {
        opacity: 0.6; /* 활성화된 이미지는 투명도 60%로 표시 */
    }

    /* 히어로 섹션 콘텐츠 오버레이 */
    .hero-content-overlay {
        position: relative;
        z-index: 2; /* 배경 이미지보다 앞으로 배치 */
        padding-top: 5rem !important; /* 기존 패딩 복구 */
        padding-bottom: 5rem !important; /* 기존 패딩 복구 */
    }

    .text-white { color: #fff !important; }
    .text-light-emphasis { color: rgba(255, 255, 255, 0.9) !important; }
    .text-accent { color: var(--color-accent) !important; }
    .text-primary { color: var(--color-primary) !important; }
    .text-point { color: var(--color-point) !important; }

    /* Hero 섹션 버튼 (Terracotta Orange) */
    .custom-point-btn {
        background-color: var(--color-point) !important;
        border-color: var(--color-point) !important;
        color: #fff !important;
        font-weight: 700;
        transition: transform 0.2s, box-shadow 0.2s;
        border-radius: 0.5rem;
    }
    .custom-point-btn:hover {
        background-color: #d17522 !important;
        border-color: #d17522 !important;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(232, 131, 38, 0.4);
    }

    /* Hero 섹션 아웃라인 버튼 (White Outline) */
    .custom-outline-btn {
        color: #fff !important;
        border-color: #fff !important;
        background-color: transparent !important;
        font-weight: 600;
        transition: background-color 0.3s, color 0.3s;
        border-radius: 0.5rem;
    }
    .custom-outline-btn:hover {
        background-color: rgba(255, 255, 255, 0.1) !important;
        border-color: #fff !important;
        color: #fff !important;
    }


    /* -------------------------- */
    /* 2 & 3. CARD STYLES (여행지 & 스토리북) */
    /* -------------------------- */

    /* 카드 공통 스타일 */
    .feature-card-style {
        border: none;
        border-radius: 12px;
        overflow: hidden;
        transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); /* 은은한 그림자 */
    }

    .feature-card-style:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); /* 호버 시 그림자 강조 */
    }

    /* 카드 이미지 크기 고정 및 비율 유지 */
    .card-image-fit {
        width: 100%;
        height: 200px; /* 적절한 높이 고정 */
        object-fit: cover;
    }

    /* 카드 바닥글 스타일 */
    .card-footer-custom {
        background-color: #fff;
        border-top: 1px solid var(--color-secondary);
        padding: 0.75rem 1rem;
    }

    /* 카드 바닥글과 좋아요 색상 통일 */
    .likes .fa-heart {
        color: inherit; /* 좋아요 색상은 상위 span에서 제어 */
    }

    /* 소형 버튼 (여행지 탐험하기) */
    .custom-sm-btn {
        background-color: var(--color-primary);
        border-color: var(--color-primary);
        color: #fff;
        font-size: 0.85rem;
        padding: 0.375rem 1rem;
        transition: background-color 0.2s;
    }
    .custom-sm-btn:hover {
        background-color: #4C5969;
        border-color: #4C5969;
        color: #fff;
    }

    /* 전체보기 버튼 (아웃라인) */
    .custom-sm-outline-btn {
        color: var(--color-primary);
        border-color: var(--color-primary);
        background-color: transparent;
        font-size: 0.85rem;
        padding: 0.375rem 1rem;
        transition: background-color 0.2s, color 0.2s;
    }
    .custom-sm-outline-btn:hover {
        background-color: var(--color-primary);
        color: #fff;
    }

    /* 모달 버튼 (Point Color) */
    .custom-point-btn-sm {
        background-color: var(--color-point) !important;
        border-color: var(--color-point) !important;
        color: #fff !important;
    }
    .custom-point-btn-sm:hover {
        background-color: #d17522 !important;
        border-color: #d17522 !important;
    }

    /* 설문조사 모달 스타일 (기존 유지) */
    .modal-content {
        border: none;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .modal-header {
        border-bottom: 1px solid #eee;
        background-color: var(--color-secondary);
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
    }

    .modal-title {
        color: var(--color-accent);
        font-weight: 600;
    }
</style>

<!-- Scripts -->
<script th:inline="javascript">
    // 서버에서 전달된 데이터 가져오기
    const appData = {
        isAuthenticated: /*[[${isAuthenticated}]]*/ false,
        showQuestionnairePrompt: /*[[${showQuestionnairePrompt}]]*/ false,
        questionnaireCompleted: /*[[${questionnaireCompleted}]]*/ false,
        email: /*[[${email}]]*/ '',
        sessionId: /*[[${sessionId}]]*/ ''
    };

    // 인증된 사용자이면서 설문조사를 완료하지 않은 경우에만 모달 표시
    if (appData.isAuthenticated && !appData.questionnaireCompleted) {
        appData.showQuestionnairePrompt = true;
    }

    // 설문조사 페이지로 이동
    function goToSurvey() {
        console.log('Navigating to survey page...');

        // 모달 닫기
        const modal = bootstrap.Modal.getInstance(document.getElementById('surveyModal'));
        if (modal) {
            modal.hide();
        }

        // 설문조사 페이지로 이동
        window.location.href = '/question/start';
    }

    // 모달 초기화 함수
    function initSurveyModal() {
        console.log('Initializing survey modal with data:', appData);

        // 인증된 사용자이고, 설문조사를 완료하지 않았고, 프롬프트가 true인 경우에만 모달 표시
        if (appData.isAuthenticated === true &&
            appData.questionnaireCompleted === false &&
            appData.showQuestionnairePrompt === true) {

            const modalElement = document.getElementById('surveyModal');
            if (!modalElement) {
                console.error('Survey modal element not found');
                return;
            }

            console.log('Showing survey modal for user:', appData.email);

            // Bootstrap 5 모달 초기화
            const modal = new bootstrap.Modal(modalElement, {
                backdrop: 'static',
                keyboard: false
            });

            // 모달 표시 (짧은 지연 후)
            setTimeout(() => {
                try {
                    modal.show();
                    console.log('Survey modal shown successfully');

                    // 모달이 닫힐 때 이벤트 리스너 추가
                    const handleModalClose = () => {
                        console.log('Modal closed, removing prompt from session');

                        // CSRF 토큰 가져오기
                        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
                        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

                        if (!csrfToken || !csrfHeader) {
                            console.error('CSRF token not found');
                            return;
                        }

                        // 서버에 프롬프트 제거 요청
                        fetch('/auth/remove-questionnaire-prompt', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                [csrfHeader]: csrfToken
                            },
                            credentials: 'same-origin'
                        }).then(response => {
                            if (!response.ok) {
                                throw new Error(`HTTP error! status: ${response.status}`);
                            }
                            console.log('Prompt removed from session');
                            // 이벤트 리스너 제거
                            modalElement.removeEventListener('hidden.bs.modal', handleModalClose);
                        }).catch(error => {
                            console.error('Error removing prompt from session:', error);
                        });
                    };

                    // 모달이 닫힐 때 이벤트 리스너 등록
                    modalElement.addEventListener('hidden.bs.modal', handleModalClose);

                } catch (e) {
                    console.error('Error showing survey modal:', e);
                }
            }, 500);
        } else {
            console.log('Survey modal not shown. Conditions:', {
                isAuthenticated: appData.isAuthenticated,
                showQuestionnairePrompt: appData.showQuestionnairePrompt,
                questionnaireCompleted: appData.questionnaireCompleted
            });
        }
    }

    // 페이지 로드 시 초기화
    document.addEventListener('DOMContentLoaded', function() {
        // 툴팁 초기화
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.forEach(function(tooltipTriggerEl) {
            new bootstrap.Tooltip(tooltipTriggerEl);
        });

        // 모달 초기화 함수 호출 (지연 실행)
        setTimeout(initSurveyModal, 300);

        // ** 새로 추가된 히어로 슬라이더 초기화 **
        initHeroSlider();
    });

    /**
     * 히어로 섹션 배경 이미지 슬라이더를 초기화하고 실행합니다.
     */
    function initHeroSlider() {
        const sliderContainer = document.getElementById('hero-slider');
        if (!sliderContainer) return;

        const images = sliderContainer.querySelectorAll('.slider-image');
        let currentIndex = 0;
        const intervalTime = 5000; // 5초마다 전환

        function showNextImage() {
            // 현재 활성 이미지를 비활성화
            images[currentIndex].classList.remove('active');

            // 다음 인덱스로 이동 (순환)
            currentIndex = (currentIndex + 1) % images.length;

            // 다음 이미지를 활성화
            images[currentIndex].classList.add('active');
        }

        // 초기 시작 시 첫 번째 이미지 활성화
        if (images.length > 0) {
            images[currentIndex].classList.add('active');
        }

        // 인터벌 시작
        setInterval(showNextImage, intervalTime);
    }
</script>

</body>
</html>
