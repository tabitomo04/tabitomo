<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문 완료</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .complete-container {
            max-width: 600px;
            margin: 5rem auto;
            padding: 3rem;
            text-align: center;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .checkmark {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: block;
            stroke-width: 5;
            stroke: #4bb71b;
            stroke-miterlimit: 10;
            margin: 0 auto 2rem;
            box-shadow: inset 0 0 0 #4bb71b;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }
        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 5;
            stroke-miterlimit: 10;
            stroke: #4bb71b;
            fill: none;
            animation: stroke .6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke .3s cubic-bezier(0.65, 0, 0.45, 1) .8s forwards;
        }
        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }
        @keyframes scale {
            0%, 100% { transform: none; }
            50% { transform: scale3d(1.1, 1.1, 1); }
        }
        @keyframes fill {
            100% { box-shadow: inset 0 0 0 100vh #fff; }
        }
        .btn-explore {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            background-color: #4e73df;
            border: none;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .btn-explore:hover {
            background-color: #2e59d9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 115, 223, 0.3);
        }
    </style>
</head>
<body class="bg-light">
    <div th:replace="fragments/header :: header"></div>
    
    <div class="container">
        <div class="complete-container">
            <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>
            
            <h2 class="mb-3">설문이 완료되었습니다!</h2>
            <p class="lead text-muted mb-4">
                귀중한 시간 내어 설문에 참여해 주셔서 감사합니다.<br>
                입력하신 정보를 바탕으로 맞춤형 여행 추천을 제공해 드리겠습니다.
            </p>
            
            <div class="mt-5">
                <a th:href="@{/}" class="btn btn-primary btn-explore">
                    <i class="fas fa-compass me-2"></i> 추천 여행지 확인하기
                </a>
            </div>
            
            <div class="mt-4">
                <p class="text-muted small">
                    마이페이지에서 언제든지 취향을 수정하실 수 있습니다.
                </p>
            </div>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
