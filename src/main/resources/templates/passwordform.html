<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .password-find-box {
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            width: 500px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .password-find-box h2 {
            font-size: 28px;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .input-group label {
            width: 120px;
            text-align: left;
            font-size: 18px;
        }

        .input-group input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .input-group button {
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-left: 10px;
            background-color: #f0f0f0;
            cursor: pointer;
            white-space: nowrap;
        }

        .timer {
            color: red;
            font-weight: bold;
            font-size: 14px;
            /* New styles for better positioning */
            width: 100px; /* Set a fixed width */
            text-align: right;
            margin-left: auto; /* Push to the right */
            margin-top: -15px; /* Adjust vertical position */
            margin-right: 0px;
        }

        .reset-button {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f0f0f0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="password-find-box">
    <h2>비밀번호 찾기</h2>
    <div class="input-group">
        <label>이메일 인증</label>
        <input type="text" placeholder="이메일 입력">
        <button>인증번호 발송</button>
    </div>
    <div class="timer">2:59</div>
    <div class="input-group">
        <label>인증번호 입력</label>
        <input type="text">
        <button>인증번호 확인</button>
    </div>
    <button class="reset-button">비밀번호 재설정</button>
</div>

</body>
</html>
