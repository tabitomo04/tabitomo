<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::#content}, ~{::title}, ~{::link}, ~{::script})"}">
<head>
    <title>비밀번호 찾기 - 타비토모</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div id="content">
        <div class="auth-container">
            <div class="auth-logo">
                <img th:src="@{/images/logo.svg}" alt="타비토모 로고">
                <h1 class="h4 mb-4 fw-bold">비밀번호 찾기</h1>
            </div>
            
            <div id="step1">
                <p class="text-muted mb-4">가입 시 사용한 이메일을 입력하시면 비밀번호 재설정 링크를 보내드립니다.</p>
                
                <form id="forgotPasswordForm">
                    <div class="mb-3">
                        <div class="form-floating">
                            <input type="email" class="form-control" id="email" name="email" 
                                   placeholder="이메일" required>
                            <label for="email">이메일</label>
                            <div class="invalid-feedback">이메일을 입력해주세요.</div>
                        </div>
                        <div id="emailError" class="error-message"></div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">비밀번호 재설정 링크 보내기</button>
                </form>
                
                <div id="successMessage" class="d-none">
                    <div class="alert alert-success">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span>비밀번호 재설정 링크가 이메일로 전송되었습니다. 이메일을 확인해주세요.</span>
                    </div>
                    <a href="/login" class="btn btn-outline-primary w-100">로그인 화면으로 돌아가기</a>
                </div>
                
                <div class="auth-footer mt-4">
                    <a href="/login">로그인</a> 또는 <a href="/signup">회원가입</a>
                </div>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');
            const successMessage = document.getElementById('successMessage');
            const emailInput = document.getElementById('email');
            const emailError = document.getElementById('emailError');
            
            forgotPasswordForm.addEventListener('submit', async function(event) {
                event.preventDefault();
                
                // Reset errors
                emailError.textContent = '';
                
                // Validate email
                const email = emailInput.value.trim();
                if (!email) {
                    emailError.textContent = '이메일을 입력해주세요.';
                    return;
                }
                
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    emailError.textContent = '유효한 이메일 주소를 입력해주세요.';
                    return;
                }
                
                try {
                    // Send password reset request
                    const response = await fetch('/api/auth/request-password-reset', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email: email })
                    });
                    
                    if (response.ok) {
                        // Show success message
                        forgotPasswordForm.classList.add('d-none');
                        successMessage.classList.remove('d-none');
                    } else {
                        const data = await response.json();
                        throw new Error(data.message || '비밀번호 재설정 요청에 실패했습니다.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    emailError.textContent = error.message || '비밀번호 재설정 요청 중 오류가 발생했습니다.';
                }
            });
        });
    </script>
</body>
</html>
