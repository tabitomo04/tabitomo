<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 타비토모</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* 비밀번호 재설정 모달 스타일 */
        .verification-code {
            letter-spacing: 0.5rem;
            font-size: 1.5rem;
            text-align: center;
            padding: 0.5rem;
        }
        .countdown {
            color: #dc3545;
            font-weight: bold;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
    </style>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1538485399081-7c8973e2a0de?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
        }
        .auth-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.1);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .auth-logo img {
            max-width: 180px;
            margin-bottom: 1.5rem;
        }
        .form-control:focus {
            border-color: #4361ee;
            box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.25);
        }
        .btn-primary {
            background-color: #4361ee;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background-color: #3a56d4;
            transform: translateY(-2px);
        }
        .auth-footer {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }
        .auth-footer a {
            color: #4361ee;
            font-weight: 500;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">
                <div class="auth-container">
            <div class="auth-logo">
                <img th:src="@{/image/logo.svg}" alt="타비토모 로고" class="mb-4" style="max-width: 200px;">
                <h1 class="h4 mb-4 fw-bold">로그인</h1>
            </div>
            
            <form id="loginForm" th:action="@{/login}" method="post" novalidate>
                <div class="mb-3">
                    <div class="form-floating">
                        <input type="email" class="form-control" id="username" name="username" 
                               placeholder="이메일" required>
                        <label for="username">이메일</label>
                        <div class="invalid-feedback">이메일을 입력해주세요.</div>
                    </div>
                </div>
                
                <div class="mb-3">
                    <div class="form-floating">
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="비밀번호" required>
                        <label for="password">비밀번호</label>
                        <div class="invalid-feedback">비밀번호를 입력해주세요.</div>
                    </div>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                        <label class="form-check-label" for="remember-me">로그인 상태 유지</label>
                    </div>
                    <a href="#" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">비밀번호 찾기</a>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 mb-4">로그인</button>
                
                <div class="auth-footer text-center">
                    <p class="mb-2">아직 회원이 아니신가요? <a th:href="@{/auth/signup}">회원가입</a></p>
                    <p class="mb-0"><a href="#" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">비밀번호를 잊으셨나요?</a></p>
                </div>

                <!-- 비밀번호 재설정 모달 -->
                <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="forgotPasswordModalLabel">비밀번호 재설정</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <!-- 이메일 입력 단계 -->
                                <div id="emailStep">
                                    <p>가입하신 이메일을 입력해주세요.</p>
                                    <div class="mb-3">
                                        <input type="email" class="form-control" id="resetEmail" placeholder="이메일">
                                        <div id="emailError" class="invalid-feedback"></div>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="button" class="btn btn-primary" id="sendVerificationBtn">인증번호 전송</button>
                                    </div>
                                </div>

                                <!-- 인증번호 확인 단계 (처음에는 숨김) -->
                                <div id="verificationStep" style="display: none;">
                                    <p>이메일로 전송된 인증번호 6자리를 입력해주세요.</p>
                                    <div class="mb-3">
                                        <input type="text" class="form-control" id="verificationCode" 
                                               placeholder="인증번호 6자리" maxlength="6" data-expected-code="">
                                        <div id="verificationError" class="invalid-feedback"></div>
                                        <div class="mt-1">
                                            <small class="text-muted">인증번호가 오지 않나요? <a href="#" id="resendVerification">재전송</a></small>
                                            <div id="countdown" class="text-danger"></div>
                                        </div>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="button" class="btn btn-primary" id="verifyCodeBtn">인증하기</button>
                                    </div>
                                </div>

                                <!-- 새 비밀번호 입력 단계 (처음에는 숨김) -->
                                <div id="passwordResetStep" style="display: none;">
                                    <p>새로운 비밀번호를 입력해주세요.</p>
                                    <div class="mb-3">
                                        <input type="password" class="form-control" id="newPassword" placeholder="새 비밀번호">
                                        <div id="passwordError" class="invalid-feedback"></div>
                                    </div>
                                    <div class="mb-3">
                                        <input type="password" class="form-control" id="confirmPassword" placeholder="새 비밀번호 확인">
                                        <div id="confirmPasswordError" class="invalid-feedback"></div>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="button" class="btn btn-primary" id="resetPasswordBtn">비밀번호 재설정</button>
                                    </div>
                                </div>

                                <!-- 완료 메시지 (처음에는 숨김) -->
                                <div id="successStep" class="text-center" style="display: none;">
                                    <div class="mb-3">
                                        <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
                                    </div>
                                    <h5>비밀번호가 성공적으로 변경되었습니다.</h5>
                                    <p>새로운 비밀번호로 다시 로그인해주세요.</p>
                                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">확인</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        // Form validation
        (function() {
            'use strict';
            
            // Fetch the form we want to apply custom Bootstrap validation styles to
            const form = document.getElementById('loginForm');
            
            // Prevent submission if form is invalid
            form.addEventListener('submit', function(event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                
                form.classList.add('was-validated');
            }, false);
            
            // Show error message if login failed
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            
            if (error) {
                let errorMessage = '이메일 또는 비밀번호가 올바르지 않습니다.';
                
                // You can add more specific error messages based on the error parameter
                if (error === 'disabled') {
                    errorMessage = '이메일 인증이 완료되지 않았습니다. 이메일을 확인해주세요.';
                }
                
                const alertDiv = document.createElement('div');
                alertDiv.className = 'alert alert-danger alert-dismissible fade show mt-3';
                alertDiv.role = 'alert';
                alertDiv.innerHTML = `
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    ${errorMessage}
                `;
                
                form.prepend(alertDiv);
            }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 비밀번호 재설정 모달 관련 변수
            const forgotPasswordModal = document.getElementById('forgotPasswordModal');
            const emailStep = document.getElementById('emailStep');
            const verificationStep = document.getElementById('verificationStep');
            const passwordResetStep = document.getElementById('passwordResetStep');
            const successStep = document.getElementById('successStep');
            const resetEmail = document.getElementById('resetEmail');
            const verificationCode = document.getElementById('verificationCode');
            const newPassword = document.getElementById('newPassword');
            const confirmPassword = document.getElementById('confirmPassword');
            const sendVerificationBtn = document.getElementById('sendVerificationBtn');
            const verifyCodeBtn = document.getElementById('verifyCodeBtn');
            const resetPasswordBtn = document.getElementById('resetPasswordBtn');
            const resendVerification = document.getElementById('resendVerification');
            const countdownElement = document.getElementById('countdown');
            
            let countdown;
            let timeLeft = 180; // 3분

            // 모달이 닫힐 때 초기화
            if (forgotPasswordModal) {
                forgotPasswordModal.addEventListener('hidden.bs.modal', function () {
                    resetModal();
                });
            }

            // 인증번호 전송 버튼 클릭
            if (sendVerificationBtn) {
                sendVerificationBtn.addEventListener('click', async function() {
                    const email = resetEmail.value.trim();
                    
                    if (!validateEmail(email)) {
                        showError('emailError', '유효한 이메일을 입력해주세요.');
                        return;
                    }

                    try {
                        const response = await fetch('/api/email/send-verification', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Requested-With': 'XMLHttpRequest'
                            },
                            body: JSON.stringify({ email: email })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok) {
                            // 이메일 단계 숨기고 인증번호 단계 표시
                            emailStep.style.display = 'none';
                            verificationStep.style.display = 'block';
                            
                            // 인증번호 입력 필드 초기화 및 포커스
                            verificationCode.value = '';
                            verificationCode.focus();
                            
                            // 카운트다운 시작
                            startCountdown();
                        } else {
                            const errorMessage = data.message || '인증번호 전송에 실패했습니다.';
                            showError('emailError', errorMessage);
                        }
                    } catch (error) {
                        console.error('Error sending verification code:', error);
                        showError('emailError', '인증번호 전송 중 오류가 발생했습니다.');
                    }
                });
            }

            // 인증번호 확인 버튼 클릭
            if (verifyCodeBtn) {
                verifyCodeBtn.addEventListener('click', function() {
                    const code = verificationCode.value.trim();
                    const expectedCode = verificationCode.dataset.expectedCode;
                    
                    if (code.length !== 6) {
                        showError('verificationError', '인증번호 6자리를 입력해주세요.');
                        return;
                    }
                    
                    if (code === expectedCode) {
                        // 인증 성공 시 비밀번호 재설정 단계로 이동
                        verificationStep.style.display = 'none';
                        passwordResetStep.style.display = 'block';
                        newPassword.focus();
                        
                        // 카운트다운 정지
                        clearInterval(countdown);
                        countdownElement.textContent = '';
                    } else {
                        showError('verificationError', '인증번호가 일치하지 않습니다.');
                    }
                });
            }

            // 비밀번호 재설정 버튼 클릭
            if (resetPasswordBtn) {
                resetPasswordBtn.addEventListener('click', async function() {
                    const password = newPassword.value;
                    const confirm = confirmPassword.value;
                    
                    // 비밀번호 유효성 검사
                    if (password.length < 8) {
                        showError('passwordError', '비밀번호는 8자 이상이어야 합니다.');
                        return;
                    }
                    
                    if (password !== confirm) {
                        showError('confirmPasswordError', '비밀번호가 일치하지 않습니다.');
                        return;
                    }
                    
                    try {
                        // 실제로는 서버에 비밀번호 재설정 요청을 보내야 함
                        // 여기서는 시뮬레이션만 함
                        await new Promise(resolve => setTimeout(resolve, 1000));
                        
                        // 성공 시 완료 단계 표시
                        passwordResetStep.style.display = 'none';
                        successStep.style.display = 'block';
                    } catch (error) {
                        console.error('Error resetting password:', error);
                        showError('passwordError', '비밀번호 재설정 중 오류가 발생했습니다.');
                    }
                });
            }
            
            // 인증번호 재전송
            if (resendVerification) {
                resendVerification.addEventListener('click', function(e) {
                    e.preventDefault();
                    sendVerificationBtn.click();
                });
            }
            
            // 인증번호 입력 시 에러 메시지 초기화
            if (verificationCode) {
                verificationCode.addEventListener('input', function() {
                    this.classList.remove('is-invalid');
                    document.getElementById('verificationError').textContent = '';
                });
            }
            
            // 비밀번호 입력 시 에러 메시지 초기화
            if (newPassword) {
                newPassword.addEventListener('input', function() {
                    this.classList.remove('is-invalid');
                    document.getElementById('passwordError').textContent = '';
                });
            }
            
            if (confirmPassword) {
                confirmPassword.addEventListener('input', function() {
                    this.classList.remove('is-invalid');
                    document.getElementById('confirmPasswordError').textContent = '';
                });
            }
            
            // 이메일 유효성 검사
            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }
            
            // 에러 메시지 표시
            function showError(elementId, message) {
                const element = document.getElementById(elementId);
                if (element) {
                    element.textContent = message;
                    element.previousElementSibling.classList.add('is-invalid');
                }
            }
            
            // 카운트다운 시작
            function startCountdown() {
                timeLeft = 180; // 3분으로 초기화
                updateCountdown();
                countdown = setInterval(updateCountdown, 1000);
            }
            
            // 카운트다운 업데이트
            function updateCountdown() {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                countdownElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')} 후 만료`;
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    countdownElement.textContent = '인증번호가 만료되었습니다.';
                    verifyCodeBtn.disabled = true;
                } else {
                    timeLeft--;
                }
            }
            
            // 모달 초기화
            function resetModal() {
                // 모든 단계 초기화
                emailStep.style.display = 'block';
                verificationStep.style.display = 'none';
                passwordResetStep.style.display = 'none';
                successStep.style.display = 'none';
                
                // 입력 필드 초기화
                resetEmail.value = '';
                verificationCode.value = '';
                newPassword.value = '';
                confirmPassword.value = '';
                
                // 에러 메시지 초기화
                document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
                document.querySelectorAll('.invalid-feedback').forEach(el => el.textContent = '');
                
                // 카운트다운 정지
                clearInterval(countdown);
                countdownElement.textContent = '';
                
                // 버튼 활성화
                if (verifyCodeBtn) verifyCodeBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
