<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ko">
<head th:replace="~{fragments/header :: head}">
    <title th:text="${nickname} + '님의 공개된 여행 - Tabitomo'" data-translatable>사용자의 공개된 여행</title>
</head>
<body>
<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- chatbot -->
<div th:replace="~{fragments/chatbot-button :: chatbot-container}"></div>
<link rel="stylesheet" href="/css/chatbot.css">
<script th:src="@{/js/chatbot.js}"></script>

<!-- Main Content -->
<main class="container py-5">
    <h1 class="mb-4"><span th:text="${nickname}"></span><span data-translatable>님의 공개된 여행</span></h1>
    <p class="text-muted mb-4" data-translatable>이 사용자가 공유한 여행 계획을 둘러보세요.</p>

    <section>
        <div th:if="${tripsPage.empty}" class="alert alert-info" role="alert" data-translatable>
            이 사용자는 아직 공개한 여행 계획이 없습니다.
        </div>

        <div class="list-group" th:unless="${tripsPage.empty}">
            <!-- Iterate over public trips -->
            <a th:each="trip : ${tripsPage.content}" th:href="@{/public-trips/{id}(id=${trip.id})}" class="list-group-item list-group-item-action flex-column align-items-start">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1" th:text="${trip.title}" data-translatable>여행 계획 이름</h5>
                    <small th:if="${trip.startDate != null}"
                           th:text="${#temporals.format(trip.startDate, 'yyyy.MM.dd')} + ' ~ ' + ${#temporals.format(trip.endDate, 'yyyy.MM.dd')}">여행 기간</small>
                </div>
                 <div class="d-flex w-100 justify-content-between">
                    <small class="text-muted" data-translatable>여기를 클릭하여 상세 내용을 확인하세요.</small>
                    <small class="text-muted" th:if="${trip.createdAt != null}"><span data-translatable>작성일:</span> [[${#temporals.format(trip.createdAt, 'yyyy.MM.dd')}]]</small>
                </div>
            </a>
        </div>

        <!-- Pagination -->
        <nav th:if="${tripsPage.totalPages > 1}" class="mt-4 d-flex justify-content-center">
            <ul class="pagination">
                <li class="page-item" th:classappend="${tripsPage.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/user/{nickname}(nickname=${nickname}, page=0)}" data-translatable>처음</a>
                </li>
                <li class="page-item" th:classappend="${tripsPage.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/user/{nickname}(nickname=${nickname}, page=${tripsPage.number - 1})}" data-translatable>이전</a>
                </li>
                <li class="page-item" th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}" th:classappend="${pageNumber == tripsPage.number} ? 'active'">
                    <a class="page-link" th:href="@{/user/{nickname}(nickname=${nickname}, page=${pageNumber})}" th:text="${pageNumber + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${tripsPage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/user/{nickname}(nickname=${nickname}, page=${tripsPage.number + 1})}" data-translatable>다음</a>
                </li>
                <li class="page-item" th:classappend="${tripsPage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/user/{nickname}(nickname=${nickname}, page=${tripsPage.totalPages - 1})}" data-translatable>마지막</a>
                </li>
            </ul>
        </nav>

         <div class="mt-4">
            <a th:href="@{/trips/public}" class="btn btn-secondary" data-translatable>모든 공개 여행 목록으로 돌아가기</a>
        </div>
    </section>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
