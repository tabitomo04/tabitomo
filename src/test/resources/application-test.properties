# Disable database initialization
spring.sql.init.mode=never

# MySQL Configuration - No SSL
spring.datasource.url=jdbc:mysql://35.185.255.44:3306/tabitomo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=user
spring.datasource.password=tabitomo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-test-query=SELECT 1

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.datasource.DataSourceUtils=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# Disable auto-configuration
spring.autoconfigure.exclude=\
  org.springframework.cloud.function.context.config.ContextFunctionCatalogAutoConfiguration,\
  org.springframework.ai.vertexai.autoconfigure.VertexAiAutoConfiguration,\
  org.springframework.ai.autoconfigure.vertexai.VertexAiChatAutoConfiguration
