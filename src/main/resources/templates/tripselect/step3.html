<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AI 여행 추천 결과</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        />
        <link rel="stylesheet" href="/css/tripselect.css" />
        <link rel="stylesheet" href="/css/map-styles.css" />
        <style>
            #map {
                height: 400px;
                margin-bottom: 1rem;
                border-radius: 0.5rem;
            }
            .itinerary-card {
                margin-bottom: 1rem;
                transition: transform 0.2s;
            }
            .itinerary-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            }
            .day-nav {
                position: sticky;
                top: 0;
                background: white;
                z-index: 1000;
                padding: 1rem 0;
                margin-bottom: 1rem;
                border-bottom: 1px solid #eee;
            }
        </style>
    </head>
    <body>
        <div class="container mt-4">
            <div id="debugArea" class="alert alert-danger d-none" role="alert" style="white-space:pre-wrap;"></div>
            <div class="progress mb-4">
                <div class="progress-bar" role="progressbar" style="width: 75%">75%</div>
            </div>

            <h2 class="mb-4">AI 여행 추천 결과</h2>
            <div class="alert alert-info">
                <i class="fas fa-info-circle me-2"></i>
                <span th:text="${tripPlan != null} ? |'${tripPlan.destination}'에서의 '${tripPlan.styles}' 여행을 위한 맞춤 추천입니다.| : '여행 정보를 불러오는 중입니다...'"></span>
            </div>

            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">추천 여행지 지도</h5>
                </div>
                <div class="card-body p-0">
                    <div id="map" class="map-container"></div>
                </div>
            </div>

            <div class="day-nav">
                <ul class="nav nav-pills" id="dayTabs" role="tablist"></ul>
            </div>

            <div class="tab-content" id="dayTabsContent">
                <!-- Itinerary panes will be rendered here by JS -->
            </div>

            <!-- Accommodation Section -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-hotel me-2"></i>추천 숙소</h5>
                </div>
                <div class="card-body" id="accommodationArea">
                    <!-- Accommodations will be rendered here by JS -->
                </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="/trip/step1" class="btn btn-secondary">다시 추천받기</a>
                <form method="post" action="/trip/step4" style="display: inline; margin: 0">
                    <button type="submit" class="btn btn-primary">계획 확정하기</button>
                </form>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="/js/map-utils.js"></script>
        <script th:inline="javascript">
            try {
                const tripPlan = /*[[${tripPlan}]]*/ null;
                const debugArea = document.getElementById('debugArea');
                
                if (!tripPlan) {
                    throw new Error("tripPlan 객체가 Thymeleaf에서 제대로 전달되지 않았습니다.");
                }

                console.log("CLIENT-SIDE LOG: Successfully received tripPlan object:", JSON.stringify(tripPlan, null, 2));

                function renderItineraryAndTabs() {
                    console.log("CLIENT-SIDE LOG: Starting renderItineraryAndTabs...");
                    const dayTabsContainer = document.getElementById('dayTabs');
                    const tabContentContainer = document.getElementById('dayTabsContent');

                    if (!dayTabsContainer || !tabContentContainer || !tripPlan || !Array.isArray(tripPlan.dailySchedules)) {
                        console.error("CLIENT-SIDE ERROR: Prerequisites for renderItineraryAndTabs not met.", { dayTabsContainer, tabContentContainer, tripPlan });
                        return;
                    }

                    dayTabsContainer.innerHTML = '';
                    tabContentContainer.innerHTML = '';

                    tripPlan.dailySchedules.forEach((daily, idx) => {
                        console.log(`CLIENT-SIDE LOG: Rendering Day ${daily.day}`);
                        const li = document.createElement('li');
                        li.className = 'nav-item';
                        const btn = document.createElement('button');
                        btn.className = 'nav-link' + (idx === 0 ? ' active' : '');
                        btn.id = `day${daily.day}-tab`;
                        btn.type = 'button';
                        btn.setAttribute('data-bs-toggle', 'pill');
                        btn.setAttribute('data-bs-target', `#day-pane-${daily.day}`);
                        btn.textContent = `Day ${daily.day}`;
                        li.appendChild(btn);
                        dayTabsContainer.appendChild(li);

                        const tabPane = document.createElement('div');
                        tabPane.className = 'tab-pane fade' + (idx === 0 ? ' show active' : '');
                        tabPane.id = `day-pane-${daily.day}`;
                        tabPane.setAttribute('role', 'tabpanel');

                        let html = `<div class="card mb-4"><div class="card-header"><h5>Day ${daily.day} 일정</h5></div><div class="card-body">`;
                        if (daily.schedules && daily.schedules.length > 0) {
                            daily.schedules.forEach(item => {
                                const timeText = item.startTime ? `${item.startTime} - ${item.endTime || ''}` : '시간 정보 없음';
                                html += `<div class="card mb-3 itinerary-item">
                                    <div class="card-body">
                                        <h5 class="card-title">${item.place || ''}</h5>
                                        <p class="card-text"><small class="text-muted"><i class="far fa-clock me-1"></i> ${timeText}</small></p>
                                        <p class="card-text">${item.description || ''}</p>
                                    </div>
                                </div>`;
                            });
                        } else {
                            html += `<p class="text-muted">해당 날짜에 추천 일정이 없습니다.</p>`;
                        }
                        html += `</div></div>`;
                        tabPane.innerHTML = html;
                        tabContentContainer.appendChild(tabPane);
                    });
                    console.log("CLIENT-SIDE LOG: Finished renderItineraryAndTabs.");
                }

                function renderAccommodations() {
                    console.log("CLIENT-SIDE LOG: Starting renderAccommodations...");
                    const area = document.getElementById('accommodationArea');
                    const acc = tripPlan.accommodation;
                    if (!area || !acc || !acc.placeName) {
                        console.error("CLIENT-SIDE ERROR: Accommodation data is missing or invalid.", { area, acc });
                        area.innerHTML = '<p class="text-muted">추천 숙소 정보가 없습니다.</p>';
                        return;
                    }

                    let html = `<div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-4">
                                <img src="${acc.imageUrl || 'https://via.placeholder.com/300x200'}" class="img-fluid rounded-start" alt="${acc.placeName}">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">${acc.placeName}</h5>
                                    <p class="card-text">${acc.description || ''}</p>
                                    <p class="card-text"><small class="text-muted">예상 가격: ${acc.priceRange || '정보 없음'}</small></p>
                                </div>
                            </div>
                        </div>
                    </div>`;
                    area.innerHTML = html;
                    console.log("CLIENT-SIDE LOG: Finished renderAccommodations.");
                }

                function initMapWithTripData() {
                    console.log("CLIENT-SIDE LOG: Starting initMapWithTripData...");
                    const map = MapUtils.initMap("map");
                    const scheduleMarkers = MapUtils.createDayMarkers(map, tripPlan.dailySchedules || []);
                    const allMarkers = [...scheduleMarkers];

                    const acc = tripPlan.accommodation;
                    if (acc && acc.latitude && acc.longitude) {
                        const hotelIcon = L.divIcon({ html: "<i class='fas fa-hotel' style='color:#007bff;font-size:2rem;'></i>", className: 'hotel-marker-icon' });
                        const accMarker = L.marker([acc.latitude, acc.longitude], { icon: hotelIcon }).addTo(map).bindPopup(`<b>${acc.placeName}</b><br>${acc.description || ''}`);
                        allMarkers.push(accMarker);
                    }

                    const coordinates = [];
                    if (tripPlan.dailySchedules) {
                        tripPlan.dailySchedules.forEach(daily => {
                            if (daily.schedules) {
                                daily.schedules.forEach(schedule => {
                                    if (schedule.latitude && schedule.longitude) {
                                        coordinates.push([schedule.latitude, schedule.longitude]);
                                    }
                                });
                            }
                        });
                    }
                    if (coordinates.length > 1) {
                        MapUtils.createRoute(map, coordinates);
                    }

                    if (allMarkers.length > 0) {
                        MapUtils.fitMapToMarkers(map, allMarkers);
                    }
                    console.log("CLIENT-SIDE LOG: Finished initMapWithTripData.");
                }

                document.addEventListener("DOMContentLoaded", function () {
                    console.log("CLIENT-SIDE LOG: DOM fully loaded and parsed. Starting render functions.");
                    renderItineraryAndTabs();
                    renderAccommodations(); 
                    initMapWithTripData();
                });
            } catch (e) {
                console.error("CLIENT-SIDE CRITICAL ERROR: An error occurred during script execution:", e);
                const debugArea = document.getElementById('debugArea');
                if(debugArea) {
                    debugArea.classList.remove('d-none');
                    debugArea.textContent = `A critical error occurred: ${e.message}\nStack: ${e.stack}`;
                }
            }
        </script>
    </body>
</html>
