<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko" id="htmlTag">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabitomo</title>
    <link rel="icon" th:href="@{/image/pabicone.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/translation.js}"></script>


</head>
<body>
<header class="bg-primary text-white p-3" th:fragment="header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <h1>Tabitomo</h1>
            <div class="dropdown" id="translation-dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" id="languageDropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fas fa-language"></i> Language
                </button>
                <ul class="dropdown-menu" aria-labelledby="languageDropdownMenuButton">
                    <li><a class="dropdown-item" href="#" data-lang="ko">한국어</a></li>
                    <li><a class="dropdown-item" href="#" data-lang="ja">日本語</a></li>
                    <li><a class="dropdown-item" href="#" data-lang="en">English</a></li>
                    <li><a class="dropdown-item" href="#" data-lang="zh-CN">中文(简体)</a></li>
                    <li><a class="dropdown-item" href="#" data-lang="zh-TW">中文(繁體)</a></li>
                </ul>
            </div>
        </div>
    </div>
</header>
