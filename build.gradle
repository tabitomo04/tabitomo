plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '3.3.2'
}

group = 'com.koreatravel'
version = '0.0.1-SNAPSHOT'
description = 'Tabitomo Travel Assistant'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }  // For Spring AI
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
    set('springAiVersion', "1.0.1")
    set('mapstructVersion', "1.6.0")
    set('openCsvVersion', "5.9")
    set('jsoupVersion', "1.17.2")
    set('googleCloudTranslateVersion', "2.38.0")
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-web-services'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    
    // Spring AI
    implementation 'org.springframework.ai:spring-ai-starter-model-vertex-ai-gemini'
    
    // Spring Session
    implementation 'org.springframework.session:spring-session-jdbc'
    
    // Thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    
    // Explicitly set Thymeleaf version compatible with Spring Boot 3.2.0
    ext['thymeleaf.version'] = '3.1.2.RELEASE'
    ext['thymeleaf-layout-dialect.version'] = '3.2.1'
    
    // Jakarta Mail
    implementation 'com.sun.mail:jakarta.mail:2.0.1'
    
    // MapStruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    
    // OpenCSV
    implementation "com.opencsv:opencsv:${openCsvVersion}"
    
    // JSoup for HTML parsing
    implementation "org.jsoup:jsoup:${jsoupVersion}"
    
    // Thumbnailator for image processing
    implementation 'net.coobird:thumbnailator:0.4.19'
    
    // Google Cloud Services
    implementation "com.google.cloud:google-cloud-translate:${googleCloudTranslateVersion}"
    
    // Jakarta Validation
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    
    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    
    // Development Only
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    
    // Runtime Only
    runtimeOnly 'com.mysql:mysql-connector-j'
    
    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Add task to generate MapStruct mappers during compilation
tasks.withType(JavaCompile) {
    options.compilerArgs = [
        '-Amapstruct.suppressGeneratorTimestamp=true',
        '-Amapstruct.suppressGeneratorVersionInfoComment=true',
        '-Amapstruct.verbose=false',
        '-parameters'  // For parameter name retention in Java 8+
    ]
}

// Configure JAR file name and manifest
bootJar {
    archiveFileName = "${project.name}.${archiveExtension.get()}"
    manifest {
        attributes 'Implementation-Title': project.name,
                   'Implementation-Version': project.version,
                   'Created-By': 'Tabitomo Team',
                   'Built-By': System.getProperty('user.name'),
                   'Built-JDK': System.getProperty('java.version'),
                   'Build-Time': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
    }
}

