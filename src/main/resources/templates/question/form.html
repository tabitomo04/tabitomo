<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타비토모 - 여행 성향 테스트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .question-card {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        .question-card.active {
            display: block;
        }
        .progress {
            height: 10px;
        }
        .progress-bar {
            transition: width 0.3s ease-in-out;
        }
        .nav-btn {
            min-width: 100px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white p-0">
                        <div class="header-image" style="background-image: url('/image/tomo.png');"></div>
                        <div class="header-content p-4">
                            <h3 class="h5 mb-0 text-center">여행 성향 테스트</h3>
                        </div>
                    </div>
                    <div class="card-body">
                        <!-- Progress Bar -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between mb-2">
                                <small>진행 상황</small>
                                <small><span id="current-question">1</span>/<span id="total-questions">5</span></small>
                            </div>
                            <div class="progress">
                                <div id="progress-bar" class="progress-bar bg-primary" role="progressbar" style="width: 20%" 
                                     aria-valuenow="20" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>

                        <form id="questionForm" th:action="@{/question/form}" method="post">
                            <!-- Question 1 -->
                            <div class="question-card active" data-question="1">
                                <div class="card mb-4 border-primary">
                                    <div class="card-body">
                                        <img src="/image/tomo.png" alt="여행 계획" class="question-image">
                                        <h5 class="card-title">1. 여행을 계획할 때 가장 중요하게 생각하는 것은 무엇인가요?</h5>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q1" id="q1_1" value="1" required>
                                            <label class="form-check-label" for="q1_1">
                                                명소 방문과 관광지 체험
                                            </label>
                                        </div>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q1" id="q1_2" value="2">
                                            <label class="form-check-label" for="q1_2">
                                                현지 음식과 맛집 탐방
                                            </label>
                                        </div>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q1" id="q1_3" value="3">
                                            <label class="form-check-label" for="q1_3">
                                                쇼핑과 시장 구경
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="q1" id="q1_4" value="4">
                                            <label class="form-check-label" for="q1_4">
                                                휴양과 휴식
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Question 2 -->
                            <div class="question-card" data-question="2">
                                <div class="card mb-4 border-primary">
                                    <div class="card-body">
                                        <img src="/image/tomo.png" alt="여행 활동" class="question-image">
                                        <h5 class="card-title">2. 여행지에서 선호하는 활동은 무엇인가요?</h5>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q2" id="q2_1" value="1" required>
                                            <label class="form-check-label" for="q2_1">
                                                대중교통 (지하철, 버스 등)
                                            </label>
                                        </div>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q2" id="q2_2" value="2">
                                            <label class="form-check-label" for="q2_2">
                                                렌터카나 자가용
                                            </label>
                                        </div>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q2" id="q2_3" value="3">
                                            <label class="form-check-label" for="q2_3">
                                                도보 또는 자전거
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="q2" id="q2_4" value="4">
                                            <label class="form-check-label" for="q2_4">
                                                택시나 전세 서비스
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Question 3 -->
                            <div class="question-card" data-question="3">
                                <div class="card mb-4 border-primary">
                                    <div class="card-body">
                                        <img src="/image/tomo.png" alt="여행 일정" class="question-image">
                                        <h5 class="card-title">3. 여행 일정을 어떻게 계획하시나요?</h5>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q3" id="q3_1" value="1" required>
                                            <label class="form-check-label" for="q3_1">
                                                상세한 일정을 미리 계획합니다.
                                            </label>
                                        </div>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q3" id="q3_2" value="2">
                                            <label class="form-check-label" for="q3_2">
                                                대략적인 계획만 세우고 유연하게 움직입니다.
                                            </label>
                                        </div>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q3" id="q3_3" value="3">
                                            <label class="form-check-label" for="q3_3">
                                                현지에서 즉흥적으로 결정합니다.
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="q3" id="q3_4" value="4">
                                            <label class="form-check-label" for="q3_4">
                                                여행사의 패키지 상품을 이용합니다.
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Question 4 -->
                            <div class="question-card" data-question="4">
                                <div class="card mb-4 border-primary">
                                    <div class="card-body">
                                        <img src="/image/tomo.png" alt="여행 예산" class="question-image">
                                        <h5 class="card-title">4. 여행 예산은 어떻게 관리하시나요?</h5>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q4" id="q4_1" value="1" required>
                                            <label class="form-check-label" for="q4_1">
                                                절약하면서 합리적인 소비를 합니다.
                                            </label>
                                        </div>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q4" id="q4_2" value="2">
                                            <label class="form-check-label" for="q4_2">
                                                계획된 예산 내에서 지출합니다.
                                            </label>
                                        </div>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q4" id="q4_3" value="3">
                                            <label class="form-check-label" for="q4_3">
                                                특별한 경험에는 돈을 아끼지 않습니다.
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="q4" id="q4_4" value="4">
                                            <label class="form-check-label" for="q4_4">
                                                여행 경비는 크게 신경 쓰지 않습니다.
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Question 5 -->
                            <div class="question-card" data-question="5">
                                <div class="card mb-4 border-primary">
                                    <div class="card-body">
                                        <img src="/image/tomo.png" alt="여행 스타일" class="question-image">
                                        <h5 class="card-title">5. 선호하는 여행 스타일은 무엇인가요?</h5>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q5" id="q5_1" value="1" required>
                                            <label class="form-check-label" for="q5_1">
                                                액티비티와 체험 중심의 여행
                                            </label>
                                        </div>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q5" id="q5_2" value="2">
                                            <label class="form-check-label" for="q5_2">
                                                문화와 역사 탐방 중심의 여행
                                            </label>
                                        </div>
                                        <div class="form-check mb-3">
                                            <input class="form-check-input" type="radio" name="q5" id="q5_3" value="3">
                                            <label class="form-check-label" for="q5_3">
                                                자연과 풍경 감상 위주의 여행
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="q5" id="q5_4" value="4">
                                            <label class="form-check-label" for="q5_4">
                                                휴양과 힐링 중심의 여행
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Navigation Buttons -->
                            <div class="d-flex justify-content-between mt-4">
                                <div>
                                    <button type="button" id="prevBtn" class="btn btn-outline-primary nav-btn" style="display: none;">
                                        <i class="bi bi-arrow-left"></i> 이전
                                    </button>
                                </div>
                                <div>
                                    <button type="button" id="nextBtn" class="btn btn-primary nav-btn">
                                        다음 <i class="bi bi-arrow-right"></i>
                                    </button>
                                    <button type="submit" id="submitBtn" class="btn btn-success nav-btn" style="display: none;">
                                        제출하기 <i class="bi bi-check-lg"></i>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            const totalQuestions = $('.question-card').length;
            let currentQuestion = 1;
            
            // Set total questions count
            $('#total-questions').text(totalQuestions);
            
            // Next button click handler
            $('#nextBtn').click(function() {
                // Validate current question
                const currentCard = $(`.question-card[data-question="${currentQuestion}"]`);
                const currentInput = currentCard.find('input[type="radio"]:checked');
                
                if (currentInput.length === 0) {
                    alert('답변을 선택해주세요.');
                    return;
                }
                
                // Hide current question
                currentCard.removeClass('active');
                
                // Show next question
                currentQuestion++;
                $(`.question-card[data-question="${currentQuestion}"]`).addClass('active');
                
                // Show previous button when not on first question
                if (currentQuestion > 1) {
                    $('#prevBtn').show();
                }
                
                // Update progress
                updateProgress();
                
                // Show submit button only on last question
                if (currentQuestion === totalQuestions) {
                    $('#nextBtn').hide();
                    $('#submitBtn').show();
                } else {
                    $('#submitBtn').hide();
                    $('#nextBtn').show();
                }
            });
            
            // Previous button click handler
            $('#prevBtn').click(function() {
                // Hide current question
                $(`.question-card[data-question="${currentQuestion}"]`).removeClass('active');
                
                // Show previous question
                currentQuestion--;
                $(`.question-card[data-question="${currentQuestion}"]`).addClass('active');
                
                // Update progress
                updateProgress();
                
                // Hide previous button on first question
                if (currentQuestion === 1) {
                    $('#prevBtn').hide();
                } else {
                    $('#prevBtn').show();
                }
                
                // Always hide submit button when going back
                $('#submitBtn').hide();
                $('#nextBtn').show();
            });
            
            // Update progress bar and question counter
            function updateProgress() {
                const progress = (currentQuestion / totalQuestions) * 100;
                $('#progress-bar').css('width', progress + '%').attr('aria-valuenow', progress);
                $('#current-question').text(currentQuestion);
            }
            
            // Form submission handler
            $('#questionForm').on('submit', function(e) {
                // Validate last question
                const lastCard = $(`.question-card[data-question="${totalQuestions}"]`);
                const lastInput = lastCard.find('input[type="radio"]:checked');
                
                if (lastInput.length === 0) {
                    e.preventDefault();
                    alert('마지막 질문에 답변을 선택해주세요.');
                }
            });
        });
    </script>
</body>
</html>
