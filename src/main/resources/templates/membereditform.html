<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 정보 수정</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        /* Tagify의 기본 스타일을 Tailwind CSS와 통합하기 위한 커스텀 스타일 */
        .tagify {
            --tag-bg: #e5e7eb; /* gray-200 */
            --tag-text-color: #4b5563; /* gray-700 */
            --tag-border-radius: 9999px; /* full rounded */
            --tag-padding: 0.25rem 0.75rem; /* px-3 py-1 */
            --tag-hover-bg: #d1d5db; /* gray-300 */
            --tag-remove-btn-color: #4b5563; /* gray-700 */
            --tag-remove-btn-color--hover: #1f2937; /* gray-900 */
            width: 100%;
            padding: 0.75rem 0.5rem;
            border-radius: 0.5rem; /* rounded-lg */
            border: 1px solid #d1d5db; /* gray-300 */
            transition: border-color, box-shadow 0.2s ease-in-out;
        }
        .tagify:focus-within {
            --tw-ring-color: #3b82f6; /* blue-500 */
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px var(--tw-ring-color);
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css">
</head>
<body class="flex items-center justify-center min-h-screen p-4">
<div id="app" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-xl">
    <div id="edit-view" class="space-y-6">
        <h2 class="text-2xl font-semibold mb-4 text-center text-gray-700">회원 정보 수정</h2>
        <form id="edit-form" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">이메일</label>
                <input type="email" id="email" name="email" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-100 cursor-not-allowed" disabled>
            </div>

            <div>
                <label for="nickname" class="block text-sm font-medium text-gray-700 mb-1">닉네임</label>
                <div class="flex items-center space-x-2">
                    <input type="text" id="nickname" name="nickname" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" required>
                    <button type="button" id="check-nickname-button" class="whitespace-nowrap py-3 px-4 bg-gray-200 text-gray-700 font-medium rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400">중복 확인</button>
                </div>
            </div>

            <div>
                <label for="profileImage" class="block text-sm font-medium text-gray-700 mb-1">프로필 이미지</label>
                <div class="flex items-center space-x-4">
                    <img id="profile-image-preview" src="https://placehold.co/100x100/e5e7eb/4b5563?text=Profile" alt="프로필 이미지 미리보기" class="w-24 h-24 rounded-full border-2 border-gray-300 object-cover">
                    <input type="file" id="profileImage" name="profileImage" accept="image/*" class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100">
                </div>
            </div>

            <div>
                <label for="statusMessage" class="block text-sm font-medium text-gray-700 mb-1">상태메시지</label>
                <textarea id="statusMessage" name="statusMessage" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"></textarea>
            </div>

            <div>
                <label for="hashtags" class="block text-sm font-medium text-gray-700 mb-1">해시태그 (예: 개발, 여행)</label>
                <input type="text" id="hashtags" name="hashtags" placeholder="해시태그를 입력하세요">
            </div>

            <button type="submit" id="submit-button" class="w-full py-3 px-6 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-md transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">수정 완료</button>
        </form>
        <button id="cancel-button" class="w-full py-3 px-6 bg-gray-500 hover:bg-gray-600 text-white font-medium rounded-lg shadow-md transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2">취소</button>
    </div>

    <div id="message-box" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl text-center max-w-sm w-full mx-4">
            <p id="message-text" class="text-lg font-medium mb-4 text-gray-800"></p>
            <button id="close-message-button" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">확인</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
<script>
    const cancelButton = document.getElementById('cancel-button');
    const editForm = document.getElementById('edit-form');
    const nicknameInput = document.getElementById('nickname');
    const checkNicknameButton = document.getElementById('check-nickname-button');
    const profileImageInput = document.getElementById('profileImage');
    const profileImagePreview = document.getElementById('profile-image-preview');
    const statusMessageInput = document.getElementById('statusMessage');
    const hashtagsInput = document.getElementById('hashtags');
    const submitButton = document.getElementById('submit-button');
    const messageBox = document.getElementById('message-box');
    const messageText = document.getElementById('message-text');
    const closeMessageButton = document.getElementById('close-message-button');
    const emailInput = document.getElementById('email');

    let nicknameChecked = false;

    // 현재 로그인된 사용자 정보 (서버에서 가져온다고 가정)
    let currentUser = {
        email: 'dev.kim@example.com',
        nickname: '개발자킴',
        profileImage: 'https://placehold.co/100x100/e5e7eb/4b5563?text=Profile',
        statusMessage: '새로운 기능을 만드는 중입니다.',
        hashtags: ['개발', '취미', '코딩'] // 배열 형태로 저장
    };

    // Tagify 인스턴스를 저장할 변수
    let tagify;

    function showMessage(message) {
        messageText.textContent = message;
        messageBox.classList.remove('hidden');
    }

    function updateSubmitButtonState() {
        if (nicknameChecked) {
            submitButton.disabled = false;
            submitButton.classList.remove('bg-gray-400', 'cursor-not-allowed');
            submitButton.classList.add('bg-blue-600', 'hover:bg-blue-700');
        } else {
            submitButton.disabled = true;
            submitButton.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            submitButton.classList.add('bg-gray-400', 'cursor-not-allowed');
        }
    }

    // 초기 폼 데이터 로딩
    function loadProfileData() {
        emailInput.value = currentUser.email;
        nicknameInput.value = currentUser.nickname;
        statusMessageInput.value = currentUser.statusMessage;

        // **기존 해시태그 로직을 Tagify 초기화로 변경**
        tagify = new Tagify(hashtagsInput, {
            delimiters: ",| ",
            whitelist: [],
            maxTags: 10,
            enforceWhitelist: false,
            backspace: "edit",
            dropdown: { enabled: 0 }
        });

        // 기존 태그를 Tagify에 로드
        tagify.addTags(currentUser.hashtags);

        profileImagePreview.src = currentUser.profileImage;

        nicknameChecked = true;
        updateSubmitButtonState();
    }

    // 닉네임 중복 확인 버튼 클릭 이벤트
    checkNicknameButton.addEventListener('click', () => {
        const newNickname = nicknameInput.value.trim();
        if (newNickname === '') {
            showMessage('닉네임을 입력해 주세요.');
            return;
        }

        if (newNickname === currentUser.nickname) {
            showMessage('현재 닉네임과 동일합니다.');
            nicknameChecked = true;
            updateSubmitButtonState();
            return;
        }

        fetch(`/checkNickname?nickname=${encodeURIComponent(newNickname)}`)
            .then(response => response.json())
            .then(data => {
                if (data.isDuplicate) {
                    showMessage('이미 사용 중인 닉네임입니다.');
                    nicknameChecked = false;
                } else {
                    showMessage('사용 가능한 닉네임입니다.');
                    nicknameChecked = true;
                }
                updateSubmitButtonState();
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('중복 확인 중 오류가 발생했습니다.');
                nicknameChecked = false;
                updateSubmitButtonState();
            });
    });

    // 닉네임 입력 시 중복 확인 상태 초기화
    nicknameInput.addEventListener('input', () => {
        nicknameChecked = false;
        updateSubmitButtonState();
    });

    // 수정 폼 제출 이벤트
    editForm.addEventListener('submit', (event) => {
        event.preventDefault();

        if (!nicknameChecked) {
            showMessage('닉네임 중복 확인이 필요합니다.');
            return;
        }

        const formData = new FormData(editForm);

        // **Tagify에서 생성된 태그 데이터를 쉼표로 구분된 문자열로 변환하여 추가**
        const hashtagsString = tagify.value.map(tag => tag.value).join(',');

        formData.append('email', currentUser.email);
        formData.append('statusMessage', statusMessageInput.value);
        formData.append('hashtags', hashtagsString);

        // 서버에 회원 정보 업데이트 요청
        fetch('/member/edit', {
            method: 'POST',
            body: formData,
        })
        .then(response => {
            if (response.ok) {
                showMessage('회원 정보가 성공적으로 수정되었습니다.');
                setTimeout(() => location.reload(), 2000);
            } else {
                showMessage('회원 정보 수정에 실패했습니다.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showMessage('네트워크 오류가 발생했습니다.');
        });
    });

    // 프로필 이미지 미리보기 기능
    profileImageInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                profileImagePreview.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    // 메시지 박스 닫기 이벤트
    closeMessageButton.addEventListener('click', () => {
        messageBox.classList.add('hidden');
    });

    // 페이지 로드 시 초기 데이터 로딩
    loadProfileData();
</script>
</body>
</html>
