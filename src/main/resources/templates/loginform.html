<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2e4c4c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>로그인 - 타비토모</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Fixes -->
  <link href="/css/bootstrap-fixes.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #2e4c4c;
      --secondary-color: #5f9ea0;
      --accent-color: #ff6b6b;
      --light-gray: #f8f9fa;
      --dark-gray: #343a40;
      --error-bg: #f8d7da;
      --error-text: #721c24;
      --error-border: #f5c6cb;
    }
    
    .error-message {
      display: block !important;
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 6px;
      background-color: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }
    
    .error-message div {
      font-weight: 500;
    }
    
    .step-line-progress {
      width: 0%;
    }
    
    .step-content {
      display: none;
    }
    
    #nextStepBtn,
    #resetPasswordBtn,
    #prevStepBtn {
      display: none;
    }
    
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      width: 100%;
      max-width: 400px;
    }
    
    .login-header {
      background: var(--primary-color);
      color: white;
      padding: 25px;
      text-align: center;
    }
    
    .login-header h2 {
      margin: 0;
      font-weight: 700;
    }
    
    .login-body {
      padding: 30px;
    }
    
    .form-control {
      border-radius: 8px;
      padding: 12px 15px;
      border: 1px solid #e0e0e0;
      transition: all 0.3s;
    }
    
    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.25rem rgba(46, 76, 76, 0.25);
    }
    
    .form-label {
      font-weight: 500;
      color: var(--dark-gray);
      margin-bottom: 8px;
    }
    
    .btn-login {
      background: var(--primary-color);
      border: none;
      padding: 12px;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.3s;
    }
    
    .btn-login:hover {
      background: #1e3c3c;
      transform: translateY(-2px);
    }
    
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #6c757d;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #dee2e6;
    }
    
    .divider:not(:empty)::before {
      margin-right: 1em;
    }
    
    .divider:not(:empty)::after {
      margin-left: 1em;
    }
    
    .social-login {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .social-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 500;
      transition: all 0.3s;
    }
    
    .social-btn i {
      font-size: 1.2rem;
    }
    
    .btn-google {
      background: #fff;
      border: 1px solid #dee2e6;
      color: #757575;
    }
    
    .btn-google:hover {
      background: #f8f9fa;
      color: #212529;
    }
    
    .btn-naver {
      background: #03c75a;
      color: white;
      border: 1px solid #03c75a;
    }
    
    .btn-naver:hover {
      background: #03a84d;
      color: white;
    }
    
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #6c757d;
    }
    
    .login-footer a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
      margin: 0 8px;
    }
    
    .login-footer a:hover {
      text-decoration: underline;
    }
    
    /* Custom checkbox */
    .form-check-input:checked {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }
    
    /* Password reset modal */
    .verification-code {
      letter-spacing: 5px;
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
    }
    
    .countdown {
      color: var(--accent-color);
      font-weight: bold;
    }
    
    .step-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      position: relative;
    }
    
    .step {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e9ecef;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #6c757d;
      position: relative;
      z-index: 1;
    }
    
    .step.active {
      background: var(--primary-color);
      color: white;
    }
    
    .step.completed {
      background: var(--secondary-color);
      color: white;
    }
    
    .step-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: #e9ecef;
      z-index: 0;
    }
    
    .step-line-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: var(--secondary-color);
      transition: width 0.3s;
    }
    
    /* Responsive adjustments */
    @media (max-width: 480px) {
      .login-card {
        margin: 10px;
      }
      
      .login-body {
        padding: 20px;
      }
      
      .social-login {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <h2>로그인</h2>
    <div class="small">타비토모에 오신 것을 환영합니다</div>
  </div>
  
  <div class="login-body">
    <!-- 오류 메시지 표시 -->
    <div th:if="${param.error}" class="error-message" role="alert">
        <div th:if="${param.error == 'unaired'}">
            <i class="fas fa-exclamation-circle me-2" aria-hidden="true"></i>로그인이 필요한 서비스입니다. 로그인 후 이용해주세요.
        </div>
        <div th:if="${param.error == 'true'}">
            <div th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null}">
                <div th:if="${session.SPRING_SECURITY_LAST_EXCEPTION.message == '비활성화된 계정입니다. 관리자에게 문의해주세요.'}">
                    <i class="fas fa-exclamation-circle me-2" aria-hidden="true"></i>비활성화된 계정입니다. 관리자에게 문의해주세요.
                </div>
                <div th:unless="${session.SPRING_SECURITY_LAST_EXCEPTION.message == '비활성화된 계정입니다. 관리자에게 문의해주세요.'}">
                    <i class="fas fa-exclamation-circle me-2" aria-hidden="true"></i>이메일 또는 비밀번호가 일치하지 않습니다.
                </div>
            </div>
            <div th:unless="${session.SPRING_SECURITY_LAST_EXCEPTION != null}">
                <i class="fas fa-exclamation-circle me-2" aria-hidden="true"></i>이메일 또는 비밀번호가 일치하지 않습니다.
            </div>
        </div>
    </div>
    
    <!-- 이메일 로그인 폼 -->
    <form id="loginForm" th:action="@{/auth/login}" method="post" onsubmit="return handleLoginSubmit(event)">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div class="mb-3">
        <label for="email" class="form-label">이메일</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="이메일을 입력하세요" th:value="${savedEmail}" required>
      </div>
      
      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label for="password" class="form-label mb-0">비밀번호</label>
          <a href="#" id="forgotPassword" class="text-decoration-none small">비밀번호 찾기</a>
        </div>
        <div class="input-group">
          <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required
                 autocomplete="current-password" aria-describedby="passwordHelp">
          <button class="btn btn-outline-secondary" type="button" id="togglePassword" 
                  aria-label="비밀번호 표시/숨기기" aria-pressed="false">
            <i class="fas fa-eye" aria-hidden="true"></i>
            <span class="visually-hidden">비밀번호 표시/숨기기</span>
          </button>
        </div>
        <div id="passwordHelp" class="form-text">대소문자, 숫자, 특수문자를 조합하여 8자 이상 입력해주세요.</div>
      </div>

      <!-- 이메일 저장 및 자동 로그인 -->
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="rememberEmail" name="remember-email" th:checked="${rememberEmail != null ? rememberEmail : false}">
        <label class="form-check-label" for="rememberEmail">이메일 저장</label>
      </div>
      <div class="mb-4 form-check">
        <input type="checkbox" class="form-check-input" id="autoLogin" name="remember-me">
        <label class="form-check-label" for="autoLogin">자동 로그인</label>
        <div class="form-text small text-muted">공용 컴퓨터에서는 사용을 권장하지 않습니다.</div>
      </div>

      <!-- 로그인 버튼 -->
      <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="loginButton">
        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true" id="loginSpinner"></span>
        <span id="loginText">로그인</span>
      </button>

      <!-- 회원가입 링크 -->
      <div class="text-center mt-4">
        <p class="mb-0">아직 회원이 아니신가요? <a href="/auth/signup" class="text-primary text-decoration-none">회원가입</a></p>
      </div>
    </form>
  </div>
</div>

<!-- 비밀번호 재설정 모달 -->
<div class="modal fade" id="passwordModal" tabindex="-1" aria-labelledby="passwordModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="passwordModalLabel">비밀번호 재설정</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
      </div>
      <div class="modal-body">
        <form id="passwordResetForm">
          <div class="mb-3">
            <label for="resetEmail" class="form-label">이메일 주소</label>
            <input type="email" class="form-control" id="resetEmail" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-primary" id="sendResetLink">링크 발송</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// DOM이 완전히 로드된 후 실행
function handleLoginSubmit(event) {
    event.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const loginButton = document.getElementById('loginButton');
    const loginSpinner = document.getElementById('loginSpinner');
    const loginText = document.getElementById('loginText');
    
    // 간단한 유효성 검사
    if (!email) {
        showError('이메일을 입력해주세요.', 'email');
        return false;
    }
    
    if (!password) {
        showError('비밀번호를 입력해주세요.', 'password');
        return false;
    }
    
    // 로딩 상태 표시
    loginButton.disabled = true;
    loginSpinner.classList.remove('d-none');
    loginText.textContent = '로그인 중...';
    
    // 폼 제출
    event.target.submit();
    
    return true;
}

function showError(message, fieldId) {
    // 기존 에러 메시지 제거
    const existingError = document.querySelector(`#${fieldId} ~ .invalid-feedback`);
    if (existingError) {
        existingError.remove();
    }
    
    // 새 에러 메시지 추가
    const input = document.getElementById(fieldId);
    const errorDiv = document.createElement('div');
    errorDiv.className = 'invalid-feedback d-block';
    errorDiv.textContent = message;
    
    input.classList.add('is-invalid');
    input.parentNode.insertBefore(errorDiv, input.nextSibling);
    
    // 포커스 이동
    input.focus();
    
    // 5초 후 에러 메시지 제거
    setTimeout(() => {
        input.classList.remove('is-invalid');
        if (errorDiv.parentNode) {
            errorDiv.remove();
        }
    }, 5000);
}

document.addEventListener('DOMContentLoaded', function() {
    // 저장된 이메일이 있으면 포커스 이동
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    if (emailInput.value) {
        passwordInput.focus();
    } else {
        emailInput.focus();
    }
    
    // 비밀번호 보이기/숨기기 토글
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    const loginForm = document.querySelector('#loginForm');
    const loginButton = document.querySelector('#loginButton');
    const loginSpinner = document.querySelector('#loginSpinner');
    const forgotPassword = document.querySelector('#forgotPassword');
    const passwordModal = new bootstrap.Modal(document.getElementById('passwordModal'));
    const loginText = document.querySelector('#loginText');
    
    // 로그인 폼 제출 시 로딩 상태 표시
    if (loginForm) {
      loginForm.addEventListener('submit', function() {
        loginButton.disabled = true;
        loginSpinner.classList.remove('d-none');
        loginText.textContent = '로그인 중...';
      });
    }
    
    // 비밀번호 표시/숨기기 토글
    if (togglePassword) {
        togglePassword.addEventListener('click', function() {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            const isPasswordVisible = type === 'text';
            
            password.setAttribute('type', type);
            
            // 아이콘 업데이트
            const icon = this.querySelector('i');
            icon.classList.toggle('fa-eye', !isPasswordVisible);
            icon.classList.toggle('fa-eye-slash', isPasswordVisible);
            
            // ARIA 속성 업데이트
            this.setAttribute('aria-pressed', isPasswordVisible);
            this.setAttribute('aria-label', isPasswordVisible ? '비밀번호 숨기기' : '비밀번호 표시');
        });
    }
    
    // 비밀번호 찾기 모달 열기
    if (forgotPassword) {
        forgotPassword.addEventListener('click', function(e) {
            e.preventDefault();
            passwordModal.show();
        });
    }
    
    // 폼 유효성 검사 초기화
    if (loginForm) {
        // 입력 필드의 유효성 검사 상태 초기화
        const inputs = loginForm.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('input', function() {
                if (this.checkValidity()) {
                    this.classList.remove('is-invalid');
                    const errorMessage = this.nextElementSibling;
                    if (errorMessage && errorMessage.classList.contains('invalid-feedback')) {
                        errorMessage.remove();
                    }
                }
            });
        });
    }
    
    // 자동 로그인 체크박스 이벤트 리스너
    const autoLoginCheckbox = document.getElementById('autoLogin');
    const rememberMeCheckbox = document.getElementById('rememberMe');
    
    if (autoLoginCheckbox && rememberMeCheckbox) {
        autoLoginCheckbox.addEventListener('change', function() {
            if (this.checked) {
                rememberMeCheckbox.checked = true;
            }
        });
        
        // 자동 로그인이 체크되어 있으면 로그인 상태 유지도 체크
        if (autoLoginCheckbox.checked) {
            rememberMeCheckbox.checked = true;
        }
    }
});
</script>
<script src="/js/login.js"></script>
</body>
</html>
