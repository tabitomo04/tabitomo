# Test Database Configuration
spring.datasource.url=jdbc:mysql://35.185.255.44:3306/tabitomo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
spring.datasource.username=user
spring.datasource.password=tabitomo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool Settings for Testing
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate Configuration for Testing
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.implicit_naming_strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.open-in-view=false

# Flyway Configuration for Testing
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:test/db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false

# Disable external API calls in tests
spring.ai.vertex.ai.gemini.location=disabled

# Email Configuration for Testing (using GreenMail)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Application Properties for Testing
app.base-url=http://localhost:8080
app.password-reset-token-expiry-hours=24
app.supported-languages=ko,en,ja

# Test-specific properties
spring.test.database.replace=none  # Use the actual database, not an embedded one
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Logging for tests
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.koreatravel.tabitomo=DEBUG
