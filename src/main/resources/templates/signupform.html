<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 400px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .inline-group {
      display: flex;
      gap: 8px;
    }

    .gender-option {
      flex: 1;
      text-align: center;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 10px;
      cursor: pointer;
      background: #eee;
    }

    .gender-option.selected {
      background: #4CAF50;
      color: white;
      font-weight: bold;
    }

    .btn-submit {
      background: #007BFF;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .btn-submit:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>회원가입</h2>
    <form th:action="@{/signup}" th:object="${memberDTO}" method="post" onsubmit="return handleSubmit()">

      <div class="form-group">
        <label>이메일</label>
        <div class="inline-group">
          <input type="text" id="emailId" placeholder="아이디">
          <span>@</span>
          <input type="text" id="emailDomain" placeholder="도메인">
          <button type="button">인증하기</button>
        </div>
      </div>

      <input type="hidden" name="email" id="hiddenEmail">

      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" name="password" required>
      </div>

      <div class="form-group">
        <label>비밀번호 확인</label>
        <input type="password" required>
      </div>

      <div class="form-group">
        <label>닉네임</label>
        <div class="inline-group">
          <input type="text" name="nickname" required>
          <button type="button">중복확인</button>
        </div>
      </div>

      <div class="form-group">
        <label>성별</label>
        <div class="inline-group">
          <div class="gender-option" onclick="selectGender(this, 1)">남</div>
          <div class="gender-option" onclick="selectGender(this, 2)">여</div>
          <div class="gender-option" onclick="selectGender(this, 3)">기타</div>
        </div>
        <input type="hidden" name="gender" id="gender">
      </div>

      <!-- Country Selection -->
      <div class="form-group">
        <label for="countryCode">국가</label>
        <select class="form-control" id="countryCode" name="countryCode" required>
          <option value="">국가를 선택하세요</option>
          <option th:each="country : ${countries}" th:value="${country.countryCode}"
            th:text="${country.countryNameKo} + ' (' + ${country.countryNameEn} + ')'">
          </option>
        </select>
      </div>

      <!-- Language Selection -->
      <div class="form-group">
        <label for="languageCode">사용 언어</label>
        <select class="form-control" id="languageCode" name="languageCode" required>
          <option value="">사용 언어를 선택하세요</option>
          <option th:each="language : ${languages}" th:value="${language.languageCode}"
            th:text="${language.nameNative} + ' (' + ${language.nameEn} + ')'">
          </option>
        </select>
      </div>

      <!-- 생년월일 -->
      <div class="form-group">
        <label for="birthDate">생년월일</label>
        <input type="date" name="birthDate" id="birthDate">
      </div>

      <div class="form-group">
        <button type="submit" class="btn-submit">회원가입 완료</button>
      </div>
    </form>
  </div>

  <script>
    function selectGender(el, value) {
      document.querySelectorAll(".gender-option").forEach(opt => {
        opt.classList.remove("selected");
      });
      el.classList.add("selected");
      document.getElementById("gender").value = value;
    }

    // 폼 제출을 가로채서 이메일 값을 hidden input에 설정하는 함수
    function handleSubmit() {
      const emailId = document.getElementById('emailId').value;
      const emailDomain = document.getElementById('emailDomain').value;
      const hiddenEmailInput = document.getElementById('hiddenEmail');

      // 이메일 아이디와 도메인이 모두 입력되었는지 확인
      if (!emailId || !emailDomain) {
        alert('이메일 주소를 모두 입력해주세요.');
        return false; // 폼 제출 중단
      }

      // 완전한 이메일 주소 생성
      hiddenEmailInput.value = `${emailId}@${emailDomain}`;

      // 폼 제출 계속 진행
      return true;
    }
  </script>
</body>

</html>
