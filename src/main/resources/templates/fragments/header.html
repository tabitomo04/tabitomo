<style>
    .nav-link {
        position: relative;
        padding: 0.5rem 0.75rem;
        color: #333;
        font-weight: 500;
        transition: all 0.3s ease;
    }
    
    .nav-link-underline {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 0;
        height: 2px;
        background-color: #4361ee;
        transform: translateX(-50%);
        transition: width 0.3s ease;
    }
    
    .nav-link:hover {
        color: #4361ee;
    }
    
    .nav-link:hover .nav-link-underline {
        width: 80%;
    }
    
    .navbar-brand {
        font-weight: 700;
        letter-spacing: -0.5px;
    }
</style>

<header class="bg-white shadow-sm fixed-top" th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-2">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand fw-bold text-primary fs-3" href="/">
                <i class="fas fa-plane-departure me-2"></i>Tabitomo
            </a>
            
            <!-- Mobile Toggle -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item mx-2">
                        <a class="nav-link position-relative" href="/destinations">
                            여행지 목록
                            <span class="nav-link-underline"></span>
                        </a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link position-relative" href="/trip/plan">
                            계획하기
                            <span class="nav-link-underline"></span>
                        </a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link position-relative" href="/storybook">
                            스토리북
                            <span class="nav-link-underline"></span>
                        </a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link position-relative" href="/mypage">
                            마이페이지
                            <span class="nav-link-underline"></span>
                        </a>
                    </li>
                </ul>
                
                <!-- User Profile / Login -->
                <div class="d-flex align-items-center">
                    <div th:if="${session.userEmail != null}" class="dropdown">
                        <a href="#" class="dropdown-toggle d-flex align-items-center text-decoration-none" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <img th:src="${session.userProfileImage != null} ? ${session.userProfileImage} : '/image/default image.svg'" 
                                 class="rounded-circle me-2" 
                                 width="40" 
                                 height="40" 
                                 alt="Profile"
                                 onerror="this.onerror=null; this.src='/image/default image.svg'">
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="/mypage"><i class="fas fa-user me-2"></i>마이페이지</a></li>
                            <li><a class="dropdown-item" href="/mypage/edit"><i class="fas fa-user-edit me-2"></i>내 정보 수정</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="/logout"><i class="fas fa-sign-out-alt me-2"></i>로그아웃</a></li>
                        </ul>
                    </div>
                    <a th:if="${session.userEmail == null}" href="/login" class="btn btn-outline-primary">
                        <i class="fas fa-sign-in-alt me-1"></i> 로그인
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>

<!-- Add space for fixed header -->
<div style="height: 72px;"></div>
