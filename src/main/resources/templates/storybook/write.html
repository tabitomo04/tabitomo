<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>스토리북 작성</title>
    <link rel="stylesheet" th:href="@{/css/editor.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <h2>새 스토리북 작성</h2>
        <form id="storybookForm" th:action="@{/storybook/save}" method="post">
            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="subtitle">부제목</label>
                <input type="text" class="form-control" id="subtitle" name="subtitle">
            </div>
            <div class="form-group">
                <label for="content">내용</label>
                <textarea class="form-control" id="content" name="content" rows="10" required></textarea>
            </div>
            <div class="form-group">
                <label>이미지 업로드</label>
                <div class="custom-file">
                    <input type="file" class="custom-file-input" id="imageUpload" multiple>
                    <label class="custom-file-label" for="imageUpload">이미지 선택</label>
                </div>
                <div id="imagePreview" class="mt-2"></div>
            </div>
            <div class="form-group text-right">
                <button type="button" class="btn btn-secondary" onclick="location.href='/storybook/list'">취소</button>
                <button type="button" class="btn btn-primary" id="saveDraft">임시저장</button>
                <button type="submit" class="btn btn-success">저장하기</button>
            </div>
        </form>
    </div>
</div>

<div layout:fragment="script">
    <script th:src="@{/js/editor.js}"></script>
</div>
</body>
</html>
