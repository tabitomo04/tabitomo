<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 타비토모</title>
    <!-- CSRF is disabled in security config -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style th:inline="none">
        body {
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1538485399081-7c8973e2a0de?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
        }
        .auth-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.1);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .auth-logo img {
            max-width: 180px;
            margin-bottom: 1.5rem;
        }
        .form-control:focus {
            border-color: #4361ee;
            box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.25);
        }
        .btn-primary {
            background-color: #4361ee;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background-color: #3a56d4;
            transform: translateY(-1px);
        }
        .btn-outline-primary {
            color: #4361ee;
            border-color: #4361ee;
        }
        .btn-outline-primary:hover {
            background-color: #4361ee;
            border-color: #4361ee;
        }
        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 2rem 0;
        }
        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #dee2e6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #6c757d;
            position: relative;
        }
        .step.active {
            background-color: #4361ee;
            color: white;
        }
        .connector {
            flex: 1;
            height: 2px;
            background-color: #dee2e6;
            margin: 0 10px;
            position: relative;
        }
        .connector.active {
            background-color: #4361ee;
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #6c757d;
        }
        .auth-footer a {
            color: #4361ee;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .form-text {
            font-size: 0.8rem;
        }
        .verification-container {
            display: none;
            margin-top: 1rem;
        }
        .verification-timer {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
        .verification-success {
            color: #198754;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
        .verification-error {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
            <div class="col-11 col-sm-8 col-lg-6">
                <div class="auth-container">
                    <div class="auth-logo text-center mb-4">
                        <img th:src="@{/image/logo.svg}" alt="타비토모 로고" style="max-width: 150px;">
                        <h1 class="h4 mt-3 mb-4 fw-bold">회원가입</h1>
                    </div>
                    
                    <!-- Step Indicator -->
                    <div class="step-indicator mb-4">
                        <span class="step active">1</span>
                        <span class="connector"></span>
                        <span class="step">2</span>
                    </div>
                    
                    <form id="signupForm" th:action="@{/auth/signup}" method="post" novalidate>
                        <!-- Error message placeholder -->
                        <div th:if="${param.error}" class="alert alert-danger">
                            <span th:text="${param.error}">An error occurred during signup.</span>
                        </div>
                        
                        <!-- Step 1: Email & Password -->
                        <div id="step1">
                            <!-- Email Input -->
                            <div class="mb-3">
                                <label for="emailId" class="form-label">이메일</label>
                                <div class="input-group mb-2">
                                    <input type="text" class="form-control" id="emailId" 
                                           placeholder="이메일 아이디" name="email" required>
                                    <span class="input-group-text">@</span>
                                    <select class="form-select" id="emailDomain" style="max-width: 150px;">
                                        <option value="gmail.com">gmail.com</option>
                                        <option value="naver.com">naver.com</option>
                                        <option value="daum.net">daum.net</option>
                                        <option value="nate.com">nate.com</option>
                                        <option value="kakao.com">kakao.com</option>
                                        <option value="">직접입력</option>
                                    </select>
                                    <input type="text" class="form-control d-none" id="customDomain" 
                                           placeholder="도메인 입력">
                                    <button class="btn btn-outline-secondary" type="button" id="checkEmailBtn">
                                        중복 확인
                                    </button>
                                </div>
                                <div id="emailCheckResult" class="form-text d-none"></div>
                                
                                <!-- Email Verification -->
                                <div id="verificationContainer" class="verification-container">
                                    <div class="input-group mb-2">
                                        <input type="text" class="form-control" id="verificationCode" 
                                               placeholder="인증번호 6자리 입력" maxlength="6" data-expected-code="">
                                        <button class="btn btn-outline-primary" type="button" id="sendVerificationBtn">
                                            인증번호 전송
                                        </button>
                                    </div>
                                    <div id="verificationTimer" class="verification-timer"></div>
                                    <div id="verificationResult" class="verification-result"></div>
                                </div>
                            </div>
                            
                            <!-- Password Input -->
                            <div class="mb-3">
                                <label for="password" class="form-label">비밀번호</label>
                                <input type="password" class="form-control" id="password" 
                                       placeholder="비밀번호 (영문, 숫자, 특수문자 포함 8자 이상)" required>
                                <div id="passwordHelp" class="form-text">
                                    영문, 숫자, 특수문자를 포함한 8자 이상의 비밀번호를 입력해주세요.
                                </div>
                            </div>
                            
                            <!-- Confirm Password -->
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">비밀번호 확인</label>
                                <input type="password" class="form-control" id="confirmPassword" 
                                       placeholder="비밀번호 확인" required>
                                <div id="passwordMatch" class="form-text"></div>
                            </div>
                            
                            <!-- Next Button -->
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-primary" id="nextBtn">다음 단계로</button>
                            </div>
                        </div>
                        
                        <!-- Step 2: User Information -->
                        <div id="step2" class="d-none">
                            <!-- Nickname -->
                            <div class="mb-3">
                                <label for="nickname" class="form-label">닉네임</label>
                                <input type="text" class="form-control" id="nickname" 
                                       placeholder="닉네임을 입력해주세요" required>
                                <div id="nicknameHelp" class="form-text">
                                    다른 유저와 구분할 수 있는 닉네임을 입력해주세요.
                                </div>
                            </div>
                            
                            <!-- Country Selection -->
                            <div class="mb-3">
                                <label for="countryId" class="form-label">국적</label>
                                <select class="form-select" id="countryId" name="countryId" required>
                                    <option value="" disabled selected>국적을 선택해주세요</option>
                                    <!-- Countries will be loaded dynamically -->
                                </select>
                                <input type="hidden" name="countryId" id="countryIdValue" th:field="*{countryId}">
                            </div>
                            
                            <!-- Preferred Language Selection -->
                            <div class="mb-3">
                                <label for="preferredLanguageId" class="form-label">선호 언어</label>
                                <select class="form-select" id="preferredLanguageId" name="preferredLanguageId" required>
                                    <option value="" disabled selected>선호하는 언어를 선택해주세요</option>
                                    <!-- Languages will be loaded dynamically -->
                                </select>
                                <input type="hidden" name="preferredLanguageId" id="preferredLanguageIdValue" th:field="*{preferredLanguageId}">
                            </div>
                            
                            <!-- Gender Selection -->
                            <div class="mb-4">
                                <label class="form-label d-block">성별</label>
                                <div class="btn-group w-100" role="group" aria-label="성별 선택">
                                    <input type="radio" class="btn-check" name="gender" id="gender-male" value="1" autocomplete="off" required>
                                    <label class="btn btn-outline-primary" for="gender-male">남성</label>
                                    
                                    <input type="radio" class="btn-check" name="gender" id="gender-female" value="2" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="gender-female">여성</label>
                                    
                                    <input type="radio" class="btn-check" name="gender" id="gender-other" value="3" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="gender-other">기타</label>
                                    
                                    <input type="radio" class="btn-check" name="gender" id="gender-na" value="4" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="gender-na">선택 안함</label>
                                </div>
                            </div>
                            
                            <!-- Submit and Back Buttons -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">가입 완료</button>
                                <button type="button" class="btn btn-outline-secondary mt-2" id="prevBtn">이전 단계로</button>
                            </div>
                        </div>
                    </form>
                    
                    <div class="auth-footer mt-4">
                        이미 계정이 있으신가요? <a th:href="@{/auth/login}" class="text-primary">로그인</a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Existing User Modal -->
        <div class="modal fade" id="existingUserModal" tabindex="-1" aria-labelledby="existingUserModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="existingUserModalLabel">이미 가입된 계정입니다</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        이미 가입된 이메일 주소입니다. 로그인 페이지로 이동하시겠습니까?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <a th:href="@{/auth/login}" class="btn btn-primary">로그인 하기</a>
                    </div>
                </div>
            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                // DOM Elements
                const checkEmailBtn = document.getElementById('checkEmailBtn');
                const emailId = document.getElementById('emailId');
                const emailDomain = document.getElementById('emailDomain');
                const customDomain = document.getElementById('customDomain');
                const verificationContainer = document.getElementById('verificationContainer');
                const sendVerificationBtn = document.getElementById('sendVerificationBtn');
                const verificationCode = document.getElementById('verificationCode');
                const verificationTimer = document.getElementById('verificationTimer');
                const verificationResult = document.getElementById('verificationResult');
                const password = document.getElementById('password');
                const confirmPassword = document.getElementById('confirmPassword');
                const passwordMatch = document.getElementById('passwordMatch');
                const step1 = document.getElementById('step1');
                const step2 = document.getElementById('step2');
                const nextBtn = document.getElementById('nextBtn');
                const prevBtn = document.getElementById('prevBtn');
                const signupForm = document.getElementById('signupForm');
                const nickname = document.getElementById('nickname');
                const name = document.getElementById('name');
                const phone = document.getElementById('phone');
                const countryCode = document.getElementById('countryCode');
                
                // Initialize modal
                let existingUserModal = null;
                const modalElement = document.getElementById('existingUserModal');
                if (modalElement) {
                    existingUserModal = new bootstrap.Modal(modalElement);
                }
                
                // State
                let isEmailVerified = false;
                let verificationCountdown = null;
                
                // Email domain handling
                emailDomain.addEventListener('change', function() {
                    if (this.value === '') {
                        customDomain.classList.remove('d-none');
                        customDomain.focus();
                    } else {
                        customDomain.classList.add('d-none');
                    }
                });
                
                // Get full email
                function getFullEmail() {
                    const domain = customDomain.classList.contains('d-none') ? 
                        emailDomain.value : 
                        customDomain.value;
                    return `${emailId.value}@${domain}`;
                }
                
                // Validate email format
                function validateEmail(email) {
                    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    return re.test(String(email).toLowerCase());
                }
                
                // Show error message
                function showError(elementId, message) {
                    const element = document.getElementById(elementId);
                    if (element) {
                        element.textContent = message;
                        element.classList.remove('d-none');
                        element.classList.add('text-danger');
                        element.classList.remove('text-success');
                    }
                }
                
                // Hide error message
                function hideError(elementId) {
                    const element = document.getElementById(elementId);
                    if (element) {
                        element.textContent = '';
                        element.classList.add('d-none');
                    }
                }
                
                // Show success message
                function showSuccess(elementId, message) {
                    const element = document.getElementById(elementId);
                    if (element) {
                        element.textContent = message || '';
                        element.classList.remove('d-none');
                        element.classList.add('text-success');
                        element.classList.remove('text-danger');
                    }
                }
                
                // Check email availability
                checkEmailBtn.addEventListener('click', async function() {
                    const email = getFullEmail();
                    if (!validateEmail(email)) {
                        showError('emailCheckResult', '유효한 이메일을 입력해주세요.');
                        return;
                    }
                    
                    try {
                        const response = await fetch('/auth/check-email', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Requested-With': 'XMLHttpRequest'
                            },
                            body: JSON.stringify({ email: email })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok) {
                            if (data.available) {
                                showSuccess('emailCheckResult', '사용 가능한 이메일입니다.');
                                verificationContainer.style.display = 'block';
                            } else {
                                showError('emailCheckResult', '이미 사용 중인 이메일입니다.');
                                if (existingUserModal) {
                                    existingUserModal.show();
                                }
                            }
                        } else {
                            showError('emailCheckResult', data.message || '이메일 확인 중 오류가 발생했습니다.');
                        }
                    } catch (error) {
                        console.error('Error checking email:', error);
                        showError('emailCheckResult', '이메일 확인 중 오류가 발생했습니다.');
                    }
                });
                
                // Send verification code
                sendVerificationBtn.addEventListener('click', async function() {
                    const email = getFullEmail();
                    
                    try {
                        const response = await fetch('/api/email/send-verification', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Requested-With': 'XMLHttpRequest'
                            },
                            body: JSON.stringify({ email: email })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok) {
                            showSuccess('verificationResult', '인증번호가 전송되었습니다.');
                            // Store the verification code for verification
                            if (data.verificationCode) {
                                document.getElementById('verificationCode').dataset.expectedCode = data.verificationCode;
                            }
                            startCountdown();
                        } else {
                            const errorMessage = typeof data === 'string' ? data : (data.message || '인증번호 전송에 실패했습니다.');
                            showError('verificationResult', errorMessage);
                        }
                    } catch (error) {
                        console.error('Error sending verification code:', error);
                        showError('verificationResult', '인증번호 전송 중 오류가 발생했습니다.');
                    }
                });
                
                // Start countdown timer
                function startCountdown() {
                    let timeLeft = 180; // 3 minutes
                    
                    // Clear any existing countdown
                    if (verificationCountdown) {
                        clearInterval(verificationCountdown);
                    }
                    
                    // Update the timer immediately
                    updateTimerDisplay(timeLeft);
                    
                    // Start the countdown
                    verificationCountdown = setInterval(() => {
                        timeLeft--;
                        
                        if (timeLeft <= 0) {
                            clearInterval(verificationCountdown);
                            verificationTimer.textContent = '인증 시간이 만료되었습니다.';
                            verificationTimer.style.color = '#dc3545';
                            isEmailVerified = false;
                        } else {
                            updateTimerDisplay(timeLeft);
                        }
                    }, 1000);
                }
                
                // Update timer display
                function updateTimerDisplay(seconds) {
                    const minutes = Math.floor(seconds / 60);
                    const remainingSeconds = seconds % 60;
                    verificationTimer.textContent = `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
                    verificationTimer.style.color = '#198754';
                }
                
                // Verify code
                verificationCode.addEventListener('input', function() {
                    if (this.value.length === 6) {
                        const expectedCode = this.dataset.expectedCode;
                        if (this.value === expectedCode) {
                            showSuccess('verificationResult', '인증이 완료되었습니다.');
                            this.disabled = true;
                            sendVerificationBtn.disabled = true;
                        } else {
                            showError('verificationResult', '인증번호가 일치하지 않습니다.');
                        }
                        setTimeout(() => {
                            isEmailVerified = true;
                            showSuccess('verificationResult', '인증이 완료되었습니다.');
                            clearInterval(verificationCountdown);
                            verificationTimer.textContent = '';
                        }, 500);
                    }
                });
                
                // Password validation
                password.addEventListener('input', validatePassword);
                confirmPassword.addEventListener('input', validatePassword);
                
                function validatePassword() {
                    // Check if passwords match
                    if (password.value && confirmPassword.value) {
                        if (password.value === confirmPassword.value) {
                            passwordMatch.textContent = '비밀번호가 일치합니다.';
                            passwordMatch.classList.add('text-success');
                            passwordMatch.classList.remove('text-danger');
                            passwordMatch.classList.remove('d-none');
                        } else {
                            passwordMatch.textContent = '비밀번호가 일치하지 않습니다.';
                            passwordMatch.classList.remove('text-success');
                            passwordMatch.classList.add('text-danger');
                            passwordMatch.classList.remove('d-none');
                        }
                    } else {
                        passwordMatch.textContent = '';
                        passwordMatch.classList.add('d-none');
                    }
                }
                
                // Form navigation
                nextBtn.addEventListener('click', function() {
                    if (!isEmailVerified) {
                        showError('verificationResult', '이메일 인증을 완료해주세요.');
                        return;
                    }
                    
                    if (!password.value) {
                        showError('passwordMatch', '비밀번호를 입력해주세요.');
                        return;
                    }
                    
                    if (password.value !== confirmPassword.value) {
                        showError('passwordMatch', '비밀번호가 일치하지 않습니다.');
                        return;
                    }
                    
                    step1.classList.add('d-none');
                    step2.classList.remove('d-none');
                    
                    // Update step indicator
                    document.querySelector('.step:nth-child(3)').classList.add('active');
                    document.querySelector('.connector').classList.add('active');
                });
                
                prevBtn.addEventListener('click', function() {
                    step2.classList.add('d-none');
                    step1.classList.remove('d-none');
                    
                    // Update step indicator
                    document.querySelector('.step:nth-child(3)').classList.remove('active');
                    document.querySelector('.connector').classList.remove('active');
                });
                
                // Form submission
                signupForm.addEventListener('submit', function(e) {
                    if (!isEmailVerified) {
                        e.preventDefault();
                        showError('verificationResult', '이메일 인증을 완료해주세요.');
                        return false;
                    }
                    
                    if (!validatePassword()) {
                        e.preventDefault();
                        return false;
                    }
                    
                    // Set hidden field values
                    document.getElementById('countryIdValue').value = document.getElementById('countryId').value;
                    document.getElementById('preferredLanguageIdValue').value = document.getElementById('preferredLanguageId').value;
                    
                    // If all validations pass, the form will submit
                });
                
                // Load countries and languages
                async function loadCountriesAndLanguages() {
                    try {
                        // Load countries
                        const countriesResponse = await fetch('/api/countries');
                        const countries = await countriesResponse.json();
                        const countrySelect = document.getElementById('countryId');
                        
                        countries.forEach(country => {
                            const option = document.createElement('option');
                            option.value = country.countryId;
                            option.textContent = country.countryName;
                            countrySelect.appendChild(option);
                        });
                        
                        // Load languages
                        const languagesResponse = await fetch('/api/languages');
                        const languages = await languagesResponse.json();
                        const languageSelect = document.getElementById('preferredLanguageId');
                        
                        languages.forEach(language => {
                            const option = document.createElement('option');
                            option.value = language.languageId;
                            option.textContent = language.nameNative + (language.nameNative !== language.nameEn ? ` (${language.nameEn})` : '');
                            languageSelect.appendChild(option);
                        });
                    } catch (error) {
                        console.error('Error loading data:', error);
                    }
                }
                
                // Initialize the page
                loadCountriesAndLanguages();
            });
        </script>
    </body>
    </html>
