<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 성향 테스트 시작</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/question-styles.css}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white p-0">
                        <div class="header-image" style="background-image: url('/image/tomo.png');"></div>
                        <div class="header-content p-4">
                            <h3 class="h5 mb-0 text-center">여행 성향 테스트</h3>
                        </div>
                    </div>
                    <div class="card-body text-center py-5">
                        <h2 class="mb-4">여행 성향 테스트를 시작해볼까요?</h2>
                        <p class="lead mb-4">총 5개의 질문에 답하시면<br>당신의 여행 스타일을 분석해드립니다.</p>
                        <a th:href="@{/question/form}" class="btn btn-primary btn-lg px-5">
                            테스트 시작하기 <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
