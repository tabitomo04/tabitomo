<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ko">
<head th:replace="~{fragments/header :: head}">
    <title>마이페이지 - Tabitomo</title>
</head>
<body>
<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Navigation Menu -->
<div th:replace="~{fragments/menu :: menu}"></div>

<!-- Main Content -->
<main class="container py-5">
    <h1 class="mb-4">마이페이지</h1>

    <!-- Error Message Display -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <section>
        <h2 class="h3 mb-3">나의 여행 계획</h2>
        <div th:if="${trips == null or trips.isEmpty()}" class="alert alert-info" role="alert">
            저장된 여행 계획이 없습니다.
        </div>

        <div class="list-group" th:unless="${trips == null or trips.isEmpty()}">
            <!-- Iterate over the new Trip objects -->
            <a th:each="trip : ${trips}" th:href="@{/trips/{id}(id=${trip.id})}" class="list-group-item list-group-item-action flex-column align-items-start">
                <div class="d-flex w-100 justify-content-between">
                    <!-- Trip Title -->
                    <h5 class="mb-1" th:text="${trip.title}">여행 계획 이름</h5>
                    <!-- Trip Dates -->
                    <small th:if="${trip.startDate != null}" 
                           th:text="${#temporals.format(trip.startDate, 'yyyy.MM.dd')} + ' ~ ' + ${#temporals.format(trip.endDate, 'yyyy.MM.dd')}">여행 기간</small>
                </div>
                <!-- Accommodation Info -->
                <p class="mb-1">
                    <strong>숙소:</strong>
                    <span th:if="${trip.accommodation != null}" th:text="${trip.accommodation.name}">숙소 이름</span>
                    <span th:unless="${trip.accommodation != null}" class="text-muted">정보 없음</span>
                </p>
                <div class="d-flex w-100 justify-content-between">
                    <small class="text-muted">여기를 클릭하여 상세 내용을 확인하세요.</small>
                    <small class="text-muted" th:if="${trip.createdAt != null}" th:text="'생성일: ' + ${#temporals.format(trip.createdAt, 'yyyy.MM.dd')}"></small>
                </div>
            </a>
        </div>
    </section>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
