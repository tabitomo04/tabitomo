<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .password-find-box {
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            width: 500px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .password-find-box h2 {
            font-size: 28px;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .reset-button {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f0f0f0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            color: green;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

<div class="password-find-box">
    <h2>비밀번호 찾기</h2>

    <form id="passwordFindForm" onsubmit="return false;">
        <!-- 이메일 인증 -->
        <div class="mb-4">
            <div class="form-group">
                <label for="email" class="form-label">이메일 주소</label>
                <div class="input-group">
                    <input type="email" class="form-control" id="email" name="email"
                           placeholder="example@example.com" required>
                    <button class="btn btn-outline-primary" type="button" id="sendCodeBtn"
                            style="min-width: 120px;" disabled>
                        인증번호 발송
                    </button>
                </div>
                <div id="emailError" class="error-message"></div>
                <div id="emailStatus" class="form-text text-muted mt-1" style="display: none;"></div>
            </div>

            <!-- 인증번호 입력 -->
            <div class="form-group mt-3" id="codeField" style="display: none;">
                <label for="verificationCode" class="form-label">인증번호</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="verificationCode"
                           placeholder="이메일로 전송된 6자리 인증번호" maxlength="6">
                    <span class="input-group-text">
                        <span id="countdown">03:00</span>
                    </span>
                    <button class="btn btn-outline-secondary" type="button" id="verifyCodeBtn">
                        인증확인
                    </button>
                </div>
                <div id="codeError" class="error-message"></div>
                <div id="codeSuccess" class="success-message">이메일 인증 완료!</div>
            </div>
        </div>
    </form>

    <button class="reset-button" id="resetBtn">비밀번호 재설정</button>
</div>

<script>
    let verificationCode = ''; // 서버에서 받은 인증번호 저장
    let countdownInterval;

    // 이메일 입력 유효성 검사
    $('#email').on('input', function () {
        const email = $(this).val().trim();
        const $sendBtn = $('#sendCodeBtn');

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const isValid = emailRegex.test(email);

        $sendBtn.prop('disabled', !isValid);

        if (!isValid && email !== '') {
            $('#emailError').text('유효한 이메일 주소를 입력해주세요.').show();
        } else {
            $('#emailError').hide();
        }
    });

    // 인증번호 발송
    $('#sendCodeBtn').click(async function () {
        const email = $('#email').val().trim();
        if (!email) {
            $('#emailError').text('이메일을 입력해주세요.').show();
            return;
        }

        const $btn = $(this);
        $btn.prop('disabled', true).text('전송 중...');

        try {
            const response = await fetch('/api/email/send-verification', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            if (response.ok) {
                verificationCode = data.verificationCode; // 서버에서 반환된 인증번호
                $('#codeField').show();
                $('#verificationCode').focus();
                startCountdown();
                showMessage('emailStatus', '인증번호가 전송되었습니다. 이메일을 확인해주세요.', 'info');
            } else {
                throw new Error(data.message || '인증번호 전송 실패');
            }
        } catch (error) {
            $('#emailError').text(error.message).show();
        } finally {
            $btn.prop('disabled', false).text('인증번호 발송');
        }
    });

    // 인증번호 확인
    $('#verifyCodeBtn').click(function () {
        const inputCode = $('#verificationCode').val().trim();

        if (!inputCode) {
            $('#codeError').text('인증번호를 입력해주세요.').show();
            return;
        }

        if (inputCode === verificationCode) {
            clearInterval(countdownInterval);

            $('#sendCodeBtn')
                .prop('disabled', true)
                .text('인증 완료')
                .removeClass('btn-outline-primary')
                .addClass('btn-success');

            $('#codeError').hide();
            $('#codeSuccess').show();

            $('<input>').attr({
                type: 'hidden',
                id: 'emailVerified',
                name: 'emailVerified',
                value: 'true'
            }).appendTo('#passwordFindForm');
        } else {
            $('#codeError').text('인증번호가 일치하지 않습니다.').show();
        }
    });

    // 비밀번호 재설정 버튼
    $('#resetBtn').click(function () {
        if ($('#emailVerified').val() !== 'true') {
            alert('이메일 인증을 먼저 완료해주세요.');
            return;
        }
        // 실제 비밀번호 재설정 페이지로 이동
        window.location.href = '/reset-password';
    });

    // 메시지 표시
    function showMessage(elementId, message, type) {
        const $element = $(`#${elementId}`);
        $element.text(message)
            .removeClass('text-danger text-success text-info')
            .addClass(`text-${type}`)
            .show();
    }

    // 타이머 시작
    function startCountdown() {
        let timeLeft = 180;

        if (countdownInterval) {
            clearInterval(countdownInterval);
        }

        updateCountdown(timeLeft);

        countdownInterval = setInterval(() => {
            timeLeft--;
            updateCountdown(timeLeft);

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                $('#codeError').text('인증 시간이 만료되었습니다. 다시 시도해주세요.').show();
                $('#verificationCode').prop('disabled', true);
                $('#verifyCodeBtn').prop('disabled', true);
            }
        }, 1000);
    }

    function updateCountdown(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = seconds % 60;
        $('#countdown').text(`${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`);
    }
</script>

</body>
</html>
