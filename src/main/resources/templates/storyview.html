<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title>스토리북 개별 페이지</title>


  <!-- Common CSS/JS from header fragment -->
  <link rel="icon" th:href="@{/image/pabicone.png}" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/translation.js}"></script>

  <!-- Page-specific CSS from storylist.html -->
  <link rel="stylesheet"th:href="@{/css/storyview.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/modal.css}">

  <script th:src="@{/js/jquery-3.7.1.min.js}"></script>

  <script>
    // 유튜브 출력 코드
    $(document).ready(function() {
        document.querySelectorAll('oembed[url]').forEach(element => {
            var url = element.getAttribute('url');
            var regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#\&\?]*).*/;
            var matchs = url.match(regExp);
            if(matchs && matchs[7]){
                element.parentElement.outerHTML = `
                <div style="position: relative; height: 0; padding-bottom: 56.25%;">
                    <iframe src="https://www.youtube.com/embed/${matchs[7]}?rel=0"
                            style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;"
                            frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
                    </iframe>
                </div>`;
            }
        });
    });

    // 메뉴 클릭 시 토글메뉴 열고 닫기
    function toggleDropdown(el) {
    const menu = el.nextElementSibling;
    if (menu.style.display === 'block') {
        menu.style.display = 'none';
    } else {
        // 다른 열려 있는 메뉴 닫기
        //document.querySelectorAll('.dropdown-content').forEach(m => m.style.display = 'none');
        menu.style.display = 'block';
    }
}

// 다른 부분 클릭 시 토글메뉴 닫기
document.addEventListener('click', function(e) {
    if (!e.target.closest('.more-btn')) {
        document.querySelectorAll('.dropdown-content').forEach(m => m.style.display = 'none');
    }
});
  </script>
</head>
<body>

<!-- Header -->
<div th:insert="~{fragments/header :: header}"></div>

<div class="story-container">
  <!-- 태그 -->
  <div class="tags">
    <span th:each="tagName : ${post.tags}" th:text="'#' + ${tagName}" data-translatable></span>
  </div>

  <!-- 제목 & 부제목 -->

  <div class="story-header">
    <span class="title" th:text="${post.title}" data-translatable></span>

    <div class="dropdown" th:if="${isAuthor}">
      <a class="more-btn" onclick="toggleDropdown(this)">⋮</a>
      <div class="dropdown-content">
        <a th:href="@{'/storybook/update?booknum=' + ${post.booknum}}" data-translatable>수정</a>
        <a th:href="@{'/storybook/delete?booknum=' + ${post.booknum}}"
           onclick="return confirm('정말 삭제하시겠습니까?');" data-translatable>삭제</a>
      </div>
    </div>


  </div>
  <div th:text="${post.subtitle}" class="subtitle" data-translatable></div>

  <!-- 메타 정보 -->
  <div class="meta">
    <div>
      <span th:text="${post.nickname}"></span> · <span th:text="${#temporals.format(post.createDate, 'yy.MM.dd')}"></span>
    </div>
    <div class="actions">
      <button class="urlbtn" data-tooltip="복사되었습니다!" onclick="clip()" data-translatable>URL 공유</button>
      <!-- 로그인 상태에 따라 좋아요 버튼 표시 -->
      <div th:if="${#authentication?.isAuthenticated()}">
        <button class="likeBtn" onclick="toggleLike()"><span th:style="'font-family: Arial, sans-serif;'">❤   </span><span class="like-count" th:text="${post.likes}"></span></button>
      </div>
      <div th:unless="${#authentication?.isAuthenticated()}" class="like-login-prompt">
        <button class="likeBtn" onclick="toggleLike()"><span th:style="'font-family: Arial, sans-serif;'">❤   </span><span class="like-count" th:text="${post.likes}"></span></button>
      </div>
    </div>
  </div>
  <hr class="line">
  <!-- 본문 -->
  <div>
    <div th:utext="${post.content}" class="content-block" id="postContent">
    </div>
  </div>
</div>
<!-- 로그인 상태 확인을 위한 hidden input -->
<input type="hidden" id="isAuthenticated" th:value="${isAuthenticated}">
<input type="hidden" id="booknum" th:value="${post.booknum}"}>

<script>
  let liked = false;
  
  // 로그인 프롬프트 표시
  function showLoginPrompt() {
    if (confirm('로그인이 필요한 서비스입니다. 로그인 페이지로 이동하시겠습니까?')) {
      // 현재 페이지 URL을 저장한 후 로그인 페이지로 리다이렉트
      const currentUrl = window.location.href;
      window.location.href = '/auth/login?redirect=' + encodeURIComponent(currentUrl);
    }
  }
  
  // 로그인 상태 확인
  function checkLogin() {
    return document.getElementById('isAuthenticated').value === 'true';
  }

// 좋아요 버튼 클릭 시
function toggleLike() {
    // 로그인 상태 확인
    if (!checkLogin()) {
        showLoginPrompt();
        return;
    }
    
    const booknum = $("#booknum").val();
    const btn = $(".likeBtn");

    const token = $("meta[name='_csrf']").attr("content");
    const header = $("meta[name='_csrf_header']").attr("content");


    $.ajax({
        url: liked ? "/unlike" : "/like",
        method: "POST",
        data: { booknum },
          beforeSend: function(xhr) {
            xhr.setRequestHeader(header, token);
         },
        success: function(res) {
            // 서버가 반환한 좋아요 수로 화면 업데이트
            $(".like-count").text(res.likes);

            // 서버가 알려준 현재 좋아요 상태를 반영
            liked = res.liked;

            // 버튼 색을 liked 상태에 따라 변경
            btn.css("color", liked ? "red" : "black");
        },
        error: function(err) {
            console.error("좋아요 요청 실패:", err);
        }
    });
}

// 페이지 로드 시 현재 사용자가 이미 좋아요 눌렀는지 확인
$(document).ready(function() {
    // 로그인한 사용자에 대해서만 좋아요 상태 확인
    if (!checkLogin()) {
        return;
    }
    
    const booknum = $("#booknum").val();

    $.ajax({
        url: "/isLiked", // 서버에서 좋아요 상태 확인
        method: "GET",
        data: { booknum },
        success: function(res) {
            // 서버가 알려준 liked 상태 반영
            liked = res.liked;

            // 버튼 색 초기화
            $(".likeBtn").css("color", liked ? "red" : "black");
        },
        error: function(err) {
            console.error("좋아요 상태 확인 실패:", err);
        }
    });
});
</script>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>


</body>
</html>
