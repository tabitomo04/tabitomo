<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
    }
    .container {
        background: white;
        padding: 30px;
        border-radius: 20px;
        width: 400px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
        text-align: center;
        margin-bottom: 20px;
    }
    .form-group {
        margin-bottom: 15px;
    }
    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }
    input, select, button {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #ccc;
    }
    .inline-group {
        display: flex;
        gap: 8px;
    }
    .gender-option {
        flex: 1;
        text-align: center;
        padding: 10px;
        border: 1px solid #aaa;
        border-radius: 10px;
        cursor: pointer;
        background: #eee;
    }
    .gender-option.selected {
        background: #4CAF50;
        color: white;
        font-weight: bold;
    }
    .btn-submit {
        background: #007BFF;
        color: white;
        font-weight: bold;
        border: none;
        cursor: pointer;
    }
    .btn-submit:hover {
        background: #0056b3;
    }
    #nicknameMessage {
        display: block;
        margin-top: 5px;
        font-size: 0.9em;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>회원가입</h2>
  <form th:action="@{/signup}" th:object="${memberDTO}" method="post" onsubmit="return handleSubmit()">

    <!-- 이메일 -->
    <div class="form-group">
      <label>이메일</label>
      <div class="inline-group">
        <input type="text" id="emailId" placeholder="아이디" required>
        <span>@</span>
        <input type="text" id="emailDomain" placeholder="도메인" required>
        <button type="button">인증하기</button>
      </div>
    </div>
    <input type="hidden" name="email" id="hiddenEmail">

    <!-- 비밀번호 -->
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" name="password" required>
    </div>

    <div class="form-group">
      <label>비밀번호 확인</label>
      <input type="password" required>
    </div>

    <!-- 닉네임 -->
    <div class="form-group">
      <label>닉네임</label>
      <div class="inline-group">
        <input type="text" name="nickname" id="nickname" required>
        <button type="button" onclick="checkNickname()">중복확인</button>
      </div>
      <span id="nicknameMessage"></span>
    </div>

    <!-- 성별 -->
    <div class="form-group">
      <label>성별</label>
      <div class="inline-group">
        <div class="gender-option" onclick="selectGender(this, '남')">남</div>
        <div class="gender-option" onclick="selectGender(this, '여')">여</div>
        <div class="gender-option" onclick="selectGender(this, '기타')">기타</div>
      </div>
      <input type="hidden" name="gender" id="gender">
    </div>

    <!-- 국적 -->
    <div class="form-group">
      <label>국적</label>
      <select name="country_id">
        <option value="1">한국</option>
        <option value="2">일본</option>
        <option value="3">미국</option>
        <option value="4">기타</option>
      </select>
    </div>

    <!-- 출생년도 -->
    <div class="form-group">
      <label>출생년도</label>
      <select name="age">
        <option th:each="year : ${#numbers.sequence(1950, 2025)}"
                th:value="${year}" th:text="${year}"></option>
      </select>
    </div>

    <div class="form-group">
      <button type="submit" class="btn-submit">회원가입 완료</button>
    </div>
  </form>
</div>

<script>
  // 성별 선택
  function selectGender(el, value) {
      document.querySelectorAll(".gender-option").forEach(opt => opt.classList.remove("selected"));
      el.classList.add("selected");
      document.getElementById("gender").value = value;
  }

  // 닉네임 중복 확인 상태
  let isNicknameChecked = false;

  // 닉네임 input 이벤트
  document.getElementById('nickname').addEventListener('input', () => {
      isNicknameChecked = false;
      document.getElementById('nicknameMessage').textContent = '';
  });

  // 닉네임 중복 확인
  function checkNickname() {
      const nicknameInput = document.getElementById('nickname');
      const nickname = nicknameInput.value.trim();
      const nicknameMessage = document.getElementById('nicknameMessage');

      if (nickname === '') {
          nicknameMessage.textContent = '닉네임을 입력해주세요.';
          nicknameMessage.style.color = 'red';
          return;
      }

      fetch(`/checkNickname?nickname=${encodeURIComponent(nickname)}`)
          .then(response => response.json())
          .then(data => {
              if (data.isDuplicate) {
                  nicknameMessage.textContent = '이미 사용 중인 닉네임입니다.';
                  nicknameMessage.style.color = 'red';
                  isNicknameChecked = false;
              } else {
                  nicknameMessage.textContent = '사용 가능한 닉네임입니다.';
                  nicknameMessage.style.color = 'green';
                  isNicknameChecked = true;
              }
          })
          .catch(error => {
              console.error('Error:', error);
              nicknameMessage.textContent = '오류가 발생했습니다. 다시 시도해주세요.';
              nicknameMessage.style.color = 'red';
              isNicknameChecked = false;
          });
  }

  // 폼 제출
  function handleSubmit() {
      const emailId = document.getElementById('emailId').value;
      const emailDomain = document.getElementById('emailDomain').value;
      const hiddenEmailInput = document.getElementById('hiddenEmail');

      if (!emailId || !emailDomain) {
          alert('이메일 주소를 모두 입력해주세요.');
          return false;
      }

      hiddenEmailInput.value = `${emailId}@${emailDomain}`;

      if (!isNicknameChecked) {
          alert('닉네임 중복 확인을 완료해주세요.');
          document.getElementById('nickname').focus();
          return false;
      }

      return true;
  }
</script>
</body>
</html>
