<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <!-- Font Awesome CDN을 최상단에 배치하여 아이콘 로딩 보장 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <head th:replace="~{fragments/header :: head}"></head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 취향 설문</title>
    <!-- Bootstarp JS, Axios JS (for form submission) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- CSS and Font Awesome for icons -->
    <link href="https://cdn.jsdelivr.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 사용자 정의 색상 변수 설정 */
        :root {
            --color-urban-blue: #5D6C7E;
            --color-terracotta: #E88326;
            --color-dark-navy: #293341;
            --color-light-gray: #F2F4F7;
            --color-active-blue: #3A98FF;
            --color-unselected-border: #DDDDDD;
            --color-unselected-text: #333333;
        }

        /* 1. 진행 막대 색상 */
        .bg-custom-blue {
             background-color: var(--color-active-blue) !important;
        }

        /* 전체 배경색 */
        .bg-light {
            background-color: var(--color-light-gray) !important;
        }

        .question-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 2.5rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0.5rem 1rem rgba(41, 51, 65, 0.1);
        }

        .question-section {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
            border: none;
            transition: border 0.3s ease;
        }

        .question-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------------------------------------------------- */
        /* 1. 공통: 유연한 옵션 레이아웃 (1, 3, 4, 5번 질문) */
        /* ---------------------------------------------------- */
        /* 1, 3, 4, 5번 질문은 Bootstrap의 Flexbox를 사용하여 유연하게 배치 */
        .flexible-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 12px; /* 항목 간 간격 설정 */
            justify-content: center; /* 중앙 정렬 */
            padding: 0 5px;
            margin: 0 auto;
        }

        /* ---------------------------------------------------- */
        /* 2. 공통: 옵션 라벨 (기본 스타일 - 유연한 크기) */
        /* ---------------------------------------------------- */
        .option-label {
            /* MBTI를 제외한 모든 항목의 기본 스타일: 텍스트 길이에 따라 너비가 결정됨 */
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 45px; /* 최소 높이만 지정하여 너무 작아지지 않게 함 */
            padding: 0.6rem 1rem; /* 좌우 패딩으로 너비 결정 */

            background-color: white;
            border: 2px solid var(--color-unselected-border);
            border-radius: 8px;
            color: var(--color-unselected-text) !important;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            text-align: center;
            line-height: 1.2;
            box-shadow: none;
            white-space: normal;
        }

        /* 체크박스/라디오 숨김 */
        .form-check-input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* 옵션 라벨 호버 효과 */
        .option-label:hover {
            background-color: var(--color-light-gray);
            border-color: #A9A9A9;
            transform: none;
            box-shadow: none;
        }

        /* 체크/선택된 상태 */
        .form-check-input:checked + .option-label,
        input[type="checkbox"]:checked + .option-label,
        input[type="radio"]:checked + .option-label {
            background-color: white !important;
            border-color: var(--color-terracotta) !important;
            color: var(--color-terracotta) !important;
            font-weight: 600;
            box-shadow: 0 0 0 2px rgba(232, 131, 38, 0.2);
        }

        /* 포커스 상태 */
        .form-check-input:focus-visible + .option-label {
            outline: 3px solid var(--color-terracotta);
            outline-offset: 2px;
        }

        /* ------------------------------------------- */
        /* 3. MBTI 섹션 스타일 (2번 질문: 고정 크기 그리드) */
        /* ------------------------------------------- */
        #mbti-section {
            max-width: 600px;
            margin: 0 auto;
        }

        /* MBTI 16개 항목 그리드 (4x4) */
        #mbti-grid-16 {
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            display: grid;
        }

        /* MBTI 나머지 항목 컨테이너 (Auto-generated 2개) */
        #mbti-grid-rest {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        /* MBTI 나머지 2개 항목의 크기 */
        #mbti-grid-rest .form-check {
            flex-basis: calc((100% - 30px) / 2); /* 4x4 그리드의 2칸 너비 - 10px 간격 */
            max-width: calc((100% - 30px) / 2);
        }

        /* MBTI 라벨 (고정 크기 적용) */
        #mbti-section .option-label {
            font-size: 1.1rem;
            font-weight: 700;
            /* MBTI 버튼만 강제로 일정한 크기를 갖도록 지정 */
            min-height: 55px;
            height: 100%;
            width: 100%;
            padding: 0.6rem 0.5rem; /* 고정 크기에 맞게 패딩 조정 */
        }

        /* 기타 스타일 유지 */
        .progress-bar { transition: width 0.3s ease; }
        .question-title { color: var(--color-dark-navy); margin-bottom: 1.5rem; font-weight: 700; border-left: 4px solid var(--color-terracotta); padding-left: 15px; }
        #next-btn, #submit-btn { background-color: var(--color-terracotta) !important; border-color: var(--color-terracotta) !important; color: white !important; }
        #next-btn:hover, #submit-btn:hover { background-color: #c97121 !important; border-color: #c97121 !important; }
        #prev-btn { color: var(--color-urban-blue); border-color: var(--color-urban-blue); }
        .text-muted, h5 { color: var(--color-urban-blue) !important; }
        .text-muted a { color: var(--color-urban-blue) !important; text-decoration: none; }
        h2 { color: var(--color-dark-navy); font-weight: 700; }
        .spinner-border { color: var(--color-terracotta) !important; }
    </style>
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-none justify-content-center align-items-center" style="z-index: 9999;">
    <div class="text-center bg-white p-4 rounded-3 shadow">
        <div class="spinner-border mb-3" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <h5>제출 중입니다...</h5>
        <p class="text-muted mb-0">잠시만 기다려주세요.</p>
    </div>
</div>

<div class="container">
    <form id="questionForm" th:action="@{/api/question/submit}" method="post" class="question-container">
        <!-- CSRF Token -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Member ID (주석 처리 또는 실제 데이터 바인딩 필요) -->
        <!-- <input type="hidden" name="memberId" th:value="${memberId}" /> -->

        <div class="text-center mb-5">
            <h2>여행 취향 설문 조사</h2>
            <p class="text-muted">당신의 여행 스타일을 알려주시면 더 나은 추천을 드릴 수 있어요!</p>

            <div class="progress-container">
                <div class="progress-text">
                    <span>진행률</span>
                    <span id="progress-text">1/5</span>
                </div>
                <div class="progress">
                    <div id="progress-bar" class="progress-bar bg-custom-blue progress-bar-striped progress-bar-animated"
                         role="progressbar" style="width: 20%" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
        </div>

        <!-- 1. 취미/관심사 (다중 선택) - 유연한 레이아웃 적용 -->
        <div class="question-section active" id="hobbies-section">
            <h4 class="question-title">1. 어떤 활동에 관심이 있으신가요? (다중 선택 가능)</h4>
            <div class="flexible-layout">
                <div th:each="hobby : ${questionsByCategory.get(1)}" class="form-check">
                    <input type="checkbox" name="hobbies" th:value="${hobby.infoLowNum}" class="form-check-input" th:id="'hobby-' + ${hobby.infoLowNum}">
                    <label th:for="${'hobby-' + hobby.infoLowNum}" class="option-label">
                        <!-- 아이콘이 없을 경우 fa-circle-question(물음표) 아이콘을 기본값으로 사용 -->
                        <i class="fas me-1"
                           th:classappend="${hobby.content != null and hobby.content != ''} ? ('fa-' + ${hobby.content}) : 'fa-circle-question'"></i>
                        <span th:text="${hobby.infoName}"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 2. MBTI (단일 선택) - 고정 크기 4x4 그리드 & 나머지 2개 분리 정렬 (유지) -->
        <div class="question-section" id="mbti-section">
            <h4 class="question-title">2. 당신의 MBTI는 무엇인가요? (선택사항)</h4>

            <!-- MBTI 16개 항목 (혹은 16개보다 적은 항목) -->
            <div id="mbti-grid-16">
                <div th:each="mbti, iterStat : ${questionsByCategory.get(2)}"
                     th:if="${iterStat.count <= 16}"
                     class="form-check">
                    <input type="radio" name="mbti" th:value="${mbti.infoLowNum}" class="form-check-input" th:id="'mbti-' + ${mbti.infoLowNum}">
                    <label th:for="${'mbti-' + mbti.infoLowNum}" class="option-label">
                        <span th:text="${mbti.infoName}"></span>
                    </label>
                </div>
            </div>

            <!-- 나머지 항목 (Auto-generated 등)을 위한 중앙 정렬된 컨테이너 -->
            <div id="mbti-grid-rest" th:if="${questionsByCategory.get(2).size() > 16}">
                <div th:each="mbti, iterStat : ${questionsByCategory.get(2)}"
                     th:if="${iterStat.count > 16}"
                     class="form-check">
                    <input type="radio" name="mbti" th:value="${mbti.infoLowNum}" class="form-check-input" th:id="'mbti-' + ${mbti.infoLowNum}">
                    <label th:for="${'mbti-' + mbti.infoLowNum}" class="option-label">
                        <span th:text="${mbti.infoName}"></span>
                    </label>
                </div>
            </div>

        </div>

        <!-- 3. 여행 스타일 (다중 선택) - 유연한 레이아웃 적용 -->
        <div class="question-section" id="travel-style-section">
            <h4 class="question-title">3. 선호하는 여행 스타일은 무엇인가요? (다중 선택 가능)</h4>
            <div class="flexible-layout">
                <div th:each="style : ${questionsByCategory.get(3)}" class="form-check">
                    <input type="checkbox" name="travelStyles" th:value="${style.infoLowNum}" class="form-check-input" th:id="'style-' + ${style.infoLowNum}">
                    <label th:for="${'style-' + style.infoLowNum}" class="option-label">
                        <!-- 아이콘이 없을 경우 fa-circle-question(물음표) 아이콘을 기본값으로 사용 -->
                        <i class="fas me-1"
                           th:classappend="${style.content != null and style.content != ''} ? ('fa-' + ${style.content}) : 'fa-circle-question'"></i>
                        <span th:text="${style.infoName}"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 4. 동반자 (다중 선택) - 유연한 레이아웃 적용 -->
        <div class="question-section" id="companions-section">
            <h4 class="question-title">4. 주로 누구와 여행을 가시나요? (다중 선택 가능)</h4>
            <div class="flexible-layout">
                <div th:each="companion : ${questionsByCategory.get(4)}" class="form-check">
                    <input type="checkbox" name="companions" th:value="${companion.infoLowNum}" class="form-check-input" th:id="'companion-' + ${companion.infoLowNum}">
                    <label th:for="${'companion-' + companion.infoLowNum}" class="option-label">
                        <!-- 아이콘이 없을 경우 fa-circle-question(물음표) 아이콘을 기본값으로 사용 -->
                        <i class="fas me-1"
                           th:classappend="${companion.content != null and companion.content != ''} ? ('fa-' + ${companion.content}) : 'fa-circle-question'"></i>
                        <span th:text="${companion.infoName}"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 5. 음식 선호도 (다중 선택) - 유연한 레이아웃 적용 -->
        <div class="question-section" id="food-section">
            <h4 class="question-title">5. 선호하는 음식은 무엇인가요? (다중 선택 가능)</h4>
            <div class="flexible-layout">
                <div th:each="food : ${questionsByCategory.get(5)}" class="form-check">
                    <input type="checkbox" name="foodPreferences" th:value="${food.infoLowNum}" class="form-check-input" th:id="'food-' + ${food.infoLowNum}">
                    <label th:for="${'food-' + food.infoLowNum}" class="option-label">
                        <!-- 아이콘이 없을 경우 fa-circle-question(물음표) 아이콘을 기본값으로 사용 -->
                        <i class="fas me-1"
                           th:classappend="${food.content != null and food.content != ''} ? ('fa-' + ${food.content}) : 'fa-circle-question'"></i>
                        <span th:text="${food.infoName}"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 네비게이션 버튼 -->
        <div class="d-flex justify-content-between align-items-center mt-5">
            <div>
                <button type="button" id="prev-btn" class="btn btn-outline-secondary" style="display: none; min-width: 100px;">
                    <i class="fas fa-arrow-left me-2"></i>이전
                </button>
            </div>
            <div class="d-flex gap-2">
                <button type="button" id="next-btn" class="btn btn-primary" style="min-width: 100px;">
                    다음 <i class="fas fa-arrow-right ms-2"></i>
                </button>
                <button type="submit" id="submit-btn" class="btn btn-success" style="display: none; min-width: 120px;">
                    제출하기 <i class="fas fa-paper-plane ms-2"></i>
                </button>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/question/start" class="text-muted">
                <i class="fas fa-arrow-left me-1"></i> 이전 화면으로 돌아가기
            </a>
        </div>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    // --- 통합 자바스크립트 로직 (Pagination, Validation, AJAX Submission) ---
    // 유틸리티 함수: 지수 백오프를 이용한 fetch 래퍼 (기존 코드 유지)
    async function fetchWithRetry(url, options, retries = 3) {
        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch(url, options);
                if (response.status === 429) { // Too Many Requests
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    console.warn(`Rate limit hit. Retrying in ${delay / 1000}s...`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    continue;
                }
                return response;
            } catch (error) {
                if (i === retries - 1) throw error;
                const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                console.warn(`Network error. Retrying in ${delay / 1000}s...`);
                await new Promise(resolve => setTimeout(resolve, delay));
            }
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        // 1. DOM 요소 및 상태 초기화
        const loadingOverlay = document.getElementById('loadingOverlay');
        const form = document.getElementById('questionForm');
        const sections = document.querySelectorAll('.question-section');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        let currentSection = 0;

        // 초기 로딩 오버레이 숨김
        if (loadingOverlay) {
            loadingOverlay.classList.remove('d-flex');
            loadingOverlay.style.display = 'none';
        }

        // 뒤로가기 방지 (UX 개선)
        if (window.history && window.history.pushState) {
            window.history.pushState('forward', null, '');
            window.onpopstate = function() {
                window.history.pushState('forward', null, '');
            };
        }

        // 2. 유효성 검사 (MBTI 제외)
        function validateCurrentSection() {
            const sectionEl = sections[currentSection];

            // MBTI 섹션 (ID: mbti-section)은 선택사항이므로 항상 통과
            if (sectionEl.id === 'mbti-section') {
                sectionEl.style.border = 'none';
                return true;
            }

            const checkedInputs = sectionEl.querySelectorAll('input[type="checkbox"]:checked, input[type="radio"]:checked');
            const isValid = checkedInputs.length > 0;

            // 유효성 검사 실패 시 시각적 피드백 제공 (테두리 깜빡임)
            if (!isValid) {
                sectionEl.style.border = '2px dashed var(--color-terracotta)';
                setTimeout(() => {
                    sectionEl.style.border = 'none';
                }, 1000);
            } else {
                 sectionEl.style.border = 'none';
            }

            return isValid;
        }

        // 3. 페이지네이션 및 진행률 업데이트
        function updateButtons() {
            prevBtn.style.display = currentSection === 0 ? 'none' : 'inline-block';
            if (currentSection === sections.length - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'inline-block';
            } else {
                nextBtn.style.display = 'inline-block';
                submitBtn.style.display = 'none';
            }
        }

        function updateProgress() {
            const progress = ((currentSection + 1) / sections.length) * 100;
            progressBar.style.width = `${progress}%`;
            progressBar.setAttribute('aria-valuenow', progress);
            progressText.textContent = `${currentSection + 1}/${sections.length}`;
            document.title = `여행 취향 설문 (${currentSection + 1}/${sections.length})`;
        }

        function goToSection(index) {
            if (index < 0 || index >= sections.length) return;
            sections[currentSection].classList.remove('active');

            currentSection = index;
            sections[currentSection].classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            updateButtons();
            updateProgress();
        }

        function initSections() {
            sections.forEach((section, index) => {
                if (index === 0) {
                    section.classList.add('active');
                } else {
                    section.classList.remove('active');
                }
            });
            updateButtons();
            updateProgress();
        }

        // 4. 이벤트 리스너: 페이지네이션
        prevBtn.addEventListener('click', function() {
            if (currentSection > 0) {
                goToSection(currentSection - 1);
            }
        });

        nextBtn.addEventListener('click', function() {
            // 유효성 검사 통과 시에만 다음 페이지로 이동
            if (validateCurrentSection()) {
                if (currentSection < sections.length - 1) {
                    goToSection(currentSection + 1);
                }
            } else {
                // NOTE: 실제 서비스에서는 alert() 대신 커스텀 모달 UI를 사용해야 합니다.
                // alert('항목을 선택해야 다음으로 이동할 수 있습니다.');
            }
        });

        // 5. 이벤트 리스너: 옵션 라벨 클릭 (가장 중요)
        document.addEventListener('click', function(e) {
            let label = e.target.closest('.option-label');
            if (!label) return;

            // 기본 동작(폼 제출 등) 방지
            e.preventDefault();
            e.stopPropagation();

            const inputId = label.getAttribute('for');
            if (!inputId) return;

            const input = document.getElementById(inputId);
            if (!input) return;

            if (input.type === 'checkbox') {
                // 체크박스는 상태 토글
                input.checked = !input.checked;
            } else if (input.type === 'radio') {
                // 라디오는 무조건 체크 (단일 선택)
                input.checked = true;
            }

            // CSS가 checked 상태를 감지하도록 change 이벤트 발생
            const event = new Event('change', { bubbles: true });
            input.dispatchEvent(event);
        });

        // 6. 이벤트 리스너: AJAX 폼 제출
        if (form) {
            // 폼 제출 이벤트 리스너 추가
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                // 1. 최종 유효성 검사 (제출 전 모든 페이지 검사)
                let allRequiredAnswered = true;

                // 마지막 페이지의 유효성 검사
                if (!validateCurrentSection()) {
                     allRequiredAnswered = false;
                }

                if (!allRequiredAnswered) {
                    // 유효성 실패 시 해당 섹션으로 이동하도록 로직 추가 가능
                    // alert('필수 질문에 답변해주세요.');
                    return;
                }

                // 2. 로딩 오버레이 표시
                if (loadingOverlay) {
                    loadingOverlay.style.display = 'flex';
                    loadingOverlay.classList.add('d-flex');
                    submitBtn.disabled = true; // 중복 제출 방지
                }

                // 3. 데이터 준비
                const formData = new FormData(form);
                const formDataObj = {
                    hobbies: formData.getAll('hobbies').map(Number).filter(Boolean),
                    mbti: formData.get('mbti') || null,
                    travelStyles: formData.getAll('travelStyles').map(Number).filter(Boolean),
                    companions: formData.getAll('companions').map(Number).filter(Boolean),
                    foodPreferences: formData.getAll('foodPreferences').map(Number).filter(Boolean)
                };

                const csrfToken = document.querySelector('input[name="_csrf"]').value;

                // 4. AJAX 요청 (fetchWithRetry API 사용)
                try {
                    const response = await fetchWithRetry('/api/question/submit', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest',
                            'X-CSRF-TOKEN': csrfToken
                        },
                        body: JSON.stringify(formDataObj)
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        // 유효성 검사 오류나 기타 서버 오류 처리
                        if (data.fieldErrors) {
                            const errorMessages = Object.entries(data.fieldErrors)
                                .map(([field, message]) => `${field}: ${message}`)
                                .join('\n');
                            throw new Error(`유효성 검사 오류:\n${errorMessages}`);
                        }
                        throw new Error(data.message || '서버 오류가 발생했습니다.');
                    }

                    // 5. 성공 시 리다이렉트
                    localStorage.setItem('questionnaireCompleted', 'true');
                    window.location.href = '/question/complete';

                } catch (error) {
                    console.error('Submission Error:', error);
                    // alert(error.message || '요청 처리 중 오류가 발생했습니다.'); // Use custom modal in production
                } finally {
                    // 6. 로딩 오버레이 및 버튼 상태 복구
                    if (loadingOverlay) {
                        loadingOverlay.style.display = 'none';
                        submitBtn.disabled = false;
                    }
                }
            });
        }

        // 7. 초기화 실행
        initSections();

        // 8. 전역 오류 처리 (혹시 모를 상황 대비)
        window.addEventListener('error', function() {
            if (loadingOverlay) {
                loadingOverlay.style.display = 'none';
            }
        });
        window.addEventListener('beforeunload', function() {
            if (loadingOverlay) {
                loadingOverlay.style.display = 'none';
            }
        });
    });
</script>
</body>
</html>
