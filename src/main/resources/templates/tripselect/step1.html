<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/header :: head}"></th:block>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- Preload flatpickr locales to prevent race conditions -->
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ja.js"></script>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5">
    <div class="progress mb-4">
        <div class="progress-bar" role="progressbar" style="width: 25%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">25%</div>
    </div>

    <h2 class="mb-4" data-translatable>어디로 떠나시나요?</h2>

    <form id="tripForm" action="/trip/step2" method="post" th:object="${tripForm}">
        <div class="mb-3">
            <label for="destination" class="form-label" data-translatable>여행지</label>
            <select class="form-select" id="destination" name="destination" required>
                <option value="" data-translatable>여행지를 선택해주세요</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="accommodationBudget" class="form-label" data-translatable>숙소 예산(1박 기준)</label>
            <select class="form-select" id="accommodationBudget" name="accommodationBudget" required>
                <option value="" data-translatable>예산을 선택해주세요</option>
                <option value="50000" data-translatable>5만원 이하</option>
                <option value="100000" data-translatable>5~10만원</option>
                <option value="150000" data-translatable>10~15만원</option>
                <option value="200000" data-translatable>15~20만원</option>
                <option value="200001" data-translatable>20만원 이상</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" data-translatable>원하는 부대시설을 선택하세요</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="facilities" value="조식" id="facilityBreakfast">
                <label class="form-check-label" for="facilityBreakfast" data-translatable>조식</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="facilities" value="수영장" id="facilityPool">
                <label class="form-check-label" for="facilityPool" data-translatable>수영장</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="facilities" value="주차" id="facilityParking">
                <label class="form-check-label" for="facilityParking" data-translatable>주차</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="facilities" value="와이파이" id="facilityWifi">
                <label class="form-check-label" for="facilityWifi" data-translatable>와이파이</label>
            </div>
            <!-- 필요시 추가 부대시설 옵션 -->
        </div>

        <div class="mb-3">
            <label for="startDate" class="form-label" data-translatable>출발일</label>
            <input type="text" class="form-control" id="startDate" name="startDate" required placeholder="날짜를 선택하세요..." data-translatable-placeholder>
        </div>
        <div class="mb-3">
            <label for="nights" class="form-label" data-translatable>몇 박 여행인가요?</label>
            <select class="form-select" id="nights" name="nights" required>
                <option value="" data-translatable>박 수를 선택해주세요</option>
                <option value="1" data-translatable>1박 2일</option>
                <option value="2" data-translatable>2박 3일</option>
                <option value="3" data-translatable>3박 4일</option>
                <option value="4" data-translatable>4박 5일</option>
                <option value="5" data-translatable>5박 6일</option>
            </select>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/}" class="btn btn-secondary" data-translatable>이전</a>
            <button type="submit" class="btn btn-primary" data-translatable>다음</button>
        </div>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const destinations = [
            {"value": "서울특별시", "name": "서울특별시"},
            {"value": "부산광역시", "name": "부산광역시"},
            {"value": "대구광역시", "name": "대구광역시"},
            {"value": "인천광역시", "name": "인천광역시"},
            {"value": "광주광역시", "name": "광주광역시"},
            {"value": "대전광역시", "name": "대전광역시"},
            {"value": "울산광역시", "name": "울산광역시"},
            {"value": "세종특별자치시", "name": "세종특별자치시"},
            {"value": "경기도", "name": "경기도"},
            {"value": "강원특별자치도", "name": "강원특별자치도"},
            {"value": "충청북도", "name": "충청북도"},
            {"value": "충청남도", "name": "충청남도"},
            {"value": "전북특별자치도", "name": "전북특별자치도"},
            {"value": "전라남도", "name": "전라남도"},
            {"value": "경상북도", "name": "경상북도"},
            {"value": "경상남도", "name": "경상남도"},
            {"value": "제주특별자치도", "name": "제주특별자치도"}
        ];

        const destinationSelect = document.getElementById('destination');
        destinations.forEach(dest => {
            const option = document.createElement('option');
            option.value = dest.value;
            option.textContent = dest.name;
            option.setAttribute('data-translatable', '');
            destinationSelect.appendChild(option);
        });

        let calendarInstance = null;

        function initializeCalendar(lang) {
            if (calendarInstance) {
                calendarInstance.destroy();
            }

            let localeKey = lang || (window.translationManager ? window.translationManager.currentLanguage : 'ko');
            if (localeKey === 'jp') localeKey = 'ja';

            const localeObject = flatpickr.l10ns[localeKey] || flatpickr.l10ns.default;

            calendarInstance = flatpickr("#startDate", {
                locale: localeObject,
                minDate: "today",
                dateFormat: "Y-m-d",
            });
        }

        // Initialize the calendar on initial page load.
        initializeCalendar();

        // Re-initialize calendar on subsequent language changes.
        document.addEventListener('languageChanged', (e) => {
            initializeCalendar(e.detail.lang);
        });
    });
</script>

</body>
</html>
