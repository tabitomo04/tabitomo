<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2e4c4c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- CSRF Protection -->
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <title data-translatable>회원가입 - 타비토모</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #2e4c4c;
      --secondary-color: #5f9ea0;
      --accent-color: #ff6b6b;
      --light-gray: #f8f9fa;
      --dark-gray: #343a40;
      --error-bg: #f8d7da;
      --error-text: #721c24;
      --error-border: #f5c6cb;
      --success-color: #28a745;
      --warning-color: #ffc107;
      --info-color: #17a2b8;
    }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      margin: 0;
      padding: 0;
    }
    .signup-main {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .signup-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      width: 100%;
      max-width: 500px;
      margin: 20px;
    }
    .logo-container {
      text-align: center;
      padding: 20px 0 5px;
    }
    .logo-container img {
      max-width: 120px;
      height: auto;
      margin-bottom: 5px;
    }
    .signup-header {
      padding: 15px 25px 10px;
      text-align: center;
    }
    .signup-header h2 {
      margin: 0;
      font-weight: 700;
      color: var(--primary-color);
    }
    .signup-body {
      padding: 20px 30px 30px;
    }
    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.25rem rgba(46, 76, 76, 0.15);
    }
    .btn-signup {
      background: var(--primary-color);
      border: none;
      font-weight: 600;
      padding: 10px;
      font-size: 1.05rem;
      width: 100%;
    }
    .btn-signup:hover {
      background: #1e3c3c;
    }
    .form-check-input:checked {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }
    .form-text {
      font-size: 0.8rem;
      color: #6c757d;
    }
    .validation-message {
      font-size: 0.8rem;
      margin-top: 0.25rem;
      height: 1.25rem;
    }
    .validation-message.valid {
      color: var(--success-color);
    }
    .validation-message.invalid {
      color: var(--error-text);
    }
    .form-floating > label {
      padding: 1rem 0.75rem;
    }
    .form-floating > .form-control:focus ~ label,
    .form-floating > .form-control:not(:placeholder-shown) ~ label,
    .form-floating > .form-select ~ label {
      transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
    }
    .gender-option {
      cursor: pointer;
      transition: all 0.2s;
    }
    .gender-option:hover {
      background-color: #e9ecef;
    }
    .gender-option.selected {
      background-color: #0d6efd;
      color: white;
    }
    .email-group .form-control {
      flex: 1;
    }
    .email-group .input-group-text {
      background: none;
      border-left: none;
      padding: 0 0.75rem;
    }
    .email-group .form-control:first-child {
      border-right: none;
    }
    .email-group .form-control:focus {
      border-color: #86b7fe;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
    .verification-code-input {
      letter-spacing: 0.5rem;
      text-align: center;
      font-size: 1.25rem;
      font-weight: bold;
    }
    .timer {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #dc3545;
      font-weight: bold;
    }
    @media (max-width: 576px) {
      .form-container {
        margin: 1rem;
        padding: 1.5rem;
      }
      .btn-check-email {
        margin-top: 0.5rem;
        width: 100%;
      }
    }
  </style>
</head>

<body>

<main class="signup-main">
  <div class="signup-card">
    <div class="logo-container">
      <img src="/image/logo.png" alt="타비토모 로고" onerror="this.src='https://via.placeholder.com/180x50?text=타비토모'" />
    </div>
    <div class="signup-header">
      <h2 data-translatable>회원가입</h2>
      <div class="small text-muted" data-translatable>타비토모에 오신 것을 환영합니다</div>
    </div>
    <div class="signup-body">
        <form th:action="@{/auth/signup}" th:object="${member}" method="post" onsubmit="return handleSubmit(event)">
          <!-- 이메일 입력 필드 -->
          <input type="hidden" id="email" name="email" th:field="*{email}">
          <div class="mb-3">
            <div class="form-label" data-translatable>이메일</div>
            <div class="d-flex align-items-center gap-2">
              <div class="d-flex align-items-center flex-grow-1" role="group" aria-label="이메일 주소 입력">
                <input type="text" class="form-control" id="emailId" name="emailId" placeholder="아이디" required 
                        style="max-width: 180px;" onchange="resetEmailCheck()" th:field="*{emailId}" 
                        data-translatable="placeholder" aria-label="이메일 아이디">
                <span class="mx-2" aria-hidden="true">@</span>
                <input type="text" class="form-control" id="emailDomain" name="emailDomain" placeholder="도메인" required 
                        style="max-width: 180px;" onchange="resetEmailCheck()" th:field="*{emailDomain}" 
                        data-translatable="placeholder" aria-label="이메일 도메인">
              </div>
              <button type="button" class="btn btn-outline-primary" 
                       style="min-width: 100px; white-space: nowrap;"
                       onclick="checkEmail()" id="emailCheckBtn"
                       data-translatable>
                중복확인
              </button>
              <button type="button" id="emailVerifyBtn" class="btn btn-outline-success ms-2" 
                      style="display: none; min-width: 100px; white-space: nowrap;"
                      aria-label="이메일 인증" data-translatable>
                인증하기
              </button>
            </div>
            <div id="emailCheckResult" class="validation-message mt-1"></div>
          </div>
          
          <div class="mb-4">
            <label for="password" class="form-label" data-translatable>비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" th:field="*{password}" placeholder="8자 이상의 영문, 숫자, 특수문자 조합" data-translatable="placeholder">
            <div class="form-text" data-translatable>보안을 위해 영문, 숫자, 특수문자를 조합해주세요.</div>
          </div>

          <!-- 비밀번호 확인 -->
          <div class="mb-4">
            <label for="confirmPassword" class="form-label" data-translatable>비밀번호 확인</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" th:field="*{confirmPassword}" placeholder="비밀번호를 다시 입력해주세요" data-translatable="placeholder">
          </div>

          <!-- 닉네임 입력 -->
          <div class="mb-4">
            <label for="nickname" class="form-label" data-translatable>닉네임</label>
            <div class="input-group">
              <input type="text" class="form-control" id="nickname" name="nickname" th:field="*{nickname}" 
                     placeholder="닉네임을 입력해주세요" onkeyup="resetNicknameCheck()" data-translatable="placeholder">
              <button class="btn btn-outline-secondary" type="button" id="nicknameCheckBtn" onclick="checkNickname()" data-translatable>중복확인</button>
            </div>
            <div id="nicknameCheckResult" class="validation-message"></div>
          </div>

          <!-- 생년월일 입력 -->
          <div class="mb-4">
            <label for="dateOfBirth" class="form-label" data-translatable>생년월일</label>
            <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" th:field="*{dateOfBirth}" required
                   max="" onchange="setMaxDate()">
            <div class="form-text" data-translatable>만 14세 이상만 가입 가능합니다.</div>
            <div id="dateOfBirthError" class="text-danger"></div>
          </div>

          <!-- 국가 선택 -->
          <div class="mb-4">
            <label for="countryId" class="form-label" data-translatable>국가</label>
            <select id="countryId" name="countryId" class="form-select" required>
              <option value="" disabled data-translatable>국가를 선택하세요</option>
              <option th:each="country : ${countries}" 
                      th:value="${country.countryId}" 
                      th:text="${country.countryNameKo + ' (' + country.countryNameEn + ') (' + country.countryCode + ')'}"
                      th:data-country-code="${country.countryCode}">
              </option>
            </select>
            <input type="hidden" id="countryCode" name="countryCode" th:value="${#lists.size(countries) > 0 ? countries[0].countryCode : ''}">
            <div class="form-text" data-translatable>국가를 선택해주세요.</div>
          </div>

          <!-- 언어 선택 -->
          <div class="mb-4">
            <label for="languageId" class="form-label" data-translatable>선호 언어</label>
            <select id="languageId" name="languageId" class="form-select">
              <option value="" selected disabled data-translatable>언어를 선택하세요</option>
              <option th:each="language : ${languages}" th:value="${language.languageId}" th:text="${language.nameNative}"></option>
            </select>
          </div>

          <!-- 성별 선택 -->
          <div class="mb-4">
            <div class="form-label" data-translatable>성별</div>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="gender" id="male" autocomplete="off" value="1" th:field="*{gender}">
              <label class="btn btn-outline-primary" for="male" data-translatable>남성</label>
              
              <input type="radio" class="btn-check" name="gender" id="female" autocomplete="off" value="2" th:field="*{gender}">
              <label class="btn btn-outline-primary" for="female" data-translatable>여성</label>
              
              <input type="radio" class="btn-check" name="gender" id="other" autocomplete="off" value="3" th:field="*{gender}">
              <label class="btn btn-outline-primary" for="other" data-translatable>기타</label>
            </div>
          </div>

          <!-- 회원가입 및 취소 버튼 -->
          <div class="d-grid gap-2">
            <div class="row g-2">
              <div class="col-6">
                <button type="submit" class="btn btn-primary btn-lg w-100" data-translatable>회원가입 완료</button>
              </div>
              <div class="col-6">
                <a href="/" class="btn btn-outline-secondary btn-lg w-100" data-translatable>취소</a>
              </div>
            </div>
          </div>
        </form>
    </div>
  </div>
</main>

  <!-- 이메일 인증 모달 -->
  <div class="modal fade" id="emailVerificationModal" tabindex="-1" aria-labelledby="verificationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="verificationModalLabel" data-translatable>이메일 인증</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-4" data-translatable>이메일로 전송된 인증번호 6자리를 입력해주세요.</p>
          <div class="position-relative mb-3">
            <input type="text" class="form-control form-control-lg text-center verification-code-input" 
                   id="verificationCode" maxlength="6" 
                   oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6)" 
                   placeholder="000000">
            <div id="verificationTimer" class="timer">03:00</div>
          </div>
          <div id="verificationResult" class="validation-message text-center mb-3"></div>
          <div class="d-grid gap-2">
            <button type="button" id="verifyBtn" class="btn btn-primary" onclick="verifyEmail()" data-translatable>인증하기</button>
            <button type="button" class="btn btn-outline-secondary" onclick="sendVerificationEmail()" data-translatable>인증번호 재전송</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- JavaScript -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/translation.js}"></script>
  <script th:src="@{/js/signup.js}"></script>
  <script>
    // 성별 선택 함수
    function selectGender(element, genderValue) {
      // 모든 성별 버튼에서 selected 클래스 제거
      document.querySelectorAll('.gender-option').forEach(btn => {
        btn.classList.remove('selected');
      });
      
      // 선택한 버튼에 selected 클래스 추가
      element.classList.add('selected');
      
      // hidden input 값 설정
      document.getElementById('gender').value = genderValue;
    }
    
    // 페이지 로드 시 기본 성별 선택 (선택사항)
    document.addEventListener('DOMContentLoaded', function() {
      // 기본으로 남성 선택
      const defaultGenderBtn = document.querySelector('.gender-option[data-gender="MALE"]');
      if (defaultGenderBtn) {
        selectGender(defaultGenderBtn, 'MALE');
      }
    });
  </script>
</body>
</html>
