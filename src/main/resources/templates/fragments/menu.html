<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="menu">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/" th:classappend="${request.requestURI == '/' ? 'active' : ''}">
                        <i class="fas fa-home"></i> <span th:text="#{menu.home}">Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/tripselect/step1" th:classappend="${request.requestURI.startsWith('/tripselect') ? 'active' : ''}">
                        <i class="fas fa-route"></i> <span th:text="#{menu.travel}">여행지 추천</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/accommodation" th:classappend="${request.requestURI.startsWith('/accommodation') ? 'active' : ''}">
                        <i class="fas fa-hotel"></i> <span th:text="#{menu.accommodation}">숙소</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/restaurant" th:classappend="${request.requestURI.startsWith('/restaurant') ? 'active' : ''}">
                        <i class="fas fa-utensils"></i> <span th:text="#{menu.restaurant}">맛집</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/tripinformation" th:classappend="${request.requestURI.startsWith('/tripinformation') ? 'active' : ''}">
                        <i class="fas fa-info-circle"></i> <span>국내 여행 정보</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/community" th:classappend="${request.requestURI.startsWith('/community') ? 'active' : ''}">
                        <i class="fas fa-users"></i> <span th:text="#{menu.community}">스토리북</span>
                    </a>
                </li>
            </ul>
            <div class="d-flex" sec:authorize="!isAuthenticated()">
                <a href="/login" class="btn btn-outline-light me-2">
                    <i class="fas fa-sign-in-alt"></i> <span th:text="#{menu.login}">로그인</span>
                </a>
                <a href="/signup" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> <span th:text="#{menu.register}">회원가입</span>
                </a>
            </div>
            
            <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                <a th:href="@{/mypage}" class="btn btn-outline-light me-3">
                    <i class="fas fa-user-circle"></i> 마이페이지
                </a>
                <span class="navbar-text me-3">
                    <i class="fas fa-user"></i> <span sec:authentication="name">users</span>님
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light">
                        <i class="fas fa-sign-out-alt"></i> <span th:text="#{menu.logout}">로그아웃</span>
                    </button>
                </form>
            </div>
           
        </div>
    </div>
</nav>
</body>
</html>
