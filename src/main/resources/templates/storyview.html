<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스토리북 개별 페이지</title>
  <link rel="stylesheet" href="css/storyview.css">
  <link rel="stylesheet" href="css/style.css">


  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/main.js"></script>


  <script>
    // 유튜브 출력 코드
    $(document).ready(function() {
        document.querySelectorAll('oembed[url]').forEach(element => {
            var url = element.getAttribute('url');
            var regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#\&\?]*).*/;
            var matchs = url.match(regExp);
            if(matchs && matchs[7]){
                element.parentElement.outerHTML = `
                <div style="position: relative; height: 0; padding-bottom: 56.25%;">
                    <iframe src="https://www.youtube.com/embed/${matchs[7]}?rel=0"
                            style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;"
                            frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
                    </iframe>
                </div>`;
            }
        });
    });

    // 메뉴 클릭 시 토글메뉴 열고 닫기
    function toggleDropdown(el) {
    const menu = el.nextElementSibling;
    if (menu.style.display === 'block') {
        menu.style.display = 'none';
    } else {
        // 다른 열려 있는 메뉴 닫기
        //document.querySelectorAll('.dropdown-content').forEach(m => m.style.display = 'none');
        menu.style.display = 'block';
    }
}

// 다른 부분 클릭 시 토글메뉴 닫기
document.addEventListener('click', function(e) {
    if (!e.target.closest('.more-btn')) {
        document.querySelectorAll('.dropdown-content').forEach(m => m.style.display = 'none');
    }
});
  </script>
</head>
<body>
<div class="container">
  <!-- 태그 -->
  <div class="tags">
    <span>#힐링</span>
    <span>#제주도</span>
    <span>#풀꽃</span>
  </div>

  <!-- 제목 & 부제목 -->

  <div class="header">
    <span class="title" th:text="${post.title}"></span>
    <div class="dropdown">
      <a class="more-btn" onclick="toggleDropdown(this)">⋮</a>
      <div class="dropdown-content">
        <a th:href="@{'/edit?booknum=' + ${post.booknum}}">수정</a>
        <a th:href="@{'/delete?booknum=' + ${post.booknum}}"
           onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
      </div>
    </div>
  </div>
  <div th:text="${post.subtitle}" class="subtitle"></div>

  <!-- 메타 정보 -->
  <div class="meta">
    <div>
    <span>정민호</span> · <span th:text="${#temporals.format(post.createDate, 'yy.MM.dd')}"></span>
    </div>
    <div class="actions">
      <button onclick="clip()">URL 공유</button>
      <span>❤</span><span th:text="${post.likes}"></span>
    </div>
  </div>
  <hr class="line">
  <!-- 본문 -->
  <div>
    <div th:utext="${post.content}" class="content-block" id="postContent">
    </div>
  </div>
</div>
</body>
</html>
