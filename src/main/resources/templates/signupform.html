<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/signup.css" th:href="@{/css/signup.css}">
  <style>
    body {
      background: #f8f9fa;
      font-family: 'Noto Sans KR', sans-serif;
    }
    
    .form-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
    }
    
    .form-title {
      text-align: center;
      margin-bottom: 2rem;
      color: #333;
      font-weight: 700;
    }
    
    .form-label {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .validation-message {
      font-size: 0.875rem;
      margin-top: 0.25rem;
      height: 1.25rem;
    }
    
    .validation-message.success {
      color: #198754;
    }
    
    .validation-message.error {
      color: #dc3545;
    }
    
    .gender-option {
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .gender-option:hover {
      background-color: #e9ecef;
    }
    
    .gender-option.selected {
      background-color: #0d6efd;
      color: white;
    }
    
    /* 이메일 입력 그룹 */
    .email-group .form-control {
      flex: 1;
    }
    
    .email-group .input-group-text {
      background: none;
      border-left: none;
      padding: 0 0.75rem;
    }
    
    .email-group .form-control:first-child {
      border-right: none;
    }
    
    .email-group .form-control:focus {
      border-color: #86b7fe;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
    
    /* 모달 스타일 */
    .verification-code-input {
      letter-spacing: 0.5rem;
      text-align: center;
      font-size: 1.25rem;
      font-weight: bold;
    }
    
    .timer {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #dc3545;
      font-weight: bold;
    }
    
    @media (max-width: 576px) {
      .form-container {
        margin: 1rem;
        padding: 1.5rem;
      }
      
      .btn-check-email {
        margin-top: 0.5rem;
        width: 100%;
      }
    }
  </style>
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="form-container">
      <h1 class="form-title">회원가입</h1>
      <form th:action="@{/auth/signup}" th:object="${member}" method="post" onsubmit="return handleSubmit(event)">
        <!-- 이메일 입력 필드 -->
        <div class="mb-3">
          <label for="emailId" class="form-label">이메일</label>
          <div class="d-flex align-items-center gap-2">
            <div class="d-flex align-items-center flex-grow-1">
              <input type="text" class="form-control" id="emailId" name="emailId" placeholder="아이디" required 
                      style="max-width: 180px;" onchange="resetEmailCheck()" th:field="*{emailId}">
              <span class="mx-2">@</span>
              <input type="text" class="form-control" id="emailDomain" name="emailDomain" placeholder="도메인" required 
                      style="max-width: 180px;" onchange="resetEmailCheck()" th:field="*{emailDomain}">
            </div>
            <button type="button" class="btn btn-outline-primary" 
                     style="min-width: 100px; white-space: nowrap;"
                     onclick="checkEmail()">
              중복확인
            </button>
            <button type="button" id="emailVerifyBtn" class="btn btn-outline-success ms-2" 
                    style="display: none; min-width: 100px; white-space: nowrap;"
                    >
              인증하기
            </button>
          </div>
          <div id="emailCheckResult" class="validation-message mt-1"></div>
        </div>

        <!-- 비밀번호 입력 -->
        <div class="mb-4">
          <label for="password" class="form-label">비밀번호</label>
          <input type="password" class="form-control" id="password" name="password" th:field="*{password}" placeholder="8자 이상의 영문, 숫자, 특수문자 조합">
          <div class="form-text">보안을 위해 영문, 숫자, 특수문자를 조합해주세요.</div>
        </div>

        <!-- 비밀번호 확인 -->
        <div class="mb-4">
          <label for="confirmPassword" class="form-label">비밀번호 확인</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" th:field="*{confirmPassword}" placeholder="비밀번호를 다시 입력해주세요">
        </div>

        <!-- 닉네임 입력 -->
        <div class="mb-4">
          <label for="nickname" class="form-label">닉네임</label>
          <div class="input-group">
            <input type="text" class="form-control" id="nickname" name="nickname" th:field="*{nickname}" 
                   placeholder="닉네임을 입력해주세요" onkeyup="resetNicknameCheck()">
            <button class="btn btn-outline-secondary" type="button" id="nicknameCheckBtn" onclick="checkNickname()">중복확인</button>
          </div>
          <div id="nicknameCheckResult" class="validation-message"></div>
        </div>

        <!-- 생년월일 입력 -->
        <div class="mb-4">
          <label for="dateOfBirth" class="form-label">생년월일</label>
          <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" th:field="*{dateOfBirth}" required
                 max="" onchange="setMaxDate()">
          <div class="form-text">만 14세 이상만 가입 가능합니다.</div>
          <div id="dateOfBirthError" class="text-danger"></div>
        </div>

        <!-- 국가 선택 -->
        <div class="mb-4">
          <label for="countryId" class="form-label">국가</label>
          <select id="countryId" name="countryId" class="form-select" required>
            <option value="" disabled>국가를 선택하세요</option>
            <option th:each="country : ${countries}" 
                    th:value="${country.countryId}" 
                    th:text="${country.countryNameKo + ' (' + country.countryNameEn + ') (' + country.countryCode + ')'}"
                    th:data-country-code="${country.countryCode}">
            </option>
          </select>
          <input type="hidden" id="countryCode" name="countryCode" th:value="${#lists.size(countries) > 0 ? countries[0].countryCode : ''}">
          <div class="form-text">국가를 선택해주세요.</div>
        </div>

        <!-- 언어 선택 -->
        <div class="mb-4">
          <label for="languageId" class="form-label">선호 언어</label>
          <select id="languageId" name="languageId" class="form-select">
            <option value="" selected disabled>언어를 선택하세요</option>
            <option th:each="language : ${languages}" th:value="${language.languageId}" th:text="${language.nameNative}"></option>
          </select>
        </div>

        <!-- 성별 선택 -->
        <div class="mb-4">
          <div class="form-label">성별</div>
          <div class="btn-group w-100" role="group">
            <input type="radio" class="btn-check" name="gender" id="male" autocomplete="off" value="1" th:field="*{gender}">
            <label class="btn btn-outline-primary" for="male">남성</label>
            
            <input type="radio" class="btn-check" name="gender" id="female" autocomplete="off" value="2" th:field="*{gender}">
            <label class="btn btn-outline-primary" for="female">여성</label>
            
            <input type="radio" class="btn-check" name="gender" id="other" autocomplete="off" value="3" th:field="*{gender}">
            <label class="btn btn-outline-primary" for="other">기타</label>
          </div>
        </div>

        <!-- 회원가입 및 취소 버튼 -->
        <div class="d-grid gap-2">
          <div class="row g-2">
            <div class="col-6">
              <button type="submit" class="btn btn-primary btn-lg w-100">회원가입 완료</button>
            </div>
            <div class="col-6">
              <a href="/" class="btn btn-outline-secondary btn-lg w-100">취소</a>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 이메일 인증 모달 -->
  <div class="modal fade" id="emailVerificationModal" tabindex="-1" aria-labelledby="verificationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="verificationModalLabel">이메일 인증</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-4">이메일로 전송된 인증번호 6자리를 입력해주세요.</p>
          <div class="position-relative mb-3">
            <input type="text" class="form-control form-control-lg text-center verification-code-input" 
                   id="verificationCode" maxlength="6" 
                   oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6)" 
                   placeholder="000000">
            <div id="verificationTimer" class="timer">03:00</div>
          </div>
          <div id="verificationResult" class="validation-message text-center mb-3"></div>
          <div class="d-grid gap-2">
            <button type="button" id="verifyBtn" class="btn btn-primary" onclick="verifyEmail()">인증하기</button>
            <button type="button" class="btn btn-outline-secondary" onclick="sendVerificationEmail()">인증번호 재전송</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/signup.js" th:src="@{/js/signup.js}"></script>
  <script>
    // 성별 선택 함수 (HTML에 직접 필요한 함수만 남김)
    function selectGender(element, genderValue) {
      // 모든 성별 버튼에서 selected 클래스 제거
      document.querySelectorAll('.gender-option').forEach(btn => {
        btn.classList.remove('selected');
      });
      
      // 선택된 버튼에 selected 클래스 추가
      element.classList.add('selected');
      
      // hidden input 값 업데이트
      document.getElementById('gender').value = genderValue;
    }
  </script>
</body>

</html>
