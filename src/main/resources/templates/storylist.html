<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translatable>여행 스토리 검색 페이지</title>

    <!-- Common CSS/JS from header fragment -->
    <link rel="icon" th:href="@{/image/pabicone.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/translation.js}"></script>

    <!-- Page-specific CSS from storylist.html -->
    <link rel="stylesheet" th:href="@{/css/storylist.css}">
    <link rel="stylesheet" th:href="@{/css/paging.css}">
    <link rel="stylesheet" th:href="@{/css/modal.css}">

    <script th:src="@{/js/jquery-3.7.1.min.js}"></script>
    <!-- Page-specific JS from storylist.html -->
    <script>
        window.addEventListener('load', () => {
            if (performance.getEntriesByType("navigation")[0].type === "reload") {
                // 새로고침일 때만 실행
                history.replaceState(null, '', '/storybook/list');
            }
        });
    </script>
</head>
<body>

<!-- Header -->
<div th:insert="~{fragments/header :: header}"></div>

<!-- chatbot -->
<div th:replace="~{fragments/chatbot-button :: chatbot-container}"></div>
<link rel="stylesheet" href="/css/chatbot.css">
<script th:src="@{/js/chatbot.js}"></script>

<div class="container">
    <section class="py-5">
        <h1 id="listtitle" data-translatable>당신의 여행 이야기를 들려주세요</h1>

        <form id="searchForm" action="/storybook/list" method="get"  class="search-box">
            <input type="text" name="keyword" id="keyword" data-translatable-placeholder placeholder="검색어를 입력하세요" />
            <button type="submit" data-translatable>검색</button>
        </form>

        <div class="container mb-3 position-relative">
            <!-- 왼쪽 버튼들 (HOT / NEW) -->
            <div class="d-flex justify-content-center mb-2">
                <!-- HOT/NEW 버튼 스타일 개선: Primary 색상 적용 -->
                <button type="button" class="btn btn-outline-primary tabitomo-btn-outline me-2"
                        th:onclick="|location.href='@{/storybook/list(sort=hot)}'|">HOT</button>
                <button type="button" class="btn btn-outline-primary tabitomo-btn-outline"
                        th:onclick="|location.href='@{/storybook/list(sort=new)}'|">NEW</button>
            </div>

            <!-- 오른쪽 버튼들 (로그인 사용자용) -->
            <div class="d-flex justify-content-end flex-wrap">
                <!-- 임시저장본 버튼 스타일 개선: Primary 색상 적용 -->
                <a class="btn btn-outline-primary tabitomo-btn-outline me-2 mb-2 w-auto" id="templistBtn"
                   sec:authorize="isAuthenticated()" data-translatable>임시저장본</a>
                <!-- 새 스토리 작성 버튼 스타일 개선: Point 색상 적용 -->
                <a class="btn btn-point border-0 mb-2 w-auto"
                   onclick="checkTemp()"
                   th:href="@{'/storybook/write'}"
                   sec:authorize="isAuthenticated()"
                   data-translatable>새 스토리 작성</a>
            </div>

            <!-- 오른쪽 버튼 빈 영역 (비로그인용) -->
            <div class="d-flex justify-content-end" sec:authorize="!isAuthenticated()">&nbsp;</div>
        </div>

    </section>

    <div id="story-container">


        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4" th:each="story : ${storylist}">
                <div class="card h-100 position-relative tabitomo-card">
                    <!-- 썸네일 -->
                    <img th:src="${story.thumbnail != null ? story.thumbnail : '/image/tomo.png'}"
                         alt="썸네일"
                         class="card-img-top tabitomo-thumbnail"
                         onerror="this.onerror=null; this.src='/image/tomo.png';">

                    <!-- 카드 본문 -->
                    <div class="card-body">
                        <!-- 제목 + 좋아요 하트 -->
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title mb-0 fs-6 text-accent" th:text="${story.title}" data-translatable>제목</h5>
                            <span class="d-flex align-items-center gap-1 small fw-bold">
                            <span th:text="'❤'" th:style="${story.isLiked} ? 'color:var(--color-point)' : 'color:#ccc'"></span>
                            <span class="text-secondary" th:text="${story.likes}"></span>
                        </span>
                        </div>

                        <!-- 부제목 -->
                        <p class="card-text mb-0 fs-6 text-primary" th:text="${story.subtitle}" data-translatable>부제목</p>
                    </div>

                    <!-- 카드 하단 메타정보 -->
                    <div class="card-footer d-flex justify-content-between small text-muted tabitomo-footer" style="background-color: var(--color-secondary)">
                        <span th:text="${story.nickname}"></span>
                        <span th:text="${#temporals.format(story.createDate, 'yy.MM.dd')}"></span>
                    </div>

                    <!-- 카드 전체 클릭 -->
                    <a th:href="@{'/storybook/detail?booknum=' + ${story.booknum}}" class="stretched-link"></a>
                </div>
            </div>
        </div>


        <div th:if="${(storylist == null or storylist.isEmpty()) and (pagelist == null or pagelist.isEmpty())}" class="no-results">
            <img th:src="@{/image/pabicone.clear.png}" alt="검색결과 없음" >
            <p data-translatable>검색 결과가 없습니다.</p>
        </div>

        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4" th:each="page : ${pagelist}">
                <div class="card h-100 position-relative tabitomo-card">
                    <!-- 썸네일 -->
                    <img th:src="${page.thumbnail != null ? page.thumbnail : '/image/tomo.png'}"
                         alt="썸네일"
                         class="card-img-top tabitomo-thumbnail"
                         onerror="this.onerror=null; this.src='/image/tomo.png';">

                    <!-- 카드 본문 -->
                    <div class="card-body">
                        <!-- 제목 + 좋아요 하트 -->
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title mb-0 fs-6 text-accent" th:text="${page.title}" data-translatable>제목</h5>
                            <span class="d-flex align-items-center gap-1 small fw-bold">
                            <span th:text="'❤'" th:style="${page.isLiked} ? 'color:var(--color-point)' : 'color:#ccc'"></span>
                            <span class="text-secondary" th:text="${page.likes}"></span>
                        </span>
                        </div>

                        <!-- 부제목 -->
                        <p class="card-text mb-0 fs-6 text-primary" th:text="${page.subtitle}" data-translatable>부제목</p>
                    </div>

                    <!-- 카드 하단 메타정보 -->
                    <div class="card-footer d-flex justify-content-between small text-muted tabitomo-footer" style="background-color: var(--color-secondary)">
                        <span th:text="${page.nickname}"></span>
                        <span th:text="${#temporals.format(page.createDate, 'yy.MM.dd')}"></span>
                    </div>

                    <!-- 카드 전체 클릭 -->
                    <a th:href="@{'/storybook/detail?booknum=' + ${page.booknum}}" class="stretched-link"></a>
                </div>
            </div>
        </div>
    </div>


    <!-- 페이징 네비게이션 -->
    <div class="pagination-container"th:if="${pagelist != null and totalPages > 0}">
        <ul class="pagination">
            <!-- 이전 페이지 버튼 -->
            <li>
                <a th:if="${hasPrevious}" th:href="@{/storybook/list(sort=${sort},page=${currentPage - 1}, size=${size})}" class="pre-btn" data-translatable>이전</a>
            </li>

            <!-- 페이지 번호들 -->
            <li th:each="pageNum : ${#numbers.sequence(pageGroupStart, pageGroupEnd)}">
                <a th:href="@{/storybook/list(sort=${sort}, page=${pageNum}, size=${size})}"
                   th:text="${pageNum + 1}"
                   th:classappend="${pageNum == currentPage} ? 'current'"
                   class="page-btn"></a>
            </li>

            <!-- 다음 페이지 버튼 -->
            <li>
                <a th:if="${hasNext}" th:href="@{/storybook/list(sort=${sort},page=${currentPage + 1}, size=${size})}" class="next-btn" data-translatable>다음</a>
            </li>
        </ul>
    </div>
</div>

<!-- 모달창 -->
<div id="templistModal" class="templistModal" style="display:none;">
    <div class="templistModal-content">
        <span id="closeBtn" class="close">&times;</span>

        <h2 th:if="${templist != null and !templist.isEmpty()}" data-translatable class="text-accent">임시저장본 리스트</h2>

        <div th:if="${templist == null or templist.isEmpty()}">
            <img th:src="@{/image/pabicone.png}" alt="임시저장 없음" style="display:block; margin:0 auto 10px; width:100px; height:auto;">
            <p data-translatable class="text-primary">임시저장한 스토리북이 존재하지 않습니다.</p>
        </div>

        <div th:if="${templist != null and !templist.isEmpty()}">
            <form action="/storybook/update" method="get" onsubmit="return checkRadio()">
                <div class="table-container">
                    <table id="temptable">
                        <tr>
                            <th class="col-select" data-translatable>선택</th>
                            <th class="col-title" data-translatable>제목</th>
                            <th class="col-subtitle" data-translatable>부제목</th>
                            <th class="col-date" data-translatable>작성날짜</th>
                            <th class="col-del" data-translatable>삭제</th>
                        </tr>

                        <tr th:if="${templist}" th:each="templist : ${templist}">
                            <td class="col-select"><input type="radio" name="tempId" th:value="${templist.tempId}"></td>
                            <td class="col-title text-accent" th:text="${templist.title}" data-translatable></td>
                            <td class="col-subtitle text-primary" th:text="${templist.subtitle}" data-translatable></td>
                            <td class="col-date" th:text="${#temporals.format(templist.updateDate, 'yy.MM.dd')}"></td>
                            <td class="col-del del"><a th:href="@{'/storybook/tempdelete?tempId=' + ${templist.tempId}}"
                                                       onclick="return confirm('정말 삭제할까요?')">&times;</a></td>
                        </tr>
                    </table>
                </div>
                <button type="submit" class="tempbtn tabitomo-btn-point" data-translatable>불러오기</button>
            </form>
        </div>


    </div>
</div>

<script>
    // ... 기존 JavaScript 코드 유지 ...

    const modal = document.querySelector('#templistModal');
    const closeBtn = document.querySelector('#closeBtn');
    const templistBtn = document.querySelector('#templistBtn');

    templistBtn.addEventListener("click", ()=> {
        modal.style.display="block";
    });
    closeBtn.addEventListener("click", ()=> {
        modal.style.display="none";
    });

     function checkRadio() {
      const radios = document.querySelectorAll('input[name="tempId"]');
      let checked = false;
      radios.forEach(radio => {
        if (radio.checked) {
          checked = true;
        }
      });

      if (!checked) {
        alert("임시저장본을 선택해주세요!");
        return false; // 제출 막기
      }
      return true; // 통과하면 제출됨
    }

    // 엔터로 검색

    const input = document.getElementById("keyword");
  input.addEventListener("keydown", function(e) {
      if(e.key === "Enter") {
          e.preventDefault();
          const keyword = input.value.trim();
          if(keyword) {
              window.location.href = `/storybook/list?keyword=${encodeURIComponent(keyword)}`;
          }
      }
  });
</script>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- Tabitomo Custom CSS for Colors/Variables -->
<style>
    :root {
        --color-primary: #5D6C7E;
        --color-point: #E88326;
        --color-secondary: #F2F4F7;
        --color-accent: #293341;
    }
    .btn-point {
        background-color: var(--color-point) !important;
        color: white !important;
        border-color: var(--color-point) !important;
        transition: background-color 0.2s, box-shadow 0.2s;
    }
    .btn-point:hover {
        background-color: #d17522 !important; /* 약간 어두운 오렌지 */
        box-shadow: 0 4px 10px rgba(232, 131, 38, 0.3);
    }
    .tabitomo-btn-outline {
        color: var(--color-primary);
        border-color: var(--color-primary);
        transition: all 0.2s;
    }
    .tabitomo-btn-outline:hover {
        background-color: var(--color-primary);
        color: white;
    }
    /* 카드 디자인 개선 */
    .tabitomo-card {
        border: 1px solid var(--color-secondary);
        border-radius: 12px !important;
        transition: transform 0.2s, box-shadow 0.2s;
        overflow: hidden;
    }
    .tabitomo-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }
    .tabitomo-thumbnail {
        height: 180px; /* 고정 높이 */
        object-fit: cover;
        border-radius: 12px 12px 0 0;
    }
    .tabitomo-footer {
        border-top: none;
        background-color: transparent !important; /* 카드의 배경색을 따르도록 */
        color: var(--color-primary) !important;
        font-weight: 500;
    }
</style>
</body>
</html>
