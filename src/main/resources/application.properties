# Application
spring.application.name=tabitomo

# API Configuration
api.base-url=http://localhost:8080

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Security Headers
spring.security.headers.frame-options=SAMEORIGIN

# ======================
# Database Configuration
# ======================
# DataSource Configuration
spring.datasource.url=jdbc:mysql://35.185.255.44:3306/tabitomo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=user
