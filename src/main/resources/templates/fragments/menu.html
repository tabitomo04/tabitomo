<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="menu">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" th:classappend="${#strings.equals(requestURI, '/') ? 'active' : ''}">
                        <i class="fas fa-home"></i> <span data-translatable>Home</span>
                    </a>
                </li>
                <li class="nav-item dropdown" th:classappend="${#strings.startsWith(requestURI, '/about') or #strings.startsWith(requestURI, '/contact') or #strings.startsWith(requestURI, '/privacy') or #strings.startsWith(requestURI, '/terms') ? 'active' : ''}">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-info-circle"></i> <span data-translatable>소개</span>
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" th:href="@{/about}" data-translatable>About Us</a></li>
                        <li><a class="dropdown-item" th:href="@{/contact}" data-translatable>Contact</a></li>
                        <li><a class="dropdown-item" th:href="@{/privacy}" data-translatable>Privacy Policy</a></li>
                        <li><a class="dropdown-item" th:href="@{/terms}" data-translatable>Terms of Service</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tripselect/step1}" th:classappend="${#strings.startsWith(requestURI, '/tripselect')} ? 'active' : ''">
                        <i class="fas fa-route"></i> <span data-translatable>여행지 추천</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/trips/public}" th:classappend="${#strings.startsWith(requestURI, '/trips/public')} ? 'active' : ''">
                        <i class="fas fa-globe"></i> <span data-translatable>모두의 여행</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tripinformation}" th:classappend="${#strings.startsWith(requestURI, '/tripinformation')} ? 'active' : ''">
                        <i class="fas fa-info-circle"></i> <span data-translatable>국내여행정보</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/storybook/list}" th:classappend="${#strings.startsWith(requestURI, '/storybook')} ? 'active' : ''">
                        <i class="fas fa-users"></i> <span data-translatable>스토리북</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/chatbot/intro}" th:classappend="${#strings.startsWith(requestURI, '/chatbot/intro')} ? 'active' : ''">
                        <i class="fas fa-comment-dots"></i> <span data-translatable>챗봇 사용</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('admin')">
                    <a class="nav-link" th:href="@{/admin}" th:classappend="${#strings.startsWith(requestURI, '/admin')} ? 'active' : ''">
                        <i class="fas fa-user-shield"></i> <span data-translatable>관리자 페이지</span>
                    </a>
                </li>
            </ul>

            <!-- When Not Authenticated -->
            <div class="d-flex" sec:authorize="!isAuthenticated()">
                <a th:href="@{/auth/login}" class="btn btn-outline-light me-2">
                    <i class="fas fa-sign-in-alt"></i> <span data-translatable>로그인</span>
                </a>
                <a th:href="@{/auth/signup}" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> <span data-translatable>회원가입</span>
                </a>
            </div>

            <!-- When Authenticated -->
            <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                <a th:href="@{/member/mypage}" class="btn btn-outline-light me-3">
                    <i class="fas fa-user-circle"></i> <span data-translatable>마이페이지</span>
                </a>
                <span class="navbar-text me-3">
                    <i class="fas fa-user"></i>
                    <span sec:authentication="principal.nickname">Nickname</span><span data-translatable>님</span>
                </span>
                <form th:action="@{/auth/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light">
                        <i class="fas fa-sign-out-alt"></i> <span data-translatable>로그아웃</span>
                    </button>
                </form>
            </div>

        </div>
    </div>
</nav>
</body>
</html>
