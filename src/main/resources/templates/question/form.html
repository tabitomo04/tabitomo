<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 취향 설문</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .question-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .question-section {
            margin-bottom: 3rem;
            padding: 1.5rem;
            border: 1px solid #e3e6f0;
            border-radius: 8px;
            background-color: #f8f9fc;
        }
        .question-title {
            color: #4e73df;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
        .option-label {
            display: block;
            padding: 0.75rem 1.25rem;
            margin-bottom: 0.5rem;
            background-color: white;
            border: 1px solid #d1d3e2;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-label:hover {
            border-color: #b7b9cc;
            background-color: #f8f9fc;
        }
        .form-check-input:checked + .option-label {
            background-color: #eaecf4;
            border-color: #4e73df;
            color: #4e73df;
        }
        .form-check-input {
            display: none;
        }
        .progress {
            height: 10px;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body class="bg-light">
    <div th:replace="fragments/header :: header"></div>
    
    <div class="container">
        <form th:action="@{/question/submit}" th:object="${questionAnswers}" method="post" class="question-container">
            <div class="text-center mb-4">
                <h2>여행 취향 설문 조사</h2>
                <p class="text-muted">당신의 여행 스타일을 알려주시면 더 나은 추천을 드릴 수 있어요!</p>
                <div class="progress">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>

            <!-- 취미/관심사 (다중 선택) -->
            <div class="question-section" id="hobbies-section">
                <h4 class="question-title">1. 어떤 활동에 관심이 있으신가요? (다중 선택 가능)</h4>
                <div class="row">
                    <div th:each="hobby : ${questionsByCategory.get(1)}" class="col-md-6 mb-2">
                        <input type="checkbox" th:field="*{hobbies}" th:value="${hobby.infoLowNum}" class="form-check-input" id="hobby-${hobby.infoLowNum}">
                        <label th:for="${'hobby-' + hobby.infoLowNum}" class="option-label">
                            <i class="fas me-2" th:classappend="'fa-' + ${hobby.content}"></i>
                            <span th:text="${hobby.infoName}"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- MBTI (단일 선택) -->
            <div class="question-section" id="mbti-section">
                <h4 class="question-title">2. 당신의 MBTI는 무엇인가요? (선택사항)</h4>
                <div class="row">
                    <div th:each="mbti : ${questionsByCategory.get(2)}" class="col-6 col-md-3 mb-2">
                        <input type="radio" th:field="*{mbti}" th:value="${mbti.infoName}" class="form-check-input" th:id="'mbti-' + ${mbti.infoLowNum}">
                        <label th:for="${'mbti-' + mbti.infoLowNum}" class="option-label text-center">
                            <span th:text="${mbti.infoName}"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 여행 스타일 (다중 선택) -->
            <div class="question-section" id="travel-style-section">
                <h4 class="question-title">3. 선호하는 여행 스타일은 무엇인가요? (다중 선택 가능)</h4>
                <div class="row">
                    <div th:each="style : ${questionsByCategory.get(3)}" class="col-md-6 mb-2">
                        <input type="checkbox" th:field="*{travelStyles}" th:value="${style.infoLowNum}" class="form-check-input" th:id="'style-' + ${style.infoLowNum}">
                        <label th:for="${'style-' + style.infoLowNum}" class="option-label">
                            <i class="fas me-2" th:classappend="'fa-' + ${style.content}"></i>
                            <span th:text="${style.infoName}"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 동반자 (다중 선택) -->
            <div class="question-section" id="companions-section">
                <h4 class="question-title">4. 주로 누구와 여행을 가시나요? (다중 선택 가능)</h4>
                <div class="row">
                    <div th:each="companion : ${questionsByCategory.get(4)}" class="col-md-6 mb-2">
                        <input type="checkbox" th:field="*{companions}" th:value="${companion.infoLowNum}" class="form-check-input" th:id="'companion-' + ${companion.infoLowNum}">
                        <label th:for="${'companion-' + companion.infoLowNum}" class="option-label">
                            <i class="fas me-2" th:classappend="'fa-' + ${companion.content}"></i>
                            <span th:text="${companion.infoName}"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 음식 선호도 (다중 선택) -->
            <div class="question-section" id="food-section">
                <h4 class="question-title">5. 선호하는 음식은 무엇인가요? (다중 선택 가능)</h4>
                <div class="row">
                    <div th:each="food : ${questionsByCategory.get(5)}" class="col-md-6 mb-2">
                        <input type="checkbox" th:field="*{foodPreferences}" th:value="${food.infoLowNum}" class="form-check-input" th:id="'food-' + ${food.infoLowNum}">
                        <label th:for="${'food-' + food.infoLowNum}" class="option-label">
                            <i class="fas me-2" th:classappend="'fa-' + ${food.content}"></i>
                            <span th:text="${food.infoName}"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between mt-5">
                <a th:href="@{/question/start}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i> 이전으로
                </a>
                <button type="submit" class="btn btn-primary">
                    제출하기 <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </div>
        </form>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 프로그레스 바 업데이트
        function updateProgress() {
            const sections = document.querySelectorAll('.question-section');
            const currentSection = document.querySelector('.question-section:target') || sections[0];
            const currentIndex = Array.from(sections).indexOf(currentSection);
            const progress = ((currentIndex + 1) / sections.length) * 100;
            document.querySelector('.progress-bar').style.width = progress + '%';
            document.querySelector('.progress-bar').setAttribute('aria-valuenow', progress);
        }

        // 섹션 스크롤 애니메이션
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                if (targetId === '#') return;
                
                document.querySelector(targetId).scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
                
                updateProgress();
            });
        });

        // 폼 제출 시 유효성 검사
        document.querySelector('form').addEventListener('submit', function(e) {
            const checkboxes = this.querySelectorAll('input[type="checkbox"]:checked');
            if (checkboxes.length === 0) {
                e.preventDefault();
                alert('하나 이상의 항목을 선택해주세요.');
            }
        });

        // 페이지 로드 시 프로그레스 바 초기화
        document.addEventListener('DOMContentLoaded', updateProgress);
    </script>
</body>
</html>
